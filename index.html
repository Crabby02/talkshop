}
function ckPay(){
  if(ck.proc) return;
  if(ck.payTab!=="card") return;
  if(ck.cfg&&!ck.cfg.demo){ ckPayLive(); return; }
  ck.err=null;
  if(!ckValidDemoCard()){ rerenderCk(); return; }
  ck.proc=true; rerenderCk();
  const payload=ck.payload, num=(ck.cc.num||"").replace(/\D/g,"");
  setTimeout(()=>{
    if(!ck||ck.payload!==payload) return;
    ck.proc=false;
    if(num==="4000000000000002"){
      ck.err=t("ck_failed"); rerenderCk();
    } else {
      ckDone();
    }
  },1800);
}
async function ckPayLive(){
  if(ck.proc) return;
  const fail=m=>{
    ck.proc=false;
    const e=$("#ckErr3"); if(e) e.innerHTML='<div class="ck-err">'+esc(m)+'</div>';
    const btn=$("#ckGoBtn"); if(btn){ btn.disabled=false; btn.innerHTML=ckGoBtnHtml(cartTotals()); }
  };
  try{
    await loadStripeJs();
    const pk=ck.cfg&&ck.cfg.publishableKey;
    if(!window.Stripe||!pk){ fail(t("ck_failed")); return; }
    if(!ck.stripe){
      ck.stripe=Stripe(pk);
      ck.cardEl=ck.stripe.elements().create("card",{style:{base:{fontSize:"16px",color:"#1B1B18",fontFamily:"system-ui,sans-serif","::placeholder":{color:"#8a877c"}}}});
      mountStripe();
    }
    const minor=toMinor(cartTotals().total,fxCur);
    if(minor<1){ fail(t("ck_failed")); return; }
    ck.proc=true; ck.err=null;
    const btn=$("#ckGoBtn");
    if(btn){ btn.disabled=true; btn.innerHTML='<span class="ck-spin"></span><span>'+esc(t("ck_processing"))+'</span>'; }
    const orderId=ckOrderId();
    const r=await fetch("/api/create-payment-intent",{
      method:"POST",headers:{"Content-Type":"application/json"},
      body:JSON.stringify({amount:minor,currency:fxCur,orderId:orderId,shop:ck.d.name})
    });
    const j=await r.json().catch(()=>({}));
    if(!r.ok||!j.clientSecret){
      if(j.demo){ ck.cfg={demo:true,publishableKey:null}; ck.proc=false; rerenderCk(); }
      else fail(t("ck_failed"));
      return;
    }
    const nm=((ck.cc&&ck.cc.name)||"").trim();
    const res=await ck.stripe.confirmCardPayment(j.clientSecret,{
      payment_method:{card:ck.cardEl,billing_details:{name:nm||undefined}}
    });
    if(res.error){ fail(res.error.message||t("ck_failed")); return; }
    if(res.paymentIntent&&res.paymentIntent.status==="succeeded"){ ckDone(); return; }
    fail(t("ck_failed"));
  }catch(e){ fail(t("ck_failed")); }
}

  const chip=e.target.closest("[data-cat]");

  const askBtn=e.target.closest("[data-ask]");

    const i=+askBtn.getAttribute("data-ask");
    askAbout(i, selViOf(shopRT.d.products[i], i));
    return;
  }
  const addBtn=e.target.closest("[data-add]");
  if(addBtn && !addBtn.disabled){
    const i=+addBtn.getAttribute("data-add");
    addToCart(i, selViOf(shopRT.d.products[i], i));
    renderProds(); renderCartBar(true);
    return;
  }
  const inc=e.target.closest("[data-pinc]");
  if(inc){
    const i=+inc.getAttribute("data-pinc");
    addToCart(i, selViOf(shopRT.d.products[i], i));

  if(dec){

    const p=shopRT.d.products[i], vi=selViOf(p, i);

    if(l){ l.qty--; if(l.qty<=0) shopRT.cart.splice(shopRT.cart.indexOf(l),1); saveShop(); }

  const isShop = back.replace(/^#\/?/,"").indexOf("s/")===0;
  const langRows = Object.keys(LANG_NAMES).map(l=>
    '<button class="loc-row'+(l===uiLang?' on':'')+'" data-lang="'+l+'"><span class="tt"><b>'+LANG_NAMES[l]+'</b><small>'+LANG_ENGLISH_NAMES[l]+'</small></span><span class="ck">\u2713</span></button>'
  ).join("");
  let ccBlock;
  if(isShop){
    let scc = null;
    try{ const d = decodeSite(back.replace(/^#\/?/,"").slice(2)); if(d && d.loc && d.loc.cc && COUNTRY[d.loc.cc]) scc = d.loc.cc; }catch(e){}
    const cur = scc ? COUNTRY[scc].cur : fxCur;
    ccBlock = '<div class="loc-sec">'+t("locale_country")+'</div><div class="loc-note">'
      + t("locale_shopnote").replace("{cur}", cur) + '</div>';
  } else {
    const pills = REGION_KEYS.map(r=>
      '<button class="loc-pill" data-jump="'+r+'">'+t(REGION_KEY[r])+'</button>'
    ).join("");
    const sections = REGION_KEYS.map(r=>{
      const codes = Object.keys(COUNTRY).filter(c=>REGION_OF[c]===r)
        .sort((a,b)=>countryName(a).localeCompare(countryName(b), LOCALE_TAG[uiLang]||"en"));
      return '<section class="loc-region" id="locR-'+r+'"><div class="loc-reghead">'+t(REGION_KEY[r])+'</div>'
        + '<div class="loc-list">'+codes.map(locRowHTML).join("")+'</div></section>';
    }).join("");
    ccBlock = '<div class="loc-stick" id="locStick">'
      + '<input class="loc-search" id="locSearch" type="search" autocomplete="off" placeholder="'+t("loc_search")+'" aria-label="'+t("loc_search")+'">'
      + '<div class="loc-pills">'+pills+'</div></div>'
      + '<div class="loc-grid" id="locRegions">'+sections+'</div>'
      + '<div class="loc-none" id="locNone">'+t("loc_none")+'</div>';
  }
  return header()
    + '<div class="wrap" id="locWrap" style="padding:40px 22px 90px;max-width:720px;">'
    + '<a class="loc-back" href="'+back+'">\u2039 '+t("locale_back")+'</a>'
    + '<h1 class="serif" style="font-size:clamp(30px,5vw,44px);margin:0 0 6px;">'+t("locale_title")+'</h1>'
    + '<p style="color:var(--ink2);font-size:16px;margin:0;">'+t("locale_note")+'</p>'
    + '<div class="loc-sec">'+t("locale_lang")+'</div><div class="loc-list">'+langRows+'</div>'
    + ccBlock
    + '</div>' + footer();
}
function foldStr(s){
  return String(s||"").normalize("NFD").replace(/[\u0300-\u036f]/g,"").toLowerCase();
}
function wireLocale(){
  const back = localeBack();
  const backPayload = back.replace(/^#\/?/,"").indexOf("s/")===0 ? back.replace(/^#\/?/,"").slice(2) : null;
  document.querySelectorAll('.loc-row[data-lang]').forEach(b=>{
    b.onclick = ()=>{
      const l = b.getAttribute("data-lang");
      if(backPayload){ try{ sessionStorage.setItem("ts_shop_lang", JSON.stringify({ ref: backPayload, lang: l })); }catch(e){} }
      // Per-tab only: never the URL, never localStorage.
      setLang(l, false, true);
    };
  });
  document.querySelectorAll('.loc-row[data-cc]').forEach(b=>{
    b.onclick = ()=> pickCountry(b.getAttribute("data-cc"));
  });
  const stick = document.getElementById("locStick");
  if(stick){
    // Keep sticky section headers below the sticky toolbar, and anchor jumps
    // clear of both.
    const setStick = ()=>{
      const stickH = stick.offsetHeight + 66;
      const wrap = document.getElementById("locWrap");
      if(wrap){
        wrap.style.setProperty("--stick", (stickH + 8) + "px");
        document.querySelectorAll(".loc-region").forEach(s=>{ s.style.scrollMarginTop = (stickH + 12) + "px"; });
      }
    };
    const inp = document.getElementById("locSearch");
    const none = document.getElementById("locNone");
    const regionsEl = document.getElementById("locRegions");
    let activeRegion = null;
    const applyRegionFilter = ()=>{
      document.querySelectorAll(".loc-pill").forEach(x=>{
        x.classList.toggle("mine", x.getAttribute("data-jump")===activeRegion);
      });
      document.querySelectorAll(".loc-region").forEach(sec=>{
        const show = !activeRegion || sec.id === "locR-" + activeRegion;
        sec.style.display = show ? "" : "none";
      });
      if(none) none.style.display = "none";
      setStick();
    };
    const filter = ()=>{
      const q = foldStr(inp.value.trim());
      if(q && activeRegion){
        activeRegion = null;
        document.querySelectorAll(".loc-pill").forEach(x=>x.classList.remove("mine"));
      }
      let any = false;
      document.querySelectorAll(".loc-region").forEach(sec=>{
        let vis = 0;
        sec.querySelectorAll(".loc-row[data-cc]").forEach(row=>{
          const cc = row.getAttribute("data-cc");
          const hay = foldStr((CC_ENDO[cc]||"") + " " + countryName(cc) + " " + COUNTRY[cc].name + " " + COUNTRY[cc].cur + " " + cc);
          const show = !q || hay.indexOf(q) !== -1;
          row.style.display = show ? "" : "none";
          if(show) vis++;
        });
        sec.style.display = vis ? "" : "none";
        if(vis) any = true;
      });
      if(none) none.style.display = any ? "none" : "block";
      setStick();
    };
    inp.addEventListener("input", filter);
    inp.addEventListener("keydown", e=>{ if(e.key === "Escape"){ inp.value = ""; filter(); inp.blur(); } });
    document.querySelectorAll(".loc-pill").forEach(p=>{
      p.onclick = ()=>{
        const r = p.getAttribute("data-jump");
        activeRegion = (activeRegion === r) ? null : r;
        if(inp) inp.value = "";
        document.querySelectorAll(".loc-region .loc-row[data-cc]").forEach(row=>{ row.style.display = ""; });
        applyRegionFilter();
        if(activeRegion && regionsEl){
          const y = regionsEl.getBoundingClientRect().top + window.scrollY - (stick.offsetHeight + 78);
          window.scrollTo({ top: Math.max(0, y), behavior: "smooth" });
        } else {
          window.scrollTo({ top: 0, behavior: "smooth" });
        }
      };
    });
    setStick();
    window.addEventListener("resize", setStick);
  }
}
async function pickCountry(cc){
  const cfg = COUNTRY[cc]; if(!cfg) return;
  state.cc = cc;
  await setCurrency(cfg.cur);
  persistLocale();
  router();
}
/* ============================== router ============================== */
/* Locale precedence on a storefront: explicit viewer override (this tab) >
   shop's baked-in language > saved preference > browser language > English.
   Currency always follows the shop. Viewer overrides never touch the hash,
   so shared links always carry the shop's original locale. */
async function applyShopLocale(d, payload){
  let lang = null;
  try{ const o = JSON.parse(sessionStorage.getItem("ts_shop_lang")||"null"); if(o && o.ref===payload && STR[o.lang]) lang = o.lang; }catch(e){}
  const loc = d.loc || {};
  if(!lang) lang = (loc.lang && STR[loc.lang]) ? loc.lang : null;
  if(!lang){ try{ const sv = localStorage.getItem("ts_ui"); if(sv && STR[sv]) lang = sv; }catch(e){} }
  if(!lang){ const bl = String(navigator.language||"en").slice(0,2).toLowerCase(); lang = STR[bl] ? bl : "en"; }
  uiLang = lang; applyLangHead();
  const shopCC = (loc.cc && COUNTRY[loc.cc]) ? loc.cc : null;
  state.cc = shopCC;
  if(shopCC){
    const cur = COUNTRY[shopCC].cur;
    if(cur !== fxCur){ fxCur = cur; fxRate = FX_FALLBACK[cur]||1; }
  }
  render(siteView(d, payload));
  initShop(d, payload);
  window.scrollTo(0,0);
  maybeShopInfoBanner(d);
  if(shopCC){
    const cur = COUNTRY[shopCC].cur;
    try{
      const r = await fetch("https://api.frankfurter.app/latest?from=USD&to=" + cur);
      const j = await r.json();
      const rate = (j.rates && j.rates[cur]) ? j.rates[cur] : (FX_FALLBACK[cur]||1);
      if(rate !== fxRate && location.hash.replace(/^#\/?/,"").indexOf("s/")===0){ fxRate = rate; render(siteView(d, payload)); initShop(d, payload); }
    }catch(e){}
  }
}
function router(){
  const h = location.hash.replace(/^#\/?/, "");
  const wasShop = !!state.isShop;
  state.isShop = (h.indexOf("s/")===0||h.indexOf("checkout/")===0);
  if(wasShop && !state.isShop){
    // leaving a storefront: restore the viewer's own currency preference
    let sc = null;
    try{ sc = (JSON.parse(localStorage.getItem("ts_locale")||"null")||{}).cur; }catch(e){}
    if(sc && FX_FALLBACK[sc] && sc !== fxCur){
      fxCur = sc; fxRate = FX_FALLBACK[sc];
      setCurrency(sc).then(()=>{ try{ router(); }catch(e){} });
    }
  }
  if(h.indexOf("checkout/")===0){
    const payload = h.slice(9);
    const d = decodeSite(payload);
    if(d){ startCheckout(d, payload); return; }
    render(notFoundView());
  } else if(h.indexOf("s/")===0){
    const payload = h.slice(2);
    const d = decodeSite(payload);
    if(d){ applyShopLocale(d, payload); return; }
    render(notFoundView());
  } else if(h.indexOf("edit/")===0){
    const d = decodeSite(h.slice(5));
    if(d){ state.data = d; state.step = 2; state.transcript = ""; render(buildView()); wireBuild(); }
    else render(notFoundView());
  } else if(h==="privacy"){
    render(privacyView());
  } else if(h==="terms"){
    render(termsView());
  } else if(h==="locale"){
    render(localeView()); wireLocale();
  } else if(h==="build" || h.indexOf("build")===0){
    render(buildView()); wireBuild();
  } else {
    render(homeView());
    afterHome();
  }
  window.scrollTo(0,0);
}
window.addEventListener("hashchange", router);
if(!STR[uiLang]) uiLang = "en";
applyLangHead();
router();
initLocale();
</script>
