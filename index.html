/* ============================== shop runtime: cart + checkout ============================== */
let shopRT = null;
const cartStore = {};
/* ---- persistent cart: localStorage, keyed per shop ----
   Primary key is the server ID when the shop has one; a payload-hash mirror
   is always written too so legacy payload links and the checkout route (which
   carry no ID) resolve to the same cart. */
function hashStr(s){
  let h=5381;
  for(let i=0;i<s.length;i++){ h=((h<<5)+h+s.charCodeAt(i))|0; }
  return (h>>>0).toString(36);
}
function shopCartKeys(serverId, payload){
  const keys=[];
  if(serverId) keys.push("ts_cart_"+serverId);
  keys.push("ts_cart_p"+hashStr(payload||""));
  return keys;
}
function readCartLS(serverId, payload){
  const keys=shopCartKeys(serverId, payload);
  let best=null, bestTs=-1;
  for(let i=0;i<keys.length;i++){
    try{
      const raw=localStorage.getItem(keys[i]);
      if(!raw) continue;
      const o=JSON.parse(raw);
      if(o&&typeof o==="object"&&Array.isArray(o.cart)){
        const ts=(typeof o._ts==="number")?o._ts:0;
        if(ts>=bestTs){ best=o; bestTs=ts; }
      }
    }catch(e){}
  }
  return best;
}
function writeCartLS(serverId, payload, data){
  let s=null;
  try{ s=JSON.stringify(data); }catch(e){ return; }
  const keys=shopCartKeys(serverId, payload);
  for(let i=0;i<keys.length;i++){ try{ localStorage.setItem(keys[i], s); }catch(e){} }
}
/* ---- order-again: last completed order, per shop, for one-tap reorder ---- */
function reorderKeys(serverId, payload){
  const keys=[];
  if(serverId) keys.push("ts_reorder_"+serverId);
  keys.push("ts_reorder_p"+hashStr(payload||""));
  return keys;
}
function saveReorder(serverId, payload, items){
  try{
    const s=JSON.stringify({items:items,_ts:Date.now()});
    const keys=reorderKeys(serverId, payload);
    for(let i=0;i<keys.length;i++){ try{ localStorage.setItem(keys[i], s); }catch(e){} }
  }catch(e){}
}
function readReorder(serverId, payload){
  const keys=reorderKeys(serverId, payload);
  let best=null, bestTs=-1;
  for(let i=0;i<keys.length;i++){
    try{
      const o=JSON.parse(localStorage.getItem(keys[i]));
      if(o&&typeof o==="object"&&Array.isArray(o.items)){
        const ts=(typeof o._ts==="number")?o._ts:0;
        if(ts>=bestTs){ best=o; bestTs=ts; }
      }
    }catch(e){}
  }
  return best;
}
/* Map a saved reorder snapshot back onto the current catalog. Matches by
   product+variant name so a merchant republish that reorders products can
   never remap to the wrong item; skips out-of-stock or vanished items. */
function reorderLines(){
  const RT=shopRT;
  if(!RT||!RT.d) return null;
  const saved=readReorder(RT.serverId, RT.payload);
  if(!saved||!saved.items||!saved.items.length) return null;
  const prods=RT.d.products||[];
  const fullName=function(p,v){ return ((p.k&&PROD_EN[p.k])||p.name||"")+(v?" ("+v.n+")":""); };
  const lines=[]; let skipped=0;
  for(let s=0;s<saved.items.length;s++){
    const si=saved.items[s];
    const qty=Math.min(99,Math.max(1,si.qty|0));
    let pi=-1;
    const atIdx=prods[si.pi|0];
    if(atIdx){
      const av=(atIdx.variants&&si.vi!=null)?atIdx.variants[si.vi]:null;
      if(fullName(atIdx,av)===si.name) pi=si.pi|0;
    }
    if(pi<0){
      for(let i=0;i<prods.length;i++){
        const p=prods[i];
        if(si.vi!=null&&!(p.variants&&p.variants[si.vi])) continue;
        const v=(p.variants&&si.vi!=null)?p.variants[si.vi]:null;
        if(fullName(p,v)===si.name){ pi=i; break; }
      }
    }
    if(pi<0){ skipped++; continue; }
    const p=prods[pi];
    if(!p||p.stock==="out"){ skipped++; continue; }
    if(si.vi!=null&&(!p.variants||!p.variants[si.vi])){ skipped++; continue; }
    lines.push({pi:pi,vi:(si.vi==null?null:si.vi),qty:qty});
  }
  return lines.length?{lines:lines,skipped:skipped}:null;
}
function doReorder(){
  const RT=shopRT;
  if(!RT) return;
  const ro=reorderLines();
  if(!ro) return;
  for(let i=0;i<ro.lines.length;i++){
    const l=ro.lines[i];
    const ex=RT.cart.find(function(x){ return x.pi===l.pi&&x.vi===l.vi; });
    if(ex) ex.qty=Math.min(99,ex.qty+l.qty);
    else RT.cart.push({pi:l.pi,vi:l.vi,qty:l.qty});
  }
  saveShop(); renderCartBar(true); renderDrawer();
  if(ro.skipped>0){
    const err=$("#dErr");
    if(err) err.innerHTML='<div class="d-err">'+esc("{n} items unavailable".replace("{n}",ro.skipped))+'</div>';
  }
}

function openStatus(hrs){
  if(!hrs) return null;
  const now=new Date(), day=now.getDay(), mins=now.getHours()*60+now.getMinutes();
  const todays=hrs[day];
  if(todays){
    const o=parseHM(todays.o), c=parseHM(todays.c);
    if(o!=null && c!=null){
      const open = c>o ? (mins>=o && mins<c) : (mins>=o || mins<c);
      if(open) return {open:true};
    }
  }
  for(let i=0;i<8;i++){
    const dd=(day+i)%7, h=hrs[dd];
    if(!h) continue;
    const o=parseHM(h.o);
    if(o==null) continue;
    if(i===0 && mins>=o) continue;
    return {open:false, day:dd, time:h.o};
  }
  return {open:false};
}
function priceLabel(p, vi){
  const v=(p.variants && vi!=null)?p.variants[vi]:null;
  if(v) return v.usd!=null?fmt(v.usd):((v.p&&parseNum(v.p)!=null)?shopMoney(parseNum(v.p)):(v.p||""));
  return p.usd!=null?fmt(p.usd):((p.price&&parseNum(p.price)!=null)?shopMoney(parseNum(p.price)):(p.price||""));
}
function priceNum(p, vi){
  const v=(p.variants && vi!=null)?p.variants[vi]:null;
  const usd=v?v.usd:p.usd;
  if(usd!=null) return usd*fxRate;
  let s=String(v?v.p:(p.price||""));
  if(s.indexOf(",")>=0 && s.indexOf(".")<0) s=s.replace(",",".");
  s=s.replace(/,/g,"");
  const m=s.match(/[\d]+(?:\.\d+)?/);
  return m?parseFloat(m[0]):0;
}

function cartTotals(){
  const RT=shopRT, d=RT.d;

  RT.cart.forEach(l=>{ const p=d.products[l.pi]; if(p) sub+=priceNum(p,l.vi)*l.qty; });
  let disc=0;
  const c=RT.coupon;
  if(c){
    if(c.type==="pct") disc=sub*c.val/100;

  }
  const after=sub-disc;

  if(RT.fulfillment==="delivery" && d.dlv){
    const fv=RT.usdShop?(d.dlv.fee||0)*fxRate:(d.dlv.fee||0);

      const fa=RT.usdShop?d.dlv.freeAbove*fxRate:d.dlv.freeAbove;
      fee=after>=fa?0:fv;

/* ============================== typo-tolerant shop search ============================== */
function sNorm(s){ return foldStr(s); }
function sEdit(a,b){
  const m=a.length,n=b.length;
  if(!m) return n; if(!n) return m;
  let prev=new Array(n+1),cur=new Array(n+1),tmp;
  for(let j=0;j<=n;j++) prev[j]=j;
  for(let i=1;i<=m;i++){
    cur[0]=i; const ca=a.charCodeAt(i-1);
    for(let j=1;j<=n;j++){
      const c=ca===b.charCodeAt(j-1)?0:1;
      const d=Math.min(prev[j]+1,cur[j-1]+1,prev[j-1]+c);
      cur[j]=d;
    }
    tmp=prev;prev=cur;cur=tmp;
  }
  return prev[n];
}
function sTol(nqLen){ return nqLen<=3?0:(nqLen<=5?1:2); }
function sWordScore(nq, w){
  if(!w) return 0;
  if(w.indexOf(nq)===0) return 3;
  const tol=sTol(nq.length);
  if(tol<=0) return 0;
  let best=99;
  const c1=w.slice(0,nq.length);
  if(c1) best=Math.min(best,sEdit(nq,c1));
  if(Math.abs(w.length-nq.length)<=2) best=Math.min(best,sEdit(nq,w));
  if(best<=tol) return 2.4-best*0.7;
  return 0;
}
function sFieldScore(nq, text){
  const nt=sNorm(text);
  if(!nt||!nq) return 0;
  const ix=nt.indexOf(nq);
  if(ix>=0) return 4+(nq.length/Math.max(nt.length,1))-Math.min(ix,20)*0.02;
  const words=nt.split(/\s+/);
  let best=0;
  for(let i=0;i<words.length;i++){
    const s=sWordScore(nq,words[i]);
    if(s>best) best=s;
  }
  const qw=nq.split(/\s+/).filter(w=>w.length>=2);
  if(qw.length>1){
    for(let qi=0;qi<qw.length;qi++) for(let i=0;i<words.length;i++){
      const s=sWordScore(qw[qi],words[i])*0.9;
      if(s>best) best=s;
    }
  }
  return best;
}
function prodName(p){ return (p.k&&PROD_EN[p.k])||p.name||""; }
function prodSearchScore(nq, p){
  let s=sFieldScore(nq,prodName(p))*3;
  if(p.cat) s=Math.max(s,sFieldScore(nq,p.cat)*1.5);
  if(p.variants) for(let i=0;i<p.variants.length;i++) s=Math.max(s,sFieldScore(nq,p.variants[i].n||"")*1.2);
  return s;
}
function sHiName(nm, nqRaw){
  const s=String(nm==null?"":nm);
  const nq=String(nqRaw==null?"":nqRaw).trim().toLowerCase();
  if(!nq) return esc(s);
  const low=s.toLowerCase();
  const ix=low.indexOf(nq);
  if(ix>=0) return esc(s.slice(0,ix))+"<mark>"+esc(s.slice(ix,ix+nq.length))+"</mark>"+esc(s.slice(ix+nq.length));
  const nqn=sNorm(nq);
  const qws=nqn.split(/\s+/).filter(w=>w.length>=2);
  const parts=s.split(/(\s+)/);
  let bi=-1,bs=0;
  for(let i=0;i<parts.length;i+=2){
    const wn=sNorm(parts[i]);
    let sc=sWordScore(nqn,wn);
    for(let qi=0;qi<qws.length;qi++) sc=Math.max(sc,sWordScore(qws[qi],wn));
    if(sc>bs){ bs=sc; bi=i; }
  }
  if(bi<0) return esc(s);
  return parts.map((w,i)=>i===bi?"<mark>"+esc(w)+"</mark>":esc(w)).join("");
}
function srGet(){

/* ---- cart drawer: suggested add-ons (familiar Amazon/Zomato pattern; lifts average order value) ---- */
function cartSuggest(){
  const RT=shopRT, d=RT.d;
  if(!d||!d.products) return [];
  const inCart=new Set(RT.cart.map(l=>l.pi));
  const pool=(d.products||[]).map((p,i)=>({p:p,i:i}))
    .filter(o=>o.p&&!inCart.has(o.i)&&o.p.stock!=="out");
  if(!pool.length) return [];
  const cats=new Set();
  RT.cart.forEach(l=>{ const p=d.products[l.pi]; if(p&&p.cat) cats.add(p.cat); });
  pool.sort((a,b)=>{
    const sa=(a.p.best?2:0)+((a.p.cat&&cats.has(a.p.cat))?1:0);
    const sb=(b.p.best?2:0)+((b.p.cat&&cats.has(b.p.cat))?1:0);
    return sb-sa;
  });
  return pool.slice(0,3);
}

function wireDrawer(){
  const RT=shopRT;
  const x=$("#drawerX");
  if(x) x.onclick=closeDrawer;
  const w=$("#drawerWrap");
  if(w) w.onclick=e=>{ if(e.target===w) closeDrawer(); };
  const dr=$(".drawer");
  if(!dr) return;
  dr.addEventListener("click", e=>{
    const inc=e.target.closest("[data-inc]"), dec=e.target.closest("[data-dec]");
    if(inc){ RT.cart[+inc.getAttribute("data-inc")].qty++; saveShop(); renderCartBar(); renderDrawer(); return; }
    if(dec){
      const l=RT.cart[+dec.getAttribute("data-dec")];
      if(l){ l.qty--; if(l.qty<=0) RT.cart.splice(RT.cart.indexOf(l),1); }
      saveShop(); renderCartBar(); renderDrawer(); return;
    }
    if(e.target.closest("#couponGo")){ applyCoupon(); return; }
    if(e.target.closest("#couponRm")){ RT.coupon=null; saveShop(); renderDrawer(); return; }
    const of=e.target.closest("[data-offer]");
    if(of){ applyOffer(+of.getAttribute("data-offer")); return; }
    if(e.target.closest("#browseBtn")){ closeDrawer(); return; }
    if(e.target.closest("#reorderBtn")){ doReorder(); return; }
    const sa=e.target.closest("[data-sugadd]");
    if(sa){ const pi=+sa.getAttribute("data-sugadd"); const p=RT.d.products[pi];
      if(p&&p.stock!=="out"){ addToCart(pi,selViOf(p,pi)); renderDrawer(); } return; }
    if(e.target.closest("#checkoutBtn")){ saveShop(); closeDrawer();
      try{ sessionStorage.setItem("ts_ck_sid", JSON.stringify({p:shopRT.payload, sid:shopRT.serverId||null})); }catch(e){}
      location.hash="#/checkout/"+shopRT.payload; return; }
  });
  dr.addEventListener("keydown", e=>{
    if(e.target.id==="couponInp" && e.key==="Enter"){ e.preventDefault(); applyCoupon(); }
  });
}

/* card helpers: formatting, brand detect, luhn, expiry */
function fmtCard(v){
  const d=v.replace(/\D/g,"").slice(0,19);
  if(/^3[47]/.test(d)) return [d.slice(0,4),d.slice(4,10),d.slice(10,15)].filter(Boolean).join(" ");
  return (d.match(/.{1,4}/g)||[]).join(" ");
}
function cardBrand(v){
  const d=v.replace(/\D/g,"");
  if(/^4/.test(d)) return "Visa";
  if(/^(5[1-5]|2[2-7])/.test(d)) return "Mastercard";
  if(/^3[47]/.test(d)) return "Amex";
  if(/^(60|65|81|82)/.test(d)) return "RuPay";
  return "";
}
function luhnOk(num){
  if(!/^\d{13,19}$/.test(num)) return false;
  let s=0,alt=false;
  for(let i=num.length-1;i>=0;i--){ let x=+num[i]; if(alt){ x*=2; if(x>9)x-=9; } s+=x; alt=!alt; }
  return s%10===0;
}
function fmtExp(v){
  const d=v.replace(/\D/g,"").slice(0,4);
  if(d.length>2) return d.slice(0,2)+"/"+d.slice(2);
  return d;
}
function expOk(exp){
  const m=/^(\d{2})\/(\d{2})$/.exec(exp); if(!m) return false;
  const mm=+m[1], yy=+m[2]; if(mm<1||mm>12) return false;
  const now=new Date(), cy=now.getFullYear()%100, cm=now.getMonth()+1;
  return yy>cy||(yy===cy&&mm>=cm);
}

function legacyCopy(txt){
  try{
    const ta=document.createElement("textarea"); ta.value=txt;
    ta.style.position="fixed"; ta.style.opacity="0";
    document.body.appendChild(ta); ta.select();
    document.execCommand("copy"); document.body.removeChild(ta);
  }catch(e){}
}
function wireCheckout(){
  mountStripe();
  const wrap=document.querySelector(".ck-wrap"); if(!wrap||!ck) return;
  wrap.addEventListener("input", e=>{
    const id=e.target.id;
    if(id==="ckName"){ shopRT.form.name=e.target.value; saveShop(); }
    else if(id==="ckPhone"){ shopRT.form.phone=e.target.value; saveShop(); }
    else if(id==="ckAddr"){ shopRT.form.addr=e.target.value; saveShop(); }
    else if(id==="ckNotes"){ shopRT.form.notes=e.target.value; saveShop(); }
    else if(id==="ccNum"){ ck.cc.num=fmtCard(e.target.value); e.target.value=ck.cc.num; const b=$("#ccBrand"); if(b) b.textContent=cardBrand(ck.cc.num); }
    else if(id==="ccExp"){ ck.cc.exp=fmtExp(e.target.value); e.target.value=ck.cc.exp; }
    else if(id==="ccCvc"){ ck.cc.cvc=e.target.value.replace(/\D/g,"").slice(0,4); e.target.value=ck.cc.cvc; }
    else if(id==="ccName"){ ck.cc.name=e.target.value; }
  });
  wrap.addEventListener("change", e=>{
    if(e.target.name==="ful"){ shopRT.fulfillment=e.target.value; saveShop(); rerenderCk(); }
    else if(e.target.id==="coSlot"){ shopRT.slot=e.target.value; saveShop(); }
    else if(e.target.name==="paym"){ ck.payTab=e.target.value; ck.err=null; rerenderCk(); }
  });
  wrap.addEventListener("click", e=>{
    if(e.target.closest("#ckSumToggle")){
      ck.sumOpen=!ck.sumOpen;
      const b=$("#ckSumBody"); if(b) b.classList.toggle("hidden",!ck.sumOpen);
      return;
    }
    if(e.target.closest("#ckGoBtn")){ ckGo(); return; }
    if(e.target.closest("#ckWaBtn")){ ckWaSend(); return; }
    if(e.target.closest("#ckCopyBtn")){
      const btn=e.target.closest("#ckCopyBtn");
      const txt=ck.orderId||"";
      const done=()=>{ const o=btn.textContent; btn.textContent="Copied!"; setTimeout(()=>{ btn.textContent=o; },1800); };
      if(navigator.clipboard&&navigator.clipboard.writeText) navigator.clipboard.writeText(txt).then(done).catch(function(){ legacyCopy(txt); done(); });
      else { legacyCopy(txt); done(); }
      return;
    }
    if(e.target.closest("#ckClearSaved")){ clearCustomer(); return; }
  });
}
function ckValidateAll(){
  ck.ferr={};
  if(!shopRT.form.name.trim()) ck.ferr.name="Please enter your name.";
  if(!shopRT.form.phone.trim()) ck.ferr.phone="Please enter your phone number.";
  if(shopRT.fulfillment==="delivery"&&!shopRT.form.addr.trim()) ck.ferr.addr="Please enter your delivery address.";
  if(Object.keys(ck.ferr).length){

function ckValidDemoCard(){

function ckPay(){
  if(ck.proc) return;
  if(ck.payTab!=="card") return;
  if(ck.cfg&&!ck.cfg.demo){ ckPayLive(); return; }
  ck.err=null;
  if(!ckValidDemoCard()){ rerenderCk(); return; }
  ck.proc=true; rerenderCk();
  const payload=ck.payload, num=(ck.cc.num||"").replace(/\D/g,"");
  setTimeout(()=>{
    if(!ck||ck.payload!==payload) return;
    ck.proc=false;
    if(num==="4000000000000002"){
      ck.err="Payment failed. Try another card."; rerenderCk();
    } else {
      ckDone();
    }
  },1800);
}
async function ckPayLive(){
  if(ck.proc) return;
  const fail=m=>{
    ck.proc=false;
    const e=$("#ckErr3"); if(e) e.innerHTML='<div class="ck-err">'+esc(m)+'</div>';
    const btn=$("#ckGoBtn"); if(btn){ btn.disabled=false; btn.innerHTML=ckGoBtnHtml(cartTotals()); }
  };
  try{
    await loadStripeJs();
    const pk=ck.cfg&&ck.cfg.publishableKey;
    if(!window.Stripe||!pk){ fail("Payment failed. Try another card."); return; }
    if(!ck.stripe){
      ck.stripe=Stripe(pk);
      ck.cardEl=ck.stripe.elements().create("card",{style:{base:{fontSize:"16px",color:"#1B1B18",fontFamily:"system-ui,sans-serif","::placeholder":{color:"#8a877c"}}}});
      mountStripe();
    }
    const minor=toMinor(cartTotals().total,fxCur);
    if(minor<1){ fail("Payment failed. Try another card."); return; }
    ck.proc=true; ck.err=null;
    const btn=$("#ckGoBtn");
    if(btn){ btn.disabled=true; btn.innerHTML='<span class="ck-spin"></span><span>'+esc("Processing...")+'</span>'; }
    const orderId=ckOrderId();
    const r=await fetch("/api/create-payment-intent",{
      method:"POST",headers:{"Content-Type":"application/json"},
      body:JSON.stringify({amount:minor,currency:fxCur,orderId:orderId,shop:ck.d.name})
    });
    const j=await r.json().catch(()=>({}));
    if(!r.ok||!j.clientSecret){
      if(j.demo){ ck.cfg={demo:true,publishableKey:null}; ck.proc=false; rerenderCk(); }
      else fail("Payment failed. Try another card.");
      return;
    }
    const nm=((ck.cc&&ck.cc.name)||"").trim();
    const res=await ck.stripe.confirmCardPayment(j.clientSecret,{
      payment_method:{card:ck.cardEl,billing_details:{name:nm||undefined}}
    });
    if(res.error){ fail(res.error.message||"Payment failed. Try another card."); return; }
    if(res.paymentIntent&&res.paymentIntent.status==="succeeded"){ ckDone(); return; }
    fail("Payment failed. Try another card.");
  }catch(e){ fail("Payment failed. Try another card."); }
}
function ckPlaceManual(){
  ck.err=null;
  const tt=cartTotals();
  if(!tt.okMin){ ck.err="Minimum order is {x}".replace("{x}",shopMoney(tt.min)); rerenderCk(); return; }
  ckDone();
}
function ckDone(){
  ck.proc=false;
  // Snapshot the order BEFORE the cart is cleared, then record it in the
  // merchant's orders inbox. The server code becomes the order number shown
  // on the confirmation screen and in the WhatsApp handoff. Any failure
  // falls back to a local code and the WhatsApp flow continues untouched.
  const snap = snapshotOrder();
  const apply = (code)=>{
    ck.orderId = code || ckOrderId();
    ck.lastOrder = snap;
    if(trackOK()&&snap&&snap.items&&snap.items.length){
      for(let oi=0;oi<snap.items.length;oi++){ const it=snap.items[oi]; logBehav("order", it.pi, it.qty); }
    }
    if(snap&&snap.items&&snap.items.length&&shopRT) saveReorder(shopRT.serverId, shopRT.payload, snap.items);
    saveCustomer(shopRT.form||{});
    shopRT.cart=[]; shopRT.coupon=null; saveShop(); renderCartBar();
    ck.done=true; rerenderCk(); window.scrollTo(0,0);
  };
  if(snap && snap.shopId){
    let settled=false;
    const to=setTimeout(()=>{ if(!settled){ settled=true; apply(null); } },10000);
    postOrderToInbox(snap).then(code=>{ if(!settled){ settled=true; clearTimeout(to); apply(code); } })
      .catch(()=>{ if(!settled){ settled=true; clearTimeout(to); apply(null); } });
  } else apply(null);
}
// Everything the server needs to record the order, captured from the live
// cart before ckDone clears it. name/variant are display strings; pi/vi let
// the server re-derive prices from the stored payload.
function snapshotOrder(){
  const RT=shopRT;
  if(!RT || !RT.cart || !RT.cart.length) return null;
  const d=RT.d, tt=cartTotals();
  const items=[];
  for(let i=0;i<RT.cart.length;i++){
    const l=RT.cart[i], p=d.products[l.pi];
    if(!p) continue;
    const v=(p.variants&&l.vi!=null)?p.variants[l.vi]:null;
    const nm=((p.k&&PROD_EN[p.k])||p.name||"")+(v?" ("+v.n+")":"");
    items.push({pi:l.pi, vi:(l.vi==null?null:l.vi), name:nm, variant:(v?v.n:null), qty:l.qty, unitPrice:priceNum(p,l.vi)});
  }
  if(!items.length) return null;
  return {
    shopId: RT.serverId||null,
    items: items,
    customer:{ name:String(RT.form.name||"").trim(), phone:String(RT.form.phone||"").trim(), address:String(RT.form.addr||"").trim() },
    fulfillment: RT.fulfillment, slot: RT.slot||"asap",
    paymentMethod: (ck&&ck.payTab)||"", coupon: RT.coupon?{code:RT.coupon.code}:null,
    note: String(RT.form.notes||"").trim(), currency: (typeof fxCur!=="undefined"?fxCur:"USD"),
    fxRate: (typeof fxRate!=="undefined"?fxRate:1),
    totals:{ sub:tt.sub, disc:tt.disc, fee:tt.fee, total:tt.total }
  };
}
function postOrderToInbox(snap){
  return fetch("/api/orders",{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify(snap)})
    .then(r=>{ if(!r.ok) throw new Error("api "+r.status); return r.json(); })
    .then(j=>{ if(!j||!j.code) throw new Error("bad response"); return j.code; });
}

/* Price filter (familiar Amazon/Flipkart pattern): data-driven tertile bands from
   the shop's own prices, so every band always matches at least one product
   (verified by counting, pathological tie clusters bail out and hide the
   control). Prices use the selected/default variant, same as sort. The control
   is hidden when the shop has fewer than 3 positive prices. Zero backend. */
function priceBands(d){
  const ps=(d.products||[]);
  const vals=ps.map(function(p,i){ return priceNum(p, selViOf(p,i)); })
    .filter(function(v){ return v>0; }).sort(function(a,b){ return a-b; });
  if(vals.length<3) return null;
  const n=vals.length, c1=Math.ceil(n/3), c2=Math.ceil(2*n/3);
  const b1=(vals[c1-1]+vals[c1])/2, b2=(vals[c2-1]+vals[c2])/2;
  if(!(b2>b1)) return null;
  const c=[0,0,0];
  vals.forEach(function(v){ if(v<b1) c[0]++; else if(v<=b2) c[1]++; else c[2]++; });
  if(c[0]===0||c[1]===0||c[2]===0) return null;
  return [b1,b2];
}
function priceInBand(v,bands,pf){
  if(pf===1) return v<bands[0];
  if(pf===2) return v>=bands[0]&&v<=bands[1];
  if(pf===3) return v>bands[1];
  return true;
}

/* ---- Privacy consent + on-device behavior log + "Recommended for you" ----
   The shopper's views, cart adds and orders are recorded ONLY on this device
   (localStorage, per shop, capped at 200 events) and ONLY after they accept
   the consent banner. Nothing is sent anywhere: the merchant never sees it,
   there is no account and no cross-device tracking. Declining wipes any
   behavior data for the shop and the personalized rails stay hidden.
   The recommender scores every in-stock, not-in-cart product from:
     - category affinity (viewed/added/ordered items, weighted 1/3/5, recency-ramped)
     - price-band affinity (closeness to the shopper's weighted average price)
     - merchant bestseller flag as a popularity prior (this is also the cold-start fallback)
   5 new strings (ck_title, ck_body, ck_ok, ck_no, rec_foryou) x 15 languages. */
function trackOK(){ try{ return localStorage.getItem("ts_consent")==="1"; }catch(e){ return false; } }
function consentGiven(){ try{ return localStorage.getItem("ts_consent"); }catch(e){ return null; } }
function behavKey(){
  if(!shopRT) return "ts_behav_none";
  return "ts_behav_"+(shopRT.serverId||("p"+hashStr(shopRT.payload||"")));
}
function readBehav(){
  try{ const a=JSON.parse(localStorage.getItem(behavKey())||"[]"); return Array.isArray(a)?a:[]; }catch(e){ return []; }
}
function logBehav(ev, i, q){
  if(!trackOK()||!shopRT||i==null||i<0) return;
  try{
    let a=readBehav();
    a.push({t:Date.now(), e:ev, i:i, q:q||0});
    if(a.length>200) a=a.slice(a.length-200);
    localStorage.setItem(behavKey(), JSON.stringify(a));
  }catch(e){}
  if(ev==="view"||ev==="add") renderRec();
}
function setConsent(v){
  try{
    localStorage.setItem("ts_consent", v?"1":"0");
    if(!v && shopRT){
      try{ localStorage.removeItem(recentKey()); }catch(e){}
      try{ localStorage.removeItem(behavKey()); }catch(e){}
    }
  }catch(e){}
  const b=$("#ckWrap"); if(b) b.innerHTML="";
  renderRecent(); renderRec();
}
function renderConsent(){
  const w=$("#ckWrap");
  if(!w||!shopRT) return;
  if(consentGiven()!=null){ w.innerHTML=""; return; }
  w.innerHTML='<div class="ck-bar" role="dialog" aria-live="polite" aria-label="'+esc("Your privacy")+'">'
    +'<div class="ck-tx"><b>'+esc("Your privacy")+'</b><span>'+esc("We remember what you view and order on this device to show better suggestions. Decline and the shop still works fine.")+'</span></div>'
    +'<div class="ck-btns"><button type="button" class="ck-no" data-ck="0">'+esc("Decline")+'</button>'
    +'<button type="button" class="ck-ok" data-ck="1">'+esc("Accept")+'</button></div></div>';

function renderRec(){
  const wrap=$("#recWrap");
  if(!wrap||!shopRT||!shopRT.d) return;
  if(!trackOK()){ wrap.innerHTML=""; return; }
  const prods=shopRT.d.products||[];
  const evs=readBehav();
  const inCart={};
  (shopRT.cart||[]).forEach(function(l){ inCart[l.pi]=1; });
  const W={view:1, add:3, order:5};
  const catW={}, n=evs.length;
  let pwSum=0, pwTot=0;
  evs.forEach(function(ev, idx){
    const p=prods[ev.i]; if(!p) return;
    const w=(W[ev.e]||1)*(0.5+0.5*(n?(idx+1)/n:1));
    const c=p.cat||"";
    catW[c]=(catW[c]||0)+w;
    const pr=priceNum(p, selViOf(p, ev.i));
    if(pr>0){ pwSum+=pr*w; pwTot+=w; }
  });
  const avg=pwTot?pwSum/pwTot:0;
  const scored=[];
  for(let i=0;i<prods.length;i++){
    const p=prods[i];
    if(!p||p.stock==="out"||inCart[i]) continue;
    let s=0;
    const cw=catW[p.cat||""];
    if(cw) s+=cw*2;
    if(avg>0){
      const pr=priceNum(p, selViOf(p, i));
      if(pr>0){ const d=Math.abs(pr-avg)/avg; s+=Math.max(0, 3-d*6); }
    }
    if(p.best) s+=2;
    s+=(prods.length-i)*0.001;
    scored.push({i:i, s:s});
  }
  scored.sort(function(a,b){ return b.s-a.s; });
  const top=scored.slice(0,8);
  if(!top.length){ wrap.innerHTML=""; return; }
  const cards=top.map(function(o){
    const p=prods[o.i], i=o.i;
    const name=(p.k&&PROD_EN[p.k])||p.name||"";
    const pim=imgSrc(p.image);
    const qty=cartQty(i, selViOf(p, i));
    const act=qty===0
      ? '<button type="button" class="rv-add" data-add="'+i+'">'+"Add"+'</button>'
      : '<div class="pc-step"><button type="button" data-pdec="'+i+'" aria-label="&minus;">&minus;</button><b>'+qty+'</b><button type="button" data-pinc="'+i+'" aria-label="+">+</button></div>';
    return '<div class="rv-card">'
      +(pim?'<button type="button" class="rv-img" data-zoom="'+i+'" aria-label="'+esc(name)+'"><img src="'+esc(pim)+'" loading="lazy" alt="" onerror="imgFail(this)"></button>':"")
      +'<div class="rv-name">'+esc(name)+'</div>'
      +'<div class="rv-price">'+esc(priceLabel(p, selViOf(p, i)))+'</div>'
      +act+'</div>';
  }).join("");
  wrap.innerHTML='<div class="rv-sec"><h2 class="rv-h">'+esc("Recommended for you")+'</h2><div class="rv-rail">'+cards+'</div></div>';
}

// The fetched data is re-encoded to a canonical payload string so checkout
// and back-links keep working exactly like payload links.
function fetchShopById(id, h, hlP){
  fetch("/api/shops?id="+encodeURIComponent(id))
    .then(r=>{ if(!r.ok) throw new Error("nf"); return r.json(); })
    .then(j=>{
      if(location.hash.replace(/^#\/?/,"") !== h) return; // user moved on
      const d = j && j.payload;
      if(!d || typeof d !== "object" || Array.isArray(d)){ render(notFoundView()); return; }
      pendingHl=(typeof hlP==="number"?hlP:-1);
      applyShopLocale(d, encodeSite(d), id);
    })
    .catch(()=>{ if(location.hash.replace(/^#\/?/,"") === h) render(notFoundView()); });
}

function foldStr(s){
  return String(s||"").normalize("NFD").replace(/[\u0300-\u036f]/g,"").toLowerCase();
}
function wireLocale(){
  const back = localeBack();
  const backPayload = back.replace(/^#\/?/,"").indexOf("s/")===0 ? back.replace(/^#\/?/,"").slice(2) : null;
  document.querySelectorAll('.loc-row[data-cc]').forEach(b=>{
    b.onclick = ()=> pickCountry(b.getAttribute("data-cc"));
  });
  const stick = document.getElementById("locStick");
  if(stick){
    // Keep sticky section headers below the sticky toolbar, and anchor jumps
    // clear of both.
    const setStick = ()=>{
      const stickH = stick.offsetHeight + 66;
      const wrap = document.getElementById("locWrap");
      if(wrap){
        wrap.style.setProperty("--stick", (stickH + 8) + "px");
        document.querySelectorAll(".loc-region").forEach(s=>{ s.style.scrollMarginTop = (stickH + 12) + "px"; });
      }
    };
    const inp = document.getElementById("locSearch");
    const none = document.getElementById("locNone");
    const regionsEl = document.getElementById("locRegions");
    let activeRegion = null;
    const applyRegionFilter = ()=>{
      document.querySelectorAll(".loc-pill").forEach(x=>{
        x.classList.toggle("mine", x.getAttribute("data-jump")===activeRegion);
      });
      document.querySelectorAll(".loc-region").forEach(sec=>{
        const show = !activeRegion || sec.id === "locR-" + activeRegion;
        sec.style.display = show ? "" : "none";
      });
      if(none) none.style.display = "none";
      setStick();
    };
    const filter = ()=>{
      const q = foldStr(inp.value.trim());
      if(q && activeRegion){
        activeRegion = null;
        document.querySelectorAll(".loc-pill").forEach(x=>x.classList.remove("mine"));
      }
      let any = false;
      document.querySelectorAll(".loc-region").forEach(sec=>{
        let vis = 0;
        sec.querySelectorAll(".loc-row[data-cc]").forEach(row=>{
          const cc = row.getAttribute("data-cc");
          const hay = foldStr((CC_ENDO[cc]||"") + " " + countryName(cc) + " " + COUNTRY[cc].name + " " + COUNTRY[cc].cur + " " + cc);
          const show = !q || hay.indexOf(q) !== -1;
          row.style.display = show ? "" : "none";
          if(show) vis++;
        });
        sec.style.display = vis ? "" : "none";
        if(vis) any = true;
      });
      if(none) none.style.display = any ? "none" : "block";
      setStick();
    };
    inp.addEventListener("input", filter);
    inp.addEventListener("keydown", e=>{ if(e.key === "Escape"){ inp.value = ""; filter(); inp.blur(); } });
    document.querySelectorAll(".loc-pill").forEach(p=>{
      p.onclick = ()=>{
        const r = p.getAttribute("data-jump");
        activeRegion = (activeRegion === r) ? null : r;
        if(inp) inp.value = "";
        document.querySelectorAll(".loc-region .loc-row[data-cc]").forEach(row=>{ row.style.display = ""; });
        applyRegionFilter();
        if(activeRegion && regionsEl){
          const y = regionsEl.getBoundingClientRect().top + window.scrollY - (stick.offsetHeight + 78);
          window.scrollTo({ top: Math.max(0, y), behavior: "smooth" });
        } else {
          window.scrollTo({ top: 0, behavior: "smooth" });
        }
      };
    });
    setStick();
    window.addEventListener("resize", setStick);
  }
}

   so shared links always carry the shop's original locale. */
async function applyShopLocale(d, payload, serverId){
  const loc = d.loc || {};

    const cur = COUNTRY[shopCC].cur; if(cur !== fxCur){ fxCur = cur; fxRate = FX_FALLBACK[cur]||1; }

    }catch(e){}
  }

      + ordDetailRow("Note", esc(o.note||""))
      + '<div class="ord-contact">'
      + (telHref !== "tel:" ? '<a class="btn btn-sm" href="'+esc(telHref)+'">'+"Call"+'</a>' : "")
      + (waHref !== "https://wa.me/" ? '<a class="btn btn-sm" href="'+esc(waHref)+'" target="_blank" rel="noopener">'+"WhatsApp"+'</a>' : "")
      + '</div>'
      + ordActionHtml(o)
      + '</div>';
  }
  return '<div class="ord-card" data-ord="'+esc(o.orderId)+'">'
    + '<button class="ord-head" data-ordtoggle="'+esc(o.orderId)+'" aria-expanded="'+(open?"true":"false")+'">'
    + '<span class="ord-code">'+esc(o.code||"")+'</span>'
    + '<span class="ord-pill '+ordStatusClass(st)+'">'+esc(ORD_ST[st]||st)+'</span>'
    + '<span class="ord-time">'+esc(ordTime(o.createdAt))+'</span>'
    + '<span class="ord-caret" aria-hidden="true">'+(open?"▾":"▸")+'</span></button>'
    + '<div class="ord-sum"><span>'+esc((o.customer||{}).name||"")+'</span>'
    + '<span class="ord-sep">·</span><span>'+esc("{n} items".replace("{n}",ordCount(o)))+'</span>'
    + '<span class="ord-sep">·</span><span class="ord-total">'+esc(ordMoney(o))+'</span>'
    + '<span class="ord-sep">·</span><span>'+esc(o.fulfillment==="delivery"?"Delivery":"Pickup")+'</span></div>'
    + detail + '</div>';
}
const ORD_ST = {"new":"New","preparing":"Preparing","ready":"Ready","completed":"Completed","cancelled":"Cancelled"};
// Status actions for the current state: New → Preparing → Ready → Completed,
// plus Cancel from any open state. Cancelled/completed orders are terminal.
function ordActionHtml(o){
  const st = o.status || "new";
  const adv = (to)=>'<button class="btn btn-sm" data-ordstatus="'+to+'">'+(ORD_ST[to]||to)+'</button>';
  const cancel = '<button class="btn btn-sm" data-ordstatus="cancelled">'+"Cancel"+'</button>';
  let h = '<div class="ord-actions">';
  if(st==="new") h += adv("preparing") + cancel;
  else if(st==="preparing") h += adv("ready") + cancel;
  else if(st==="ready") h += adv("completed") + cancel;
  else h += '<span class="note">'+esc(ORD_ST[st]||st)+'</span>';
  return h + '</div>';
}
function ordersView(regId){
  ordState = { regId:regId, serverId:null, key:null, orders:[], err:null, expanded:{}, loading:true };
  const entry = readShops().find(x=>x.id===regId);
  if(entry){ ordState.serverId = entry.serverId||null; ordState.key = entry.merchantKey||null; }
  const name = entry ? (entry.name || "My shops") : "";
  return header()
    + '<div class="wrap"><div class="ord-top"><a class="btn btn-sm" href="#/shops">'+"Back"+'</a>'
    + '<h1 class="ord-h">'+"Orders"+'</h1>'
    + '<button class="btn btn-sm" id="ordRefresh">'+"Refresh"+'</button></div>'
    + '<p class="note ord-shop">'+esc(name)+'</p>'
    + '<div id="ordList" class="ord-list" aria-live="polite"></div></div>'
    + footer();
}
function ordListHtml(){
  const st = ordState;
  if(st.loading) return '<p class="note">'+"Loading orders..."+'</p>';
  if(st.err==="forbidden") return '<div class="ord-empty"><p>'+"Access denied"+'</p><p class="note">'+"Republish this shop to enable the orders inbox."+'</p></div>';
  if(st.err) return '<div class="ord-empty"><p>'+"Could not load orders."+'</p><p class="note">'+esc(st.err)+'</p><button class="btn btn-sm" id="ordRetry">'+"Refresh"+'</button></div>';
  if(!st.orders.length) return '<div class="ord-empty"><p>'+"No orders yet"+'</p><p class="note">'+"New orders from your storefront will appear here."+'</p></div>';
  return st.orders.map(ordCardHtml).join("");
}
function ordRender(){
  const box = document.getElementById("ordList");
  if(box && ordState){ box.innerHTML = ordListHtml(); const r=document.getElementById("ordRetry"); if(r) r.onclick=()=>ordFetch(); }
}
function ordFetch(){
  const st = ordState;
  if(!st) return;
  if(!st.serverId || !st.key){ st.loading=false; st.err="forbidden"; ordRender(); return; }
  const url = "/api/orders?shopId="+encodeURIComponent(st.serverId)+"&key="+encodeURIComponent(st.key);
  fetch(url).then(r=>{
    if(r.status===403) throw new Error("forbidden");
    if(!r.ok) throw new Error("http "+r.status);
    return r.json();
  }).then(j=>{
    st.orders = (j && j.orders) || [];
    st.err = null; st.loading = false; ordRender();
  }).catch(e=>{
    st.loading=false; st.err = (e && e.message)||"error"; ordRender();
  });
}
function ordPatch(orderId, status){
  const st = ordState;
  if(!st || !st.serverId || !st.key) return;
  const url = "/api/orders";
  fetch(url, { method:"PATCH", headers:{ "Content-Type":"application/json" },
    body: JSON.stringify({ shopId:st.serverId, orderId:orderId, key:st.key, status:status }) })
    .then(r=>{ if(!r.ok) throw new Error("http "+r.status); return r.json(); })
    .then(()=>{ ordFetch(); })
    .catch(()=>{ ordFetch(); });
}
function wireOrders(){
  if(ordTimer){ clearInterval(ordTimer); ordTimer=null; }
  const refreshBtn = document.getElementById("ordRefresh");
  if(refreshBtn) refreshBtn.onclick = ()=>{ ordState.loading=true; ordRender(); ordFetch(); };
  document.getElementById("ordList").addEventListener("click", e=>{
    const tg = e.target.closest("[data-ordtoggle]");
    if(tg){
      const id = tg.getAttribute("data-ordtoggle");
      ordState.expanded[id] = !ordState.expanded[id];
      ordRender(); return;
    }
    const sb = e.target.closest("[data-ordstatus]");
    if(sb){
      const card = sb.closest("[data-ord]");
      if(card) ordPatch(card.getAttribute("data-ord"), sb.getAttribute("data-ordstatus"));
      return;
    }
  });
  ordFetch();
  // Auto-refresh every 60s while the inbox is visible; the router clears the
  // timer whenever the merchant navigates away.
  ordTimer = setInterval(()=>{ if(document.visibilityState==="visible") ordFetch(); }, 60000);
}
function dashView(){
  const shops = readShops();
  let body;
  if(!shops.length){
    body = '<p class="note">'+"No shops saved here yet. Publish a shop and it will show up here."+'</p>'
      + '<div class="center" style="margin-top:16px;"><a class="btn btn-accent" href="#/build">'+"Start free"+'</a></div>';
  } else {
    body = '<div class="dash-list">' + shops.map(s=>{
      const d = decodeSite(s.payload);
      const n = d && d.products ? d.products.length : 0;
      const dt = new Date(s.savedAt||Date.now()).toLocaleDateString();
      return '<div class="dash-row" data-shop="'+esc(s.id)+'">'
        + '<div class="dash-meta"><div class="dash-name">'+esc(s.name||"My shops")+'</div>'
        + '<div class="dash-sub">'+esc("{n} products".replace("{n}",n))+' \u00b7 '+esc(dt)+'</div></div>'
        + '<div class="dash-actions">'
        + '<button class="btn btn-sm" data-dact="edit">'+"Edit"+'</button>'
        + '<button class="btn btn-sm" data-dact="view">'+"View"+'</button>'
        + '<button class="btn btn-sm" data-dact="copy">'+"Copy link"+'</button>'
        + '<button class="btn btn-sm" data-dact="del">'+"Delete"+'</button>'
        + ((s.serverId && s.merchantKey) ? '<button class="btn btn-sm btn-orders" data-dact="orders">'+"Orders"+' <span class="ord-badge" data-ordbadge="'+esc(s.id)+'" hidden></span></button>' : '')
        + '</div></div>';
    }).join("") + '</div>';
  }
  return header()
    + '<div class="wrap"><div class="builder-head"><h1>'+"My shops"+'</h1></div>'
    + '<div class="card">'+body+'</div></div>'
    + footer();
}
function wireDash(){
  const list = document.querySelector(".dash-list");
  if(!list) return;
  list.addEventListener("click", e=>{
    const b = e.target.closest("[data-dact]"); if(!b) return;
    const row = b.closest("[data-shop]"); if(!row) return;
    const id = row.getAttribute("data-shop");
    const shops = readShops();
    const s = shops.find(x=>x.id===id); if(!s) return;
    const act = b.getAttribute("data-dact");
    if(act==="edit"){ location.hash = "#/edit/"+s.payload; }
    else if(act==="view"){ window.open(s.serverId ? shopIdLinkOf(s.serverId) : shopLinkOf(s.payload), "_blank"); }
    else if(act==="copy"){
      const link = s.serverId ? shopIdLinkOf(s.serverId) : shopLinkOf(s.payload);
      const done = ()=>{ const o=b.textContent; b.textContent="Copied!"; setTimeout(()=>{ b.textContent=o; },1500); };
      if(navigator.clipboard && navigator.clipboard.writeText) navigator.clipboard.writeText(link).then(done).catch(done);
      else done();
    }
    else if(act==="orders"){ location.hash = "#/orders/"+id; }
    else if(act==="del"){
      if(confirm("Delete this shop? This cannot be undone.")){ writeShops(shops.filter(x=>x.id!==id)); render(dashView()); wireDash(); window.scrollTo(0,0); }
    }
  });
  updateOrderBadges();
}
// On the dashboard, fetch each published shop's order count and show a
// "new orders" badge on its Orders button. Quiet on failure (badges just
// stay hidden); dashboard data never leaves the device for this.
function updateOrderBadges(){
  const badges = document.querySelectorAll("[data-ordbadge]");
  badges.forEach(badge=>{
    const entry = readShops().find(x=>x.id===badge.getAttribute("data-ordbadge"));
    if(!entry || !entry.serverId || !entry.merchantKey) return;
    const url = "/api/orders?shopId="+encodeURIComponent(entry.serverId)+"&key="+encodeURIComponent(entry.merchantKey);
    fetch(url).then(r=>r.ok?r.json():null).then(j=>{
      const n = (j && j.orders) ? j.orders.filter(o=>o.status==="new").length : 0;
      if(n>0){ badge.hidden=false; badge.textContent = n; }
      else badge.hidden=true;
    }).catch(()=>{});
  });
}
function router(){
  const h = location.hash.replace(/^#\/?/, "");
  // Leaving the orders inbox: stop its auto-refresh timer.
  if(h.indexOf("orders/")!==0 && typeof ordTimer!=="undefined" && ordTimer){ clearInterval(ordTimer); ordTimer=null; }
  const wasShop = !!state.isShop;
  state.isShop = (h.indexOf("s/")===0||h.indexOf("checkout/")===0);
  if(wasShop && !state.isShop){
    // leaving a storefront: restore the viewer's own currency preference
    let sc = null;
    try{ sc = (JSON.parse(localStorage.getItem("ts_locale")||"null")||{}).cur; }catch(e){}
    if(sc && FX_FALLBACK[sc] && sc !== fxCur){
      fxCur = sc; fxRate = FX_FALLBACK[sc];
      setCurrency(sc).then(()=>{ try{ router(); }catch(e){} });
    }
  }
  if(h.indexOf("checkout/")===0){
    const payload = h.slice(9);
    const d = decodeSite(payload);
    if(d){ startCheckout(d, payload); return; }
    render(notFoundView());
  } else if(h.indexOf("s/")===0){
    let seg = h.slice(2), hlP = -1;
    const pm = seg.match(/[?&]p=(\d+)$/); // per-product deep link #/s/<id>?p=<i>
    if(pm){ hlP = +pm[1]; seg = seg.slice(0, pm.index); }
    if(SHOP_ID_RE.test(seg)){ render(shopLoadingView()); fetchShopById(seg, h, hlP); return; }
    const payload = seg;
    const d = decodeSite(payload);
    if(d){ pendingHl = hlP; applyShopLocale(d, payload); return; }
    render(notFoundView());
  } else if(h.indexOf("orders/")===0){
    render(ordersView(h.slice(7))); wireOrders();
  } else if(h.indexOf("edit/")===0){
    const pl = h.slice(5);
    const d = decodeSite(pl);
    if(d){ state.data = d; state.step = 2; state.transcript = ""; state.editShopId = null;
      const hit = readShops().find(s=>s.payload===pl); if(hit) state.editShopId = hit.id;
      render(buildView()); wireBuild(); }
    else render(notFoundView());
  } else if(h==="privacy"){
    render(privacyView());
  } else if(h==="terms"){
    render(termsView());
  } else if(h==="get-your-store"){
    render(gysView());
    document.title = "Get Your Store: we build your online shop in 24 hours | Saylo";
  } else if(h==="locale"){
    render(localeView()); wireLocale();
  } else if(h==="shops"){
    render(dashView()); wireDash();
  } else if(h==="build" || h.indexOf("build")===0){
    if(state.step===1 && !state.data) restoreDraft();
    render(buildView()); wireBuild();
  } else {
    const anchors = {how:1, examples:1, pricing:1, faq:1};
    render(homeView());
    afterHome();
    if(anchors[h]){
      setTimeout(()=>{ const el = document.getElementById(h); if(el) el.scrollIntoView(); }, 40);
      return;
    }
  }
  window.scrollTo(0,0);
}
window.addEventListener("hashchange", router);
// builder draft autosave: debounced save on any builder input/change (buildCard covers step 2, typeBox covers step 1)
document.addEventListener("input", e=>{
  const t=e.target; if(!t||!t.closest) return;
  if(t.closest("#buildCard")||t.id==="typeBox") saveDraftSoon();
});
document.addEventListener("change", e=>{
  const t=e.target; if(!t||!t.closest) return;
  if(t.closest("#buildCard")) saveDraftSoon();
});
applyLangHead();
router();
initLocale();
</script>
