<style>
/* ================= landing: identity ================= */
:root{
  --paper:#FAF6EF; --paper2:#F2EBD9; --ink:#1B1712; --ink2:#5F5749;
  --line:#E3D9C2; --accent:#E8480C; --accent-deep:#B53A08; --accent-ink:#fff;
  --ember-soft:#FCE9DB;
  --amber:#F2B33D; --amber-soft:#FCF3DC; --wa:#1FA855;
  --shadow-lg:0 30px 60px -20px rgba(27,23,18,.28);
  --shadow-md:0 16px 34px -14px rgba(27,23,18,.22);
  --shadow-sm:0 8px 20px -8px rgba(27,23,18,.18);
  --r:20px;
  --disp:-apple-system,BlinkMacSystemFont,"Segoe UI","Helvetica Neue",Arial,sans-serif;
}
*{box-sizing:border-box; margin:0; padding:0;}
html{scroll-behavior:smooth;}
body{background:var(--paper); color:var(--ink);
  font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
  font-size:17px; line-height:1.6; -webkit-font-smoothing:antialiased;}
::selection{background:var(--accent); color:#fff;}
.serif{font-family:"Iowan Old Style",Palatino,"Palatino Linotype",Georgia,"Times New Roman",serif;}
.mono{font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;}
.wrap{max-width:1180px; margin:0 auto; padding:0 24px;}
a{color:inherit;}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px;}
img{display:block; max-width:100%;}
/* type utilities */
.disp{font-family:var(--disp); font-weight:800; letter-spacing:-.035em; line-height:1.02; overflow-wrap:break-word;}
.kick,.eyebrow{display:block; font-size:12px; font-weight:800; letter-spacing:2.5px; text-transform:uppercase; color:var(--accent); margin-bottom:18px;}
h1,h2,h3{overflow-wrap:break-word;}
/* buttons */
.btn{display:inline-block; text-decoration:none; border:1.5px solid var(--ink); border-radius:999px;
  padding:13px 28px; font-size:16px; font-weight:700; cursor:pointer; background:transparent; color:var(--ink);
  transition:transform .12s ease, background .12s ease, box-shadow .12s ease;}
.btn:hover{transform:translateY(-1px); box-shadow:var(--shadow-sm);}
.btn-ember{background:var(--accent); border-color:var(--accent); color:#fff;}
.btn-ember:hover{background:var(--accent-deep); border-color:var(--accent-deep);}
.btn-solid{background:var(--ink); color:var(--paper);}
.btn-solid:hover{background:#000;}
.btn-accent{background:var(--accent); border-color:var(--accent); color:#fff;}
.btn-accent:hover{background:var(--accent-deep);}
.btn-line{background:transparent;}
.price-card.launch .btn-line{color:var(--paper); border-color:rgba(250,246,239,.45);}
.price-card.launch .btn-line:hover{background:rgba(250,246,239,.08); box-shadow:none;}
/* ================= chat-first hero ================= */
.chat-hero{padding:88px 0 76px; text-align:center;}
.chat-hero .disp{font-size:clamp(46px,6.4vw,84px); margin:20px 0 0;}
.chat-hero .disp .em{color:var(--accent);}
.chat-hero .tagline{margin:16px 0 0; font-size:21px; font-weight:700; letter-spacing:-.01em; color:var(--accent-deep);}
.chat-hero .sub{max-width:660px; margin:22px auto 0; font-size:19px; color:var(--ink2); line-height:1.55;}
.chatbox{max-width:780px; margin:40px auto 0; background:#fff; border:1px solid var(--line); border-radius:22px; box-shadow:var(--shadow); text-align:start; overflow:hidden;}
.chatbox textarea{display:block; width:100%; border:0; background:transparent; resize:none; padding:24px 26px 6px; font:inherit; font-size:17px; line-height:1.55; min-height:104px; outline:none; color:var(--ink);}
.chatbox textarea::placeholder{color:#A79C85;}
.chatbar{display:flex; align-items:center; justify-content:space-between; gap:12px; padding:10px 14px 14px 26px;}
.chat-hint{font-size:13.5px; color:var(--ink2);}
.chat-submit{flex:0 0 auto; width:54px; height:54px; border-radius:50%; background:var(--accent); border:0; color:#fff; font-size:24px; line-height:1; cursor:pointer; transition:transform .12s ease, background .12s ease;}
.chat-submit:hover{background:var(--accent-deep); transform:translateY(-1px);}
.chips{display:flex; flex-wrap:wrap; gap:10px; justify-content:center; max-width:820px; margin:22px auto 0;}
.chip{border:1px solid var(--line); background:var(--paper2); border-radius:999px; padding:10px 20px; font-size:14.5px; font-weight:600; font-family:inherit; cursor:pointer; color:var(--ink2); transition:border-color .12s ease, color .12s ease;}
.chip:hover{border-color:var(--accent); color:var(--accent-deep);}
/* ================= gallery ================= */
.gal-grid{display:grid; grid-template-columns:repeat(3,1fr); gap:18px; margin-top:10px;}
.gal-card{display:flex; flex-direction:column; align-items:flex-start; gap:10px; background:#fff; border:1px solid var(--line); border-radius:18px; padding:26px; cursor:pointer; text-align:start; font:inherit; color:var(--ink); transition:transform .14s ease, box-shadow .14s ease, border-color .14s ease;}
.gal-card:hover{transform:translateY(-3px); box-shadow:var(--shadow-sm); border-color:var(--accent);}
.gal-ic{width:60px; height:60px; border-radius:15px; overflow:hidden; border:1px solid var(--line);}
.gal-ic svg{width:100%; height:100%; display:block;}
.gal-k{font-weight:800; font-size:19px; letter-spacing:-.01em;}
.gal-p{font-size:14.5px; color:var(--ink2); line-height:1.5; margin:0;}
.gal-use{font-size:14px; font-weight:700; color:var(--accent-deep); margin-top:6px;}
/* ================= pipeline ================= */
.pipe{max-width:880px; margin-top:8px;}
.pipe-row{display:flex; gap:30px; align-items:flex-start; padding:30px 4px; border-top:1px solid var(--line);}
.pipe-row:last-child{border-bottom:1px solid var(--line);}
.pipe-n{flex:0 0 auto; font-family:var(--disp); font-weight:800; font-size:44px; letter-spacing:-.03em; line-height:1; color:transparent; -webkit-text-stroke:1.5px var(--accent);}
.pipe-row h3{margin:0 0 8px; font-size:21px; letter-spacing:-.01em;}
.pipe-row p{margin:0; color:var(--ink2); font-size:16px; line-height:1.6;}
@media(max-width:860px){
  .gal-grid{grid-template-columns:1fr;}
  .chat-hero{padding:64px 0 56px;}
  .chatbar{padding-left:20px;}
  .pipe-row{gap:20px; padding:24px 2px;}
  .pipe-n{font-size:34px;}
}
.btn-sm{padding:9px 20px; font-size:14px;}
.btn-lg{padding:16px 36px; font-size:18px;}
/* ================= masthead ================= */
.mast{background:var(--paper); border-bottom:1px solid var(--line); position:sticky; top:0; z-index:50;}
.mast-in{display:flex; align-items:center; justify-content:space-between; height:68px; gap:16px;}
.wordmark{font-family:var(--disp); font-weight:800; font-size:24px; letter-spacing:-.03em; text-decoration:none; color:var(--ink);}
.wordmark span{color:var(--accent);}
.mast nav{display:flex; gap:30px; align-items:center;}
.mast nav a.nl{text-decoration:none; font-size:15px; font-weight:600; color:var(--ink2);}
.mast nav a.nl:hover{color:var(--ink);}
/* ================= Google Translate widget ================= */
.gt-slot{display:inline-flex;align-items:center;min-height:20px;}
.gt-slot .goog-te-gadget{font-size:0!important;line-height:0;}
.gt-slot .goog-te-gadget .goog-te-combo{
  font-family:inherit;font-size:13px;font-weight:600;color:var(--ink2);
  background:var(--paper2);border:1px solid var(--line);border-radius:999px;
  padding:6px 10px;margin:0;max-width:140px;cursor:pointer;
}
.gt-slot .goog-te-gadget .goog-te-combo:hover{border-color:var(--accent);color:var(--ink);}
.gt-slot .goog-te-gadget .goog-te-combo:focus-visible{outline:2px solid var(--accent);outline-offset:2px;}
.goog-te-banner-frame,.goog-te-balloon-frame,#goog-gt-tt{display:none!important;}
body{top:0!important;}
/* New-style Google Translate top banner (revert lives in the footer control) */
iframe.VIpgJd-ZVi9od-ORHb-OEVmcd,div.VIpgJd-ZVi9od-aZ2wEe-wOHMyf{display:none!important;}
@media(max-width:760px){
  /* Keep the mobile header compact; the footer translate control covers small screens */
  #gtSlotNav{display:none;}
}
/* Footer mirror select (drives the single Google widget in the nav) */
.gt-mirror{
  font-family:inherit;font-size:13px;font-weight:600;color:var(--ink2);
  background:var(--paper2);border:1px solid var(--line);border-radius:999px;
  padding:6px 10px;margin:0;max-width:140px;cursor:pointer;
}
.gt-mirror:hover{border-color:var(--accent);color:var(--ink);}
.gt-mirror:focus-visible{outline:2px solid var(--accent);outline-offset:2px;}
.gt-mirror[hidden]{display:none;}
/* ================= hero ================= */
.hero2{border-bottom:1px solid var(--line); overflow:hidden;}
.hero2-in{display:grid; grid-template-columns:1.04fr .96fr; gap:56px; align-items:center; padding:96px 0 110px;}
.hero2 h1{font-size:clamp(48px,6vw,86px); margin-bottom:24px;}
.hero2 h1 .em{color:var(--accent);}
.hero2 p.sub{font-size:20px; color:var(--ink2); max-width:30em; margin-bottom:36px;}
.cta-row{display:flex; gap:14px; flex-wrap:wrap; margin-bottom:26px;}
.trust{font-size:14px; color:var(--ink2); font-weight:600;}
.trust b{color:var(--ink);}
/* boutique demo mock: printed-menu styling */
.hero-visual{position:relative; display:flex; justify-content:center;}
.demo{position:relative; background:#FFFDF7; border:1px solid var(--line); border-radius:22px;
  box-shadow:var(--shadow-lg); padding:38px 36px 30px; width:min(420px,100%); transform:rotate(-1.2deg);}
.demo-kick{font-size:11px; font-weight:800; letter-spacing:2.5px; color:var(--accent); margin-bottom:10px;}
.demo-name{font-family:var(--disp); font-weight:800; font-size:34px; letter-spacing:-.03em; line-height:1.05; margin-bottom:6px;}
.demo-tag{font-size:14px; color:var(--ink2); margin-bottom:22px;}
.demo-menu{border-top:2px solid var(--ink); padding-top:6px; margin-bottom:24px;}
.mi{display:flex; align-items:baseline; gap:10px; padding:11px 0;}
.mn{font-weight:700; font-size:16.5px;}
.mi .dots{flex:1; border-bottom:2px dotted var(--line); transform:translateY(-4px); min-width:24px;}
.mp{font-weight:800; font-size:16.5px; white-space:nowrap;}
.demo-cta{display:flex; gap:10px;}
.wa-order{flex:1; text-align:center; background:var(--wa); color:#fff; font-weight:700; border-radius:999px; padding:13px; text-decoration:none; font-size:15.5px;}
.demo-qr{flex:none; border:1.5px dashed var(--ink2); border-radius:12px; padding:8px 10px; text-align:center; font-size:10.5px; font-weight:700; color:var(--ink2);}
#demoQr img,#demoQr canvas{border-radius:6px;}
.ticket{position:absolute; right:-34px; bottom:-24px; background:var(--paper); border:2px dashed var(--ink);
  border-radius:14px; padding:12px 18px; transform:rotate(3deg); box-shadow:var(--shadow-md);
  font-family:var(--disp); font-weight:800; font-size:15px; letter-spacing:-.01em;}
.ticket small{display:block; font-size:10.5px; font-weight:800; letter-spacing:2px; color:var(--accent); margin-bottom:2px;}
.stamp{display:inline-block; border:2px solid var(--accent); color:var(--accent); border-radius:8px;
  padding:6px 14px; font-size:12px; font-weight:800; letter-spacing:2px; transform:rotate(-3deg); background:var(--paper);}
/* ================= marquee ================= */
.marquee{border-bottom:1px solid var(--line); background:var(--ink); color:var(--paper); overflow:hidden; padding:20px 0;}
.mq-view{overflow:hidden; -webkit-mask-image:linear-gradient(90deg, transparent, #000 6%, #000 94%, transparent); mask-image:linear-gradient(90deg, transparent, #000 6%, #000 94%, transparent);}
.mq-track{display:flex; gap:0; width:max-content; animation:mq 36s linear infinite;}
.mq-track:hover{animation-play-state:paused;}
@keyframes mq{to{transform:translateX(-50%);}}
.mq-item{display:flex; align-items:center; gap:26px; padding-right:26px; font-family:var(--disp); font-weight:800; font-size:21px; letter-spacing:-.02em; white-space:nowrap;}
.mq-dot{color:var(--accent); font-size:15px;}
/* ================= sections ================= */
.sec{padding:104px 0; border-bottom:1px solid var(--line); scroll-margin-top:72px;}
.sec-head{margin-bottom:56px; max-width:720px;}
.sec-head.center{margin-left:auto; margin-right:auto; text-align:center;}
.sec h2{font-family:var(--disp); font-weight:800; letter-spacing:-.035em; line-height:1.04; font-size:clamp(34px,4.6vw,56px); margin-bottom:16px;}
.sec p.lead{color:var(--ink2); font-size:20px; max-width:36em;}
.sec-dark{background:var(--ink); color:var(--paper); border-bottom:none;}
.sec-dark .kick{color:var(--amber);}
.sec-dark p.lead{color:#B9B0A0;}
/* how it works: giant outlined numerals */
.steps{display:grid; grid-template-columns:repeat(3,1fr); gap:44px;}
.step-n{font-family:var(--disp); font-weight:800; font-size:clamp(76px,7.5vw,116px); letter-spacing:-.045em; line-height:1;
  color:transparent; -webkit-text-stroke:2px var(--accent); margin-bottom:20px;}
.step h3{font-size:23px; font-weight:800; letter-spacing:-.02em; margin-bottom:10px;}
.step p{color:#B9B0A0; font-size:16.5px; max-width:24em;}
.step-vis{margin-top:22px; background:#241E16; border:1px solid #3A3226; border-radius:16px; padding:20px; min-height:130px;}
.mock-type{background:#1B1712; border:1px solid #3A3226; border-radius:10px; padding:14px; font-size:14px; color:#B9B0A0; line-height:1.55; margin-bottom:14px;}
.mock-mic{display:inline-flex; align-items:center; gap:8px; border:1.5px solid var(--accent); color:var(--accent); font-weight:700; border-radius:999px; padding:9px 18px; font-size:13.5px;}
.mock-menu{border:1px solid #3A3226; border-radius:10px; overflow:hidden;}
.mock-menu .mm-row{display:flex; align-items:baseline; gap:8px; padding:9px 14px; font-size:13.5px; border-bottom:1px dotted #3A3226;}
.mock-menu .mm-row:last-child{border-bottom:none;}
.mock-menu .dots{flex:1; border-bottom:2px dotted #3A3226; transform:translateY(-3px);}
.mock-menu b{font-weight:800;}
.mock-qr{display:flex; gap:14px; align-items:center;}
.mock-qr .qr-ph{width:96px; height:96px; border-radius:10px; background:repeating-conic-gradient(#FAF6EF 0 25%, #1B1712 0 50%) 0 0/20px 20px; flex:none; border:1px solid #3A3226;}
.mock-qr .qr-cap{font-size:13.5px; color:#B9B0A0; line-height:1.5;}
/* ================= bento ================= */
.bento{display:grid; grid-template-columns:repeat(12,1fr); gap:20px;}
.bento>.b-card{grid-column:span 4;}
.b-card{background:#FFFDF7; border:1px solid var(--line); border-radius:var(--r); padding:36px; position:relative; overflow:hidden;}
.b-card.w7{grid-column:span 7;} .b-card.w5{grid-column:span 5;}
.b-card .k{font-size:12px; letter-spacing:2px; color:var(--accent); margin-bottom:12px; font-weight:800; text-transform:uppercase;}
.b-card h3{font-family:var(--disp); font-weight:800; font-size:26px; letter-spacing:-.025em; margin-bottom:10px;}
.b-card p{color:var(--ink2); font-size:16.5px; max-width:32em;}
.b-visual{margin-top:26px;}
.chat-mock{max-width:360px;}
.bubble{background:#E9F8EA; border-radius:4px 14px 14px 14px; padding:10px 14px; font-size:14.5px; line-height:1.45; margin-bottom:8px; color:var(--ink);}
.bubble .tick{color:var(--wa); font-size:11px; display:block; text-align:right; margin-top:4px;}
.chat-mock .bubble.out{background:var(--ink); color:var(--paper); border-radius:14px 14px 4px 14px; margin-left:40px;}
.chat-mock .bubble.out .tick{color:var(--amber);}
.qr-mock{display:flex; gap:18px; align-items:center;}
#bentoQr img, #bentoQr canvas{border:1px solid var(--line); border-radius:12px; padding:8px; background:#fff;}
.qr-mock .t{font-size:14.5px; color:var(--ink2);}
.banner-mock{background:var(--accent); color:#fff; border-radius:12px; padding:18px; font-weight:800; text-align:center; font-size:17px; letter-spacing:-.01em;}
.banner-mock small{display:block; font-weight:400; opacity:.9; font-size:13.5px; margin-top:4px;}
.edit-mock{display:grid; grid-template-columns:1fr 1fr; gap:12px;}
.edit-mock .em{background:var(--paper); border:1px solid var(--line); border-radius:12px; padding:14px; font-size:14px;}
.edit-mock .em .ek{font-size:10.5px; letter-spacing:1.5px; color:var(--ink2); margin-bottom:6px; font-weight:800;}
.edit-mock .em.new{border:1.5px solid var(--accent); background:var(--ember-soft);}
/* ================= examples ================= */
.shopgrid{display:grid; grid-template-columns:repeat(3,1fr); gap:22px;}
.shopcard{background:#FFFDF7; border:1px solid var(--line); border-radius:var(--r); overflow:hidden; transition:transform .15s ease, box-shadow .15s ease;}
.shopcard:hover{transform:translateY(-4px); box-shadow:var(--shadow-md);}
.shopcard img{width:100%; height:220px; object-fit:cover;}
.shopcard .b{padding:24px 26px 28px;}
.shopcard .k{font-size:11.5px; letter-spacing:2px; color:var(--accent); font-weight:800; margin-bottom:8px; text-transform:uppercase;}
.shopcard .n{font-family:var(--disp); font-weight:800; font-size:23px; letter-spacing:-.025em; margin-bottom:6px;}
.shopcard p{font-size:15.5px; color:var(--ink2);}
/* ================= pricing ================= */
.price-grid{display:grid; grid-template-columns:1fr 1fr; gap:24px; max-width:920px; margin:0 auto;}
.price-card{background:#FFFDF7; border:2px solid var(--ink); border-radius:22px; padding:44px 40px; position:relative;}
.price-card.launch{background:var(--ink); color:var(--paper); border-color:var(--ink);}
.price-card .stamp{margin-bottom:22px;}
.price-name{font-family:var(--disp); font-weight:800; font-size:26px; letter-spacing:-.025em; margin-bottom:4px;}
.price-note{font-size:14.5px; color:var(--ink2); margin-bottom:20px;}
.price-card.launch .price-note{color:#B9B0A0;}
.price-amount{font-family:var(--disp); font-weight:800; font-size:clamp(56px,6vw,76px); letter-spacing:-.045em; line-height:1; margin-bottom:6px;}
.price-was{font-size:16px; color:var(--ink2); margin-bottom:24px;}
.price-card.launch .price-was{color:#B9B0A0;}
.price-was s{margin-right:8px;}
.price-feats{list-style:none; margin:0 0 32px; padding:0;}
.price-feats li{padding:9px 0; border-bottom:1px dotted var(--line); font-size:16px; display:flex; gap:12px; align-items:baseline;}
.price-card.launch .price-feats li{border-color:#3A3226;}
.price-feats li i{font-style:normal; color:var(--accent); font-weight:800; flex:none;}
.price-card .btn{width:100%; text-align:center;}
.pay-note{max-width:620px; margin:36px auto 0; text-align:center; font-size:15.5px; color:var(--ink2);}
.pay-note b{color:var(--ink);}
/* ================= faq ================= */
.faq{max-width:800px;}
.faq details{border-bottom:1px solid var(--line); padding:6px 0;}
.faq details:first-child{border-top:1px solid var(--line);}
.faq summary{cursor:pointer; padding:20px 4px; font-weight:700; font-size:18.5px; letter-spacing:-.01em; list-style:none; display:flex; justify-content:space-between; gap:16px; align-items:baseline;}
.faq summary::-webkit-details-marker{display:none;}
.faq summary::after{content:"+"; color:var(--accent); font-weight:400; font-size:24px; line-height:1; flex:none;}
.faq details[open] summary::after{content:"–";}
.faq .a{padding:0 4px 24px; color:var(--ink2); font-size:17px; max-width:44em;}
/* ================= final cta + footer ================= */
.cta-panel{background:var(--ink); color:var(--paper); border-radius:28px; padding:104px 32px; text-align:center; position:relative; overflow:hidden;}
.cta-panel .kick{color:var(--amber);}
.cta-panel h2{font-family:var(--disp); font-weight:800; letter-spacing:-.035em; line-height:1.02; font-size:clamp(36px,5.4vw,64px); margin-bottom:18px; max-width:20ch; margin-left:auto; margin-right:auto;}
.cta-panel p{color:#B9B0A0; font-size:19px; max-width:32em; margin:0 auto 36px;}
footer{background:var(--ink); color:#B9B0A0; padding:72px 0 40px;}
.foot{display:grid; grid-template-columns:1.5fr 1fr 1fr 1fr; gap:36px; font-size:15px;}

.foot .brand{font-family:var(--disp); font-weight:800; font-size:26px; letter-spacing:-.03em; color:var(--paper); margin-bottom:12px; display:block; text-decoration:none;}
.foot .brand span{color:var(--accent);}
.foot .tag{max-width:26em; line-height:1.6;}
.foot-bottom{margin-top:52px; padding-top:26px; border-top:1px solid #3A3226; display:flex; justify-content:space-between; flex-wrap:wrap; gap:12px; font-size:13.5px;}
.foot-loc{margin-top:18px; font-size:13.5px;}
.foot-loc a{color:#B9B0A0;}
/* ================= gys page ================= */
.gys-hero{text-align:center; max-width:780px; margin:0 auto;}
.gys-hero h1{font-size:clamp(38px,6vw,62px); margin-bottom:18px;}
.gys-hero .lead{margin:0 auto 34px;}
.gys-hero .cta-row{margin-bottom:18px;}
/* ================= responsive ================= */
@media(max-width:1024px){
  .mast nav a.nl{display:none;}
  .mast nav{gap:14px;}
  .hero2-in{grid-template-columns:1fr; padding:64px 0 88px; gap:64px;}
  .hero-visual{max-width:520px; margin:0 auto; width:100%;}
  .ticket{right:6px;}
  .steps{grid-template-columns:1fr; gap:36px;}
  .b-card.w7,.b-card.w5{grid-column:span 12;}
  .bento>.b-card{grid-column:span 6;}
  .shopgrid{grid-template-columns:1fr 1fr;}
  .price-grid{grid-template-columns:1fr; max-width:560px;}
  .foot{grid-template-columns:1fr 1fr;}
}
@media(max-width:640px){
  .mast-in{height:60px;}
  .wordmark{font-size:21px;}
  .sec{padding:72px 0;}
  .hero2-in{padding:52px 0 72px;}
  .hero2 p.sub{font-size:18px;}
  .shopgrid{grid-template-columns:1fr;}
  .cta-row .btn{flex:1 1 auto; text-align:center;}
  .demo{padding:30px 24px 24px;}
  .price-card{padding:34px 26px;}
  .cta-panel{padding:72px 22px;}
  .foot{grid-template-columns:1fr;}
  .edit-mock{grid-template-columns:1fr;}
  .bento>.b-card{grid-column:span 12;}
  .sec-head{margin-bottom:40px;}
}
@media(min-width:1440px){
  .wrap{max-width:1360px; padding:0 40px;}
  .hero2 h1{font-size:clamp(56px,5.4vw,100px);}
  .sec{padding:124px 0;}
}
@media(prefers-reduced-motion:reduce){
  .mq-track{animation:none;}
  html{scroll-behavior:auto;}
}


.langsel{background:transparent;border:1px solid var(--line);border-radius:99px;padding:8px 10px;font:inherit;font-size:13px;color:var(--ink);margin-left:10px;cursor:pointer}

@media(max-width:560px){.loc-banner{flex-direction:column;align-items:stretch;text-align:center;padding:12px 16px;}.loc-msg{font-size:13px;margin-bottom:10px;padding-right:30px;}.loc-btns{flex-direction:column;align-items:stretch;}.loc-btns .btn{min-height:44px;white-space:nowrap;}}
/* ---- locale chooser (Apple-style) ---- */

.loc-none{padding:22px 18px;color:var(--ink2);font-size:15px;background:#fff;border:1px solid var(--line);border-radius:16px;margin-top:14px;display:none}
@media(min-width:900px){.loc-grid{display:grid;grid-template-columns:1fr 1fr;gap:0 28px;align-items:start}}
.foot-loc{display:inline-block;color:var(--ink2);text-decoration:none;font-size:14px;margin-top:12px}
.foot-loc a{color:var(--ink2);text-decoration:none}
.foot-loc a:hover{color:var(--ink)}
.shop-loc{display:inline-block;margin-top:10px;color:var(--ink2);font-size:13px;text-decoration:none}
.shop-loc a{color:var(--ink2);text-decoration:none}
/* ---- shop themes ---- */
.shoptheme{--s-accent:var(--accent);--s-accent-deep:var(--accent-deep);--s-soft:#EEF3EE;}
.theme-forest{--s-accent:#175E3B;--s-accent-deep:#0E4A2C;--s-soft:#E9F3ED;}
.theme-ocean{--s-accent:#1E5AAF;--s-accent-deep:#15447F;--s-soft:#EAF0FA;}
.theme-plum{--s-accent:#7A2E5E;--s-accent-deep:#521D40;--s-soft:#F7EAF2;}
.theme-sunset{--s-accent:#B4531F;--s-accent-deep:#7E3A12;--s-soft:#FAF0E6;}
.theme-char{--s-accent:#3A3A35;--s-accent-deep:#23231F;--s-soft:#EFEEE9;}
.theme-cocoa{--s-accent:#7A4A2B;--s-accent-deep:#54301B;--s-soft:#F5ECE3;}
.shoptheme .banner{background:var(--s-accent);}
.shoptheme .shop-mast{background:var(--s-soft);border-bottom:3px solid var(--s-accent);}
.shoptheme .shop-mast .kicker{color:var(--s-accent);}
.shoptheme .shop-sec h2::after,.shoptheme .msh-sec h2::after{content:"";display:block;width:34px;height:3px;border-radius:2px;background:var(--s-accent);margin-top:9px;}
.shoptheme .msh-mast{background:var(--s-soft);margin:0 -16px;padding:18px 16px 16px;border-bottom:1px solid var(--line);}
.shoptheme .msh-mast .kicker{color:var(--s-accent);}
.shoptheme .order-btn{background:var(--s-accent);}
.shoptheme .order-btn:active{background:var(--s-accent-deep);}
.shoptheme .pc-add:active{background:var(--s-accent-deep);}
.shoptheme .shop-foot a{color:var(--s-accent);}
/* ---- builder: theme swatches ---- */
.swatch-row{display:flex;gap:14px;flex-wrap:wrap;margin-top:10px;}
.swatch{width:56px;height:56px;border-radius:50%;border:3px solid transparent;box-shadow:0 0 0 1px var(--line);cursor:pointer;padding:0;flex:none;}
.swatch.on{border-color:#fff;box-shadow:0 0 0 2px var(--ink);}
/* ---- shop: search, categories, products ---- */
.shop-tools{margin-bottom:4px;position:relative;}
.shop-search{width:100%;border:1px solid var(--line);border-radius:12px;padding:12px 14px;margin-bottom:12px;background:#fff;font-size:16px;}
.sr-count{font-size:13px;color:var(--ink2);padding:2px 2px 10px;}
.sr-none{text-align:center;padding:36px 20px 24px;max-width:420px;margin:0 auto;}
.sr-none-ic{font-size:34px;line-height:1;color:var(--ink2);margin-bottom:12px;}
.sr-none-t{font-size:16px;font-weight:700;margin:0 0 6px;}
.sr-none-s{font-size:13px;color:var(--ink2);margin:0 0 16px;}
.sr-none-clear{min-height:44px;padding:0 24px;}
.sr-alt{margin-top:28px;text-align:start;}
.sr-alt-h{font-size:13px;font-weight:700;color:var(--ink2);margin:0 0 10px;}
mark{background:#ffe58f;color:inherit;border-radius:3px;padding:0 2px;}
.sr-panel{position:absolute;top:100%;left:0;right:0;background:#fff;border:1px solid var(--line);border-radius:12px;margin-top:2px;box-shadow:0 12px 32px rgba(0,0,0,.14);z-index:60;overflow:hidden;}
.sr-head{display:flex;justify-content:space-between;align-items:center;padding:10px 14px 2px;font-size:11px;color:var(--ink2);text-transform:uppercase;letter-spacing:.05em;}
.sr-clear{background:none;border:0;color:var(--ink2);font-size:13px;text-transform:none;letter-spacing:0;cursor:pointer;padding:4px 0;}
.sr-item{display:block;width:100%;text-align:start;background:none;border:0;border-top:1px solid var(--line);padding:12px 14px;font-size:15px;color:var(--ink);cursor:pointer;}
.sr-item:hover{background:#f6f6f6;}
.sr-sug{display:flex;align-items:center;gap:10px;min-height:48px;}
.sr-sug-main{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;}
.sr-sug-sub{flex:none;font-size:13px;color:var(--ink2);}
.sr-thumb{width:36px;height:36px;object-fit:cover;border-radius:8px;flex:none;background:#f1f1f1;}
.sr-cat .sr-sug-sub{font-size:12px;background:#f1f1f1;border-radius:10px;padding:2px 9px;}
.chips{display:flex;gap:8px;overflow-x:auto;padding-bottom:8px;margin-bottom:8px;-webkit-overflow-scrolling:touch;}
.chip{flex:none;border:1px solid var(--line);background:#fff;border-radius:999px;padding:8px 18px;font-size:14px;cursor:pointer;color:var(--ink);}
.sortbar{display:flex;align-items:center;justify-content:flex-end;gap:8px;margin:0 0 10px;}
.sortlab{font-size:13px;color:var(--muted);}
.sortsel{border:1px solid var(--line);background:#fff;border-radius:999px;padding:10px 14px;font-size:14px;color:var(--ink);min-height:44px;max-width:70vw;cursor:pointer;}
/* Narrow screens: the Price/Sort selects carry their own aria-labels, so the
   redundant text labels hide to give the two dropdowns room in one row. */
@media(max-width:560px){.sortbar .sortlab{display:none;}}
.msh-rail .sortbar{margin:6px 0 0;}
.chip.on{background:var(--s-accent);border-color:var(--s-accent);color:#fff;font-weight:700;}
.prod2{display:block;padding:16px 0;border-bottom:1px dotted var(--line);}
.prod2:last-child{border-bottom:none;}
.prod2 .pn{font-size:17px;font-weight:600;display:flex;align-items:center;flex-wrap:wrap;gap:4px;}
.prod2 .pp{font-family:ui-monospace,Menlo,monospace;font-size:15px;white-space:nowrap;}
.prow1{display:flex;justify-content:space-between;align-items:baseline;gap:12px;}
.prow2{display:flex;gap:8px;justify-content:flex-end;align-items:center;margin-top:10px;flex-wrap:wrap;}
.stk{font-size:11px;font-weight:700;border-radius:999px;padding:3px 10px;margin-left:8px;white-space:nowrap;}
.stk-low{background:#FCF3DC;color:#8a5a00;}
.stk-out{background:#F1EFE7;color:#8a8577;}
.stk-best{background:var(--s-accent,var(--accent));color:#fff;margin-left:0;margin-inline-start:8px;}
.vpills{display:flex;flex-wrap:wrap;gap:8px;margin-top:8px;}
.vpill{border:1px solid var(--line);background:#fff;border-radius:999px;padding:8px 16px;font-size:13.5px;cursor:pointer;color:var(--ink);min-height:44px;line-height:1.35;max-width:100%;}
.vpill.on{background:var(--s-accent);border-color:var(--s-accent);color:#fff;font-weight:700;}
.vpill:focus-visible{outline:2px solid var(--s-accent);outline-offset:2px;}
.ask-btn{font-size:13.5px;font-weight:600;color:var(--s-accent);text-decoration:underline;white-space:nowrap;background:none;border:0;cursor:pointer;padding:8px 6px;min-height:44px;display:inline-flex;align-items:center;}
.pc-share{width:44px;height:44px;flex:none;display:inline-flex;align-items:center;justify-content:center;border:1px solid var(--line);border-radius:50%;background:#fff;color:var(--ink2);cursor:pointer;}
.pc-share:active{transform:scale(.93);}
.pc-share.ok{border-color:var(--s-accent);color:var(--s-accent);}
/* ---- save for later (familiar Amazon/Flipkart wishlist pattern): heart overlay
   on the product image corner + in the lightbox; saved items collect in a rail ---- */
.pc-saveov{position:absolute;top:6px;inset-inline-end:6px;width:40px;height:40px;border:0;border-radius:50%;background:rgba(255,255,255,.94);color:var(--ink2);cursor:pointer;display:flex;align-items:center;justify-content:center;box-shadow:0 1px 4px rgba(0,0,0,.18);z-index:2;}
.pc-saveov:active{transform:scale(.93);}
.pc-saveov.on{color:var(--s-accent);}
.pc-saveov.on svg{fill:currentColor;}
.wl-card{position:relative;}
.wl-rm{position:absolute;top:4px;inset-inline-end:4px;width:32px;height:32px;border:0;border-radius:50%;background:rgba(255,255,255,.94);color:var(--ink2);font-size:18px;line-height:1;cursor:pointer;display:flex;align-items:center;justify-content:center;box-shadow:0 1px 3px rgba(0,0,0,.14);z-index:2;}
.wl-rm:active{transform:scale(.93);}
.hl-card{animation:hlpulse 1.1s ease-in-out 2;}
@keyframes hlpulse{0%,100%{box-shadow:0 0 0 0 rgba(0,0,0,0);}50%{box-shadow:0 0 0 3px var(--s-accent);}}
/* ---- recently viewed rail (familiar Amazon/Shopify pattern): a compact
   horizontal shelf under the product grid so shoppers can jump back to
   products they were considering, without scrolling or searching. ---- */
.rv-sec{margin:26px 0 0;}
.rv-h{font-family:"Iowan Old Style",Palatino,Georgia,serif;font-size:20px;letter-spacing:-.5px;margin:0 0 12px;}
.rv-h::after{content:"";display:block;width:34px;height:3px;border-radius:2px;background:var(--s-accent);margin-top:9px;}
.rv-rail{display:flex;gap:10px;overflow-x:auto;padding:2px 2px 10px;scrollbar-width:thin;}
.rv-card{flex:0 0 132px;border:1px solid var(--line);border-radius:12px;background:#fff;padding:8px;display:flex;flex-direction:column;gap:6px;}
.rv-img{border:0;background:var(--s-soft,#f4f4f4);border-radius:8px;padding:0;cursor:pointer;aspect-ratio:1/1;overflow:hidden;display:block;width:100%;}
.rv-img img{width:100%;height:100%;object-fit:cover;display:block;}
.rv-name{font-size:12.5px;font-weight:600;line-height:1.3;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;min-height:32px;}
.rv-price{font-size:13.5px;font-weight:800;}
.rv-add{min-height:40px;border:0;border-radius:9px;background:var(--s-accent,var(--accent));color:#fff;font-weight:700;font-size:13.5px;cursor:pointer;padding:0 12px;}
.rv-card .pc-step{display:flex;align-items:center;justify-content:space-between;gap:4px;}
.rv-card .pc-step button{min-width:40px;min-height:40px;}
/* ---- privacy consent banner (familiar cookie-bar pattern): fixed bottom sheet,
   sits above the cart bar, centered on desktop, mirrors automatically in RTL ---- */
.ck-bar{position:fixed;left:12px;right:12px;bottom:84px;z-index:70;max-width:560px;margin:0 auto;
  background:#fff;border:1px solid var(--line);border-radius:14px;box-shadow:0 10px 34px rgba(0,0,0,.14);
  padding:12px 14px;display:flex;gap:12px;align-items:center;}
.ck-tx{flex:1;display:flex;flex-direction:column;gap:2px;font-size:13px;line-height:1.45;color:#333;}
.ck-tx b{font-size:13.5px;color:#111;}
.ck-btns{display:flex;gap:8px;flex:0 0 auto;}
.ck-ok,.ck-no{min-height:44px;padding:0 16px;border-radius:10px;font-weight:700;font-size:14px;cursor:pointer;}
.ck-ok{border:0;background:var(--s-accent,var(--accent));color:#fff;}
.ck-no{border:1px solid var(--line);background:#fff;color:#333;}
.add-btn:disabled{opacity:.35;cursor:not-allowed;}
.openbadge{display:inline-flex;align-items:center;gap:8px;margin-top:16px;font-size:14px;font-weight:700;border-radius:999px;padding:8px 18px;}
.ob-open{background:#E7F6EA;color:#14663a;}
.ob-closed{background:#F1EFE7;color:#6b675c;}
.openbadge .dot{width:8px;height:8px;border-radius:50%;background:currentColor;flex:none;}
/* ---- cart bar + drawer ---- */
.cartbar{position:fixed;left:0;right:0;bottom:0;z-index:60;padding:12px 16px calc(12px + env(safe-area-inset-bottom));background:rgba(255,255,255,.97);border-top:1px solid var(--line);}
.cartbar-btn{width:100%;max-width:560px;margin:0 auto;display:flex;justify-content:space-between;align-items:center;background:var(--s-accent,var(--accent));color:#fff;border:0;border-radius:14px;padding:15px 20px;font-size:16px;font-weight:700;cursor:pointer;}
@keyframes barpop{from{transform:translateY(14px);opacity:.35}to{transform:none;opacity:1}}
.cartbar.pop .cartbar-btn{animation:barpop .28s ease-out}
.add-btn{transition:transform .15s ease}
.add-btn.added{transform:scale(.94);}
/* ---- shopper pass: free-delivery nudge, WhatsApp share, saved-details clear ---- */
.fd-nudge{max-width:560px;margin:0 auto 10px;display:flex;flex-direction:column;gap:6px;font-size:13px;font-weight:600;color:var(--ink2);}
.fd-track{display:flex;height:6px;border-radius:3px;background:var(--line);overflow:hidden;}
.fd-fill{display:block;height:100%;border-radius:3px;background:var(--s-accent,var(--accent));transition:width .25s ease;}
.fd-chip{display:inline-block;margin-top:10px;padding:7px 14px;border-radius:999px;background:var(--s-soft);color:var(--s-accent-deep);font-size:13px;font-weight:700;}
.wa-share-btn{display:inline-flex;align-items:center;gap:8px;min-height:44px;margin-top:12px;padding:10px 18px;border:1px solid var(--ink);border-radius:999px;background:transparent;color:var(--ink);text-decoration:none;font-size:14px;font-weight:700;}
.wa-share-btn svg{flex:none;}
.ck-clearsaved{display:inline-block;margin-top:6px;min-height:44px;padding:10px 4px;background:none;border:0;color:var(--ink2);font-size:13px;text-decoration:underline;cursor:pointer;}
/* ---- builder: progress dots ---- */
.bdots{display:flex;gap:10px;align-items:center;justify-content:center;margin:6px 0 22px;flex-wrap:wrap;}
.bdot{display:flex;align-items:center;gap:8px;color:var(--ink2);font-size:13px;font-weight:700;}
.bdot i{width:26px;height:26px;border-radius:50%;border:2px solid var(--line);display:inline-flex;align-items:center;justify-content:center;font-style:normal;font-size:13px;background:#fff;flex:none;}
.bdot.on{color:var(--ink);}
.bdot.on i{border-color:var(--accent);background:var(--accent);color:#fff;}
.bdot.done{color:var(--ink2);}
.bdot.done i{border-color:var(--accent);color:var(--accent);}
.bdot-sep{width:24px;height:2px;background:var(--line);}
/* ---- builder: product field rows ---- */
.pf-row{border:1px solid var(--line);border-radius:12px;padding:14px;margin-bottom:12px;background:#fff;}
.pf-top{display:flex;gap:8px;margin-bottom:10px;}
.pf-cat{flex:1;border:1px solid var(--line);border-radius:8px;padding:9px 10px;font-size:14px;background:#fff;min-width:0;}
.pf-newcat{flex:1;border:1px solid var(--line);border-radius:8px;padding:9px 10px;font-size:14px;min-width:0;}
.pf-del{flex:none;min-width:44px;min-height:44px;border:1px solid var(--line);background:#fff;border-radius:8px;font-size:18px;cursor:pointer;color:var(--ink2);}
.pf-grid{display:flex;gap:8px;margin-bottom:10px;}
.pf-grid input{flex:1;border:1px solid var(--line);border-radius:8px;padding:10px 12px;font-size:15px;min-width:0;}
.pf-grid .pf-price{flex:0 0 120px;}
.pf-var{display:flex;gap:8px;margin-bottom:8px;}
.pf-var input{border:1px solid var(--line);border-radius:8px;padding:8px 10px;font-size:14px;min-width:0;}
.pf-var .pf-vname{flex:1;}
.pf-var .pf-vprice{flex:0 0 100px;}
.pf-vardel{flex:none;min-width:44px;min-height:44px;border:1px solid var(--line);background:#fff;border-radius:8px;cursor:pointer;color:var(--ink2);font-size:18px;}
.pf-pricewrap{position:relative;flex:0 0 120px;display:flex;min-width:0;}
.pf-grid .pf-pricewrap .pf-price{flex:1 1 auto;width:100%;padding-inline-start:26px;min-width:0;}
.pf-cur{position:absolute;inset-inline-start:10px;top:50%;transform:translateY(-50%);color:var(--ink2);font-size:15px;pointer-events:none;}
.pf-dup{flex:none;border:0;background:none;color:var(--s-accent,var(--accent));font-size:13px;font-weight:700;cursor:pointer;padding:10px 6px;min-height:44px;white-space:nowrap;}
.pf-err{color:#b3261e;font-size:13px;margin:-2px 0 10px;}
.pf-bad{border-color:#b3261e !important;}
.imp-vars,.imp-stock{font-size:13px;color:var(--ink2);margin-bottom:6px;}
.okmsg{background:#e6f4ea;color:#137333;border-radius:8px;padding:10px 12px;font-size:14px;}
.paste-toggle{background:none;border:1px dashed var(--line);border-radius:8px;color:var(--ink2);font-size:14px;padding:8px 12px;cursor:pointer;}
#pasteBox{margin-bottom:14px;}
.pf-addvar{background:none;border:0;color:var(--s-accent,var(--accent));font-weight:700;font-size:14px;cursor:pointer;padding:8px 0;}
.pf-oos{display:flex;align-items:center;gap:8px;font-size:14px;color:var(--ink2);margin-top:8px;cursor:pointer;}
.pf-oos input{width:18px;height:18px;accent-color:var(--s-accent,var(--accent));}
/* ---- builder: live storefront preview ---- */
.pv-frame{border:1px solid var(--line);border-radius:14px;overflow:hidden;margin-bottom:20px;background:var(--paper);}
.pv-bar{background:#F1EFE7;color:#8a8577;font-size:12px;font-weight:700;letter-spacing:.08em;padding:8px 14px;}
.pv-shop{max-height:480px;overflow:auto;}
.pv-card{display:flex;gap:12px;padding:12px 14px;border-bottom:1px solid var(--line);align-items:flex-start;}
.pv-img{width:64px;height:64px;border-radius:10px;background:#E7E4DA;flex:none;}
.pv-nm{font-weight:700;font-size:15px;line-height:1.35;}
.pv-pr{font-weight:800;margin-top:3px;font-size:15px;}
.pv-add{display:inline-block;margin-top:9px;background:var(--s-accent,var(--accent));color:#fff;font-weight:800;font-size:13px;border-radius:8px;padding:8px 24px;}
/* ---- storefront: product cards ---- */
.pc{display:flex;gap:14px;padding:16px 0;border-bottom:1px solid var(--line);}
.pc-img{width:88px;height:88px;border-radius:12px;background:#E7E4DA;flex:none;position:relative;}
.pc-img{overflow:hidden;}
.pc-img img{width:100%;height:100%;object-fit:cover;display:block;}
/* tap-to-zoom product image: the thumbnail is a button that opens a full-screen lightbox */
.pz{border:0;padding:0;background:none;display:block;width:100%;height:100%;cursor:zoom-in;-webkit-tap-highlight-color:transparent;}
.pz img{width:100%;height:100%;object-fit:cover;display:block;}
.lb{position:fixed;inset:0;background:rgba(8,8,10,.93);z-index:9999;display:flex;align-items:center;justify-content:center;cursor:zoom-out;opacity:0;transition:opacity .18s ease;}
.lb.open{opacity:1;}
.lb img{max-width:94vw;max-height:88vh;object-fit:contain;border-radius:10px;box-shadow:0 12px 48px rgba(0,0,0,.5);background:#E7E4DA;}
.lb-cap{position:absolute;left:0;right:0;bottom:max(18px, env(safe-area-inset-bottom));text-align:center;color:#fff;font-size:15px;font-weight:600;padding:0 64px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;}
.lb-x{position:absolute;top:max(14px, env(safe-area-inset-top));inset-inline-end:14px;width:44px;height:44px;border:0;border-radius:50%;background:rgba(255,255,255,.16);color:#fff;font-size:24px;line-height:1;cursor:pointer;display:flex;align-items:center;justify-content:center;}
.lb-wl{position:absolute;top:max(14px, env(safe-area-inset-top));inset-inline-start:14px;width:44px;height:44px;border:0;border-radius:50%;background:rgba(255,255,255,.16);color:#fff;cursor:pointer;display:flex;align-items:center;justify-content:center;}
.lb-wl:active{transform:scale(.93);}
.lb-wl.on{color:#ff9a8f;}
.lb-wl.on svg{fill:currentColor;}
.lb-x:active{background:rgba(255,255,255,.3);}
.pv-img{overflow:hidden;}
.pv-img img{width:100%;height:100%;object-fit:cover;display:block;}
.shop-banner{aspect-ratio:3/1;overflow:hidden;background:#E7E4DA;}
.shop-banner img{width:100%;height:100%;object-fit:cover;display:block;}
.pf-img{margin-top:10px;}
.pf-imglab{font-size:12px;font-weight:700;color:var(--ink2);display:block;margin-bottom:6px;}
.pf-imgtop{display:flex;align-items:center;gap:10px;}
.pf-thumb{width:52px;height:52px;border-radius:10px;background:#E7E4DA;flex:none;overflow:hidden;border:1px solid var(--line);}
.pf-thumb img{width:100%;height:100%;object-fit:cover;display:block;}
.pf-bthumb{width:100%;max-width:280px;aspect-ratio:3/1;border-radius:10px;background:#E7E4DA;overflow:hidden;border:1px solid var(--line);}
.pf-bthumb img{width:100%;height:100%;object-fit:cover;display:block;}
.pf-imgbtns{display:flex;gap:6px;flex-wrap:wrap;}
.pf-imgbtn{font-size:13px;font-weight:700;padding:12px 14px;min-height:44px;border-radius:10px;border:1px solid var(--line);background:#fff;cursor:pointer;color:var(--ink);}
.pf-imgbtn.on{background:var(--accent);border-color:var(--accent);color:#fff;}
.pf-catgrid{display:grid;grid-template-columns:repeat(6,1fr);gap:6px;margin-top:10px;}
.pf-catgrid button{aspect-ratio:1/1;border-radius:10px;overflow:hidden;border:2px solid var(--line);background:#F0EDE3;padding:0;cursor:pointer;}
.pf-catgrid button.on{border-color:var(--accent);}
.pf-catgrid img{width:100%;height:100%;object-fit:cover;display:block;pointer-events:none;}
.pf-urlrow{margin-top:10px;}
.pf-urlrow input{width:100%;}
.pf-imgerr{color:#B3261E;font-size:12.5px;margin-top:6px;}
.pc-mid{flex:1;min-width:0;}
.pc-name{font-weight:700;font-size:16px;line-height:1.35;}
.pc-price{font-weight:800;font-size:17px;margin-top:4px;}
/* Discount display (familiar Amazon/Flipkart/Zomato pattern): struck-through MRP
   + green "% off" pill next to the selling price. Inline spans mirror
   automatically in RTL; margins use logical properties. */
.pc-mrp{color:var(--ink2);font-weight:400;font-size:14px;text-decoration:line-through;margin-inline-start:8px;white-space:nowrap;}
.off-pill{font-size:11px;font-weight:800;border-radius:999px;padding:3px 10px;margin-inline-start:8px;white-space:nowrap;background:#DFF2E3;color:#0E7A34;}
.pf-mrp{display:flex;align-items:center;gap:10px;margin-bottom:10px;font-size:13px;color:var(--ink2);}
.pc-act{margin-top:10px;display:flex;align-items:center;gap:12px;flex-wrap:wrap;}
.pc-add{background:var(--s-accent,var(--accent));color:#fff;border:0;border-radius:10px;padding:11px 36px;font-weight:800;font-size:15px;cursor:pointer;min-height:44px;}
.pc-add:disabled{opacity:.45;cursor:not-allowed;}
.pc-add.pc-notify{background:none;border:2px solid var(--s-accent,var(--accent));color:var(--s-accent,var(--accent));opacity:1;display:inline-flex;align-items:center;gap:8px;padding:11px 18px;}
.pc-step{display:inline-flex;align-items:stretch;border:2px solid var(--s-accent,var(--accent));border-radius:10px;overflow:hidden;background:#fff;}
.pc-step button{width:44px;min-height:44px;border:0;background:var(--s-accent,var(--accent));color:#fff;font-size:20px;font-weight:800;cursor:pointer;}
.pc-step b{min-width:40px;display:inline-flex;align-items:center;justify-content:center;font-size:16px;background:#fff;}
/* ---- checkout: summary toggle, payment radios, sticky CTA ---- */
.ck-sumwrap{margin-bottom:16px;border:1px solid var(--line);border-radius:12px;background:#fff;overflow:hidden;}
.ck-sumtoggle{width:100%;display:flex;justify-content:space-between;align-items:center;border:0;background:#fff;padding:14px 18px;font-size:15px;font-weight:700;cursor:pointer;color:var(--ink);}
.ck-sumbody{border-top:1px solid var(--line);padding:8px 18px 14px;}
.ck-radio{display:flex;align-items:center;gap:12px;border:1px solid var(--line);border-radius:12px;padding:14px 16px;margin-bottom:10px;cursor:pointer;background:#fff;font-size:16px;font-weight:600;}
.ck-radio.on{border-color:var(--s-accent,var(--accent));box-shadow:0 0 0 1px var(--s-accent,var(--accent));}
.ck-radio input{width:20px;height:20px;accent-color:var(--s-accent,var(--accent));flex:none;margin:0;}
.ck-more{width:100%;background:none;border:0;color:var(--s-accent,var(--accent));font-weight:700;font-size:15px;padding:12px;cursor:pointer;}
.ck-sticky{position:fixed;left:0;right:0;bottom:0;z-index:60;background:rgba(255,255,255,.97);border-top:1px solid var(--line);padding:12px 16px calc(12px + env(safe-area-inset-bottom));}
.ck-sticky-in{max-width:560px;margin:0 auto;display:flex;align-items:center;gap:16px;}
.ck-sticky-tot{display:flex;flex-direction:column;line-height:1.3;flex:none;}
.ck-sticky-tot span{font-size:12px;color:var(--ink2);font-weight:600;}
.ck-sticky-tot b{font-size:19px;}
.ck-sticky .ck-paybtn{flex:1;margin:0;}
.ck-next{color:var(--ink2);font-size:15px;margin:12px 0 4px;}
.ck-code-row{display:inline-flex;align-items:center;gap:10px;margin:12px 0 6px;flex-wrap:wrap;justify-content:center;}
.ck-code-row .ck-orderno{margin:0;}
.ck-copybtn{border:1px solid var(--line);background:#fff;border-radius:999px;padding:8px 16px;font-size:13px;font-weight:700;cursor:pointer;color:var(--ink);min-height:40px;}
.ck-copybtn:hover{border-color:var(--s-accent,var(--accent));color:var(--s-accent,var(--accent));}
.ck-receipt{margin:18px auto 6px;max-width:480px;text-align:start;border:1px solid var(--line);border-radius:14px;padding:16px 18px;background:#fff;}
.ck-receipt h2{font-size:15px;margin:0 0 4px;font-weight:800;}
.ck-rmeta{color:var(--ink2);font-size:13px;margin:0 0 8px;}
.ck-rnote{font-size:13px;color:var(--ink2);margin:10px 0 0;padding-top:10px;border-top:1px dashed var(--line);line-height:1.45;overflow-wrap:anywhere;}
.ck-rnote b{color:var(--ink);font-weight:700;}
.ck-receipt .trow{font-size:14px;padding:5px 0;}
.ck-receipt .trow.grand{font-size:16px;margin-top:6px;padding-top:10px;}
.ck-receipt .qn{color:var(--ink2);font-size:12px;}
.link-btn{background:none;border:0;color:var(--ink2);font-size:15px;font-weight:600;cursor:pointer;padding:12px 8px;text-decoration:underline;}

/* ---- mobile storefront UI (isMobileUI) ---- */
.msh-head{position:sticky;top:0;z-index:55;background:rgba(255,253,248,.97);backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);border-bottom:1px solid var(--line);}
.msh-head-in{display:flex;align-items:center;gap:10px;height:58px;padding:0 14px;}
.msh-name{flex:1;min-width:0;font-weight:800;font-size:17px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
.msh-badge{flex:none;}
.msh-badge .openbadge{margin-top:0;padding:6px 12px;font-size:12px;gap:6px;white-space:nowrap;max-width:40vw;overflow:hidden;text-overflow:ellipsis;}
.msh-sbtn{flex:none;width:44px;height:44px;border-radius:50%;border:1px solid var(--line);background:#fff;color:var(--ink);font-size:19px;line-height:1;cursor:pointer;display:flex;align-items:center;justify-content:center;}
.msh-searchrow{display:none;position:relative;padding:10px 14px;background:var(--paper);border-bottom:1px solid var(--line);}
.msh-searchrow.open{display:block;}
.msh-searchrow .shop-search{margin-bottom:0;}
.msh-rail{position:sticky;top:58px;z-index:54;background:var(--paper);padding:10px 14px;border-bottom:1px solid var(--line);}
.msh-rail .chips{margin-bottom:0;padding-bottom:2px;}
.msh-rail .chip{padding:12px 18px;font-size:14px;min-height:44px;}
.msh-body{padding:0 16px 140px;}
.msh-mast{padding:18px 0 6px;}
.msh-status{margin-bottom:10px;}
.msh-status .openbadge{margin-top:0;}
.msh-mast .kicker{font-size:11px;letter-spacing:1px;font-weight:700;color:var(--s-accent);margin-bottom:8px;}
.msh-mast p{color:var(--ink2);font-size:15px;margin:0;line-height:1.5;}
.msh-sec{padding:24px 0;border-bottom:1px solid var(--line);}
.msh-sec h2{font-family:"Iowan Old Style",Palatino,Georgia,serif;font-size:22px;letter-spacing:-.5px;margin:0 0 4px;}
.msh-sec .sub{color:var(--ink2);font-size:14px;margin-bottom:14px;}
.msh-card{display:flex;gap:14px;padding:16px 0;border-bottom:1px solid var(--line);align-items:flex-start;}
.msh-card:last-child{border-bottom:0;}
.msh-img{width:84px;height:84px;flex:none;border-radius:14px;background:#E7E4DA;overflow:hidden;position:relative;}
.msh-img img{width:100%;height:100%;object-fit:cover;display:block;}
.msh-mid{flex:1;min-width:0;}
.msh .pc-act{margin-top:8px;}
.msh .shop-foot{padding-bottom:40px;}
.ck-wrap.mob{padding:20px 14px 120px;}
.ck-wrap.mob .ck-panel{padding:18px;}

/* ---- checkout page ---- */
.ck-wrap{max-width:1020px;margin:0 auto;padding:26px 18px 90px;}
.ck-backline{display:block;color:var(--ink2);text-decoration:none;font-size:14px;margin-bottom:10px;}
.ck-backline:hover{color:var(--ink);}
.ck-steps{display:flex;gap:6px;list-style:none;padding:0;margin:16px 0 24px;}
.ck-steps li{flex:1;text-align:center;font-size:13px;color:var(--ink2);padding:10px 4px;border-bottom:2px solid var(--line);font-weight:600;}
.ck-steps li.on{color:var(--ink);border-color:var(--s-accent,var(--accent));}
.ck-steps li.done{color:var(--s-accent,var(--accent));}
.ck-grid{display:grid;grid-template-columns:1fr;gap:22px;}
@media(min-width:860px){.ck-grid{grid-template-columns:1fr 330px;align-items:start;}.ck-side{position:sticky;top:18px;}}
.ck-panel{background:#fff;border:1px solid var(--line);border-radius:var(--r);padding:22px;}
.ck-side{background:#fff;border:1px solid var(--line);border-radius:var(--r);padding:20px;}
.ck-side h3{margin:0 0 6px;font-size:17px;}
.ck-line{display:flex;justify-content:space-between;gap:10px;padding:6px 0;font-size:14px;color:var(--ink);}
.ck-line .qn{color:var(--ink2);}
.ck-nav{display:flex;justify-content:space-between;align-items:center;gap:12px;margin-top:22px;}
.ck-tabs{display:flex;gap:8px;flex-wrap:wrap;margin:0 0 18px;}
.ck-tab{border:1px solid var(--line);background:#fff;border-radius:999px;padding:9px 16px;font-weight:600;font-size:14px;cursor:pointer;color:var(--ink);}
.ck-tab.on{background:var(--s-accent,var(--accent));border-color:var(--s-accent,var(--accent));color:#fff;}
.ck-err{background:#FDECEA;color:#A33A2E;border:1px solid #F0B9AC;border-radius:12px;padding:12px 14px;margin:14px 0;font-size:14px;}
.ck-test{background:var(--amber-soft);border:1px solid var(--amber);color:#7A5A12;border-radius:12px;padding:12px 14px;margin:0 0 16px;font-size:14px;}
.ck-paybtn{width:100%;background:var(--s-accent,var(--accent));color:#fff;border:0;border-radius:14px;padding:16px;font-size:17px;font-weight:700;cursor:pointer;display:flex;align-items:center;justify-content:center;gap:10px;margin-top:18px;}
.ck-paybtn:disabled{opacity:.65;cursor:wait;}
.ck-paybtn svg{flex:none;}
.ck-go{width:100%;background:var(--s-accent,var(--accent));color:#fff;border:0;border-radius:14px;padding:16px;font-size:17px;font-weight:700;cursor:pointer;margin-top:16px;}
.ck-field-err{color:#A33A2E;font-size:13px;margin-top:5px;}
.ck-bad{border-color:#C04532 !important;}
.ck-brand{font-size:12.5px;font-weight:700;color:var(--ink2);letter-spacing:.04em;text-transform:uppercase;}
.ck-cardrow{display:flex;justify-content:space-between;align-items:center;margin-bottom:8px;}
.ck-grid2{display:grid;grid-template-columns:1fr 1fr;gap:14px;}
.ck-stripebox{border:1px solid var(--line);border-radius:12px;padding:16px 14px;background:#fff;}
.ck-success{text-align:center;padding:44px 18px;max-width:520px;margin:0 auto;}
.ck-check{width:88px;height:88px;border-radius:50%;background:#E7F6EA;color:#14663a;font-size:46px;display:flex;align-items:center;justify-content:center;margin:0 auto 20px;font-weight:700;}
.ck-orderno{display:inline-block;background:var(--paper2);border:1px solid var(--line);border-radius:999px;padding:8px 18px;font-weight:700;letter-spacing:.06em;margin:12px 0 6px;}
.ck-btnrow{display:flex;gap:12px;justify-content:center;flex-wrap:wrap;margin-top:26px;}
@keyframes spin{to{transform:rotate(360deg)}}
.ck-spin{width:18px;height:18px;border:2.5px solid rgba(255,255,255,.45);border-top-color:#fff;border-radius:50%;animation:spin .7s linear infinite;flex:none;}
.ck-instr{background:var(--paper2);border:1px solid var(--line);border-radius:12px;padding:14px 16px;font-size:14px;color:var(--ink);margin-bottom:6px;}
.ck-instr pre{white-space:pre-wrap;font-family:inherit;margin:8px 0 0;font-size:13.5px;}
.drawer-wrap{position:fixed;inset:0;z-index:70;background:rgba(27,27,24,.5);}
.drawer{position:absolute;left:0;right:0;bottom:0;max-height:92dvh;overflow-y:auto;background:var(--paper);border-radius:20px 20px 0 0;padding:20px 20px calc(28px + env(safe-area-inset-bottom));-webkit-overflow-scrolling:touch;}
@media(min-width:760px){.drawer{left:50%;right:auto;transform:translateX(-50%);width:560px;border-radius:20px;margin-bottom:24px;max-height:86dvh;}}
.drawer-head{display:flex;justify-content:space-between;align-items:center;margin-bottom:8px;}
.drawer-x{border:0;background:none;font-size:28px;cursor:pointer;color:var(--ink2);line-height:1;min-width:44px;min-height:44px;display:inline-flex;align-items:center;justify-content:center;padding:0;}
.cline{display:flex;align-items:center;gap:10px;padding:12px 0;border-bottom:1px dotted var(--line);}
.cline .cn{flex:1;min-width:0;}
.cline .cn b{display:block;font-size:15px;}
.cline .cn small{color:var(--ink2);font-size:13px;}
.cline .lt{font-family:ui-monospace,Menlo,monospace;font-size:14px;white-space:nowrap;}
/* ---- cart drawer: suggested add-ons ("you might also like") ---- */
.sug{margin-top:16px;border-top:1px solid var(--line);padding-top:10px;}
.sug h4{margin:0 0 4px;font-size:14px;font-weight:800;color:var(--ink2);}
.sug-row{display:flex;align-items:center;gap:10px;padding:8px 0;border-bottom:1px dotted var(--line);}
.sug-img{width:46px;height:46px;border-radius:10px;object-fit:cover;flex:none;background:#E7E4DA;}
.sug-nm{flex:1;min-width:0;font-size:14px;font-weight:600;}
.sug-nm small{display:block;color:var(--ink2);font-size:12.5px;font-weight:400;}
.sug-add{flex:none;min-width:44px;min-height:44px;border:0;border-radius:10px;background:var(--s-accent,var(--accent));color:#fff;font-weight:800;font-size:14px;padding:10px 18px;cursor:pointer;}
.sug-add:active{background:var(--s-accent-deep);}
.stepper{display:flex;align-items:center;gap:10px;flex:none;}
.stepper button{width:44px;height:44px;border-radius:50%;border:1px solid var(--line);background:#fff;font-size:18px;cursor:pointer;line-height:1;color:var(--ink);}
.stepper b{min-width:20px;text-align:center;}
.trow{display:flex;justify-content:space-between;gap:12px;padding:6px 0;font-size:15px;}
.trow.grand{font-weight:800;font-size:18px;border-top:1px solid var(--line);margin-top:8px;padding-top:12px;}
.trow .neg{color:#a33b2e;}
.coupon-row{display:flex;gap:8px;margin:12px 0;}
.coupon-row input{flex:1;border:1px solid var(--line);border-radius:10px;padding:11px 13px;min-width:0;}
/* Available offers: tap-to-apply coupon cards (Zomato/Swiggy "view offers" pattern).
   Coupons were invisible unless the customer already knew a code; this makes
   them discoverable in one tap. Rows are <button>s: 44px targets, logical
   properties so Arabic RTL mirrors. */
.offers{margin:12px 0 4px;}
.offers-t{font-size:12px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;color:var(--muted);margin-bottom:8px;}
.offer{display:flex;align-items:center;gap:10px;width:100%;text-align:start;border:1px dashed var(--s-accent);border-radius:12px;background:#fff;padding:10px 12px;margin-bottom:8px;cursor:pointer;min-height:48px;font:inherit;color:var(--ink);}
.offer-code{font-family:ui-monospace,Menlo,Consolas,monospace;font-weight:800;font-size:13px;background:var(--s-tint,#f5f3ff);border-radius:8px;padding:6px 10px;flex:none;}
.offer-desc{flex:1;font-size:14px;min-width:0;}
.offer-apply{font-size:13px;font-weight:800;color:var(--s-accent);flex:none;text-transform:uppercase;letter-spacing:.04em;}
.fulfill{display:flex;gap:8px;margin:10px 0 4px;}
.fulfill label{flex:1;text-align:center;border:1px solid var(--line);border-radius:12px;padding:11px;cursor:pointer;font-weight:600;font-size:15px;background:#fff;}
.fulfill label.on{border-color:var(--s-accent);box-shadow:inset 0 0 0 1px var(--s-accent);}
.fulfill input{position:absolute;opacity:0;pointer-events:none;}
.d-field{margin:12px 0;}
.d-field label{display:block;font-weight:600;font-size:14px;margin-bottom:6px;}
.d-field input,.d-field textarea,.d-field select{width:100%;border:1px solid var(--line);border-radius:10px;padding:12px 13px;background:#fff;font-size:16px;}
.d-sec{font-weight:700;font-size:16px;margin:22px 0 2px;}
.pay-opt{display:flex;gap:10px;align-items:flex-start;border:1px solid var(--line);border-radius:12px;padding:12px 14px;margin-bottom:8px;cursor:pointer;background:#fff;font-size:15px;}
.pay-opt.on{border-color:var(--s-accent);box-shadow:inset 0 0 0 1px var(--s-accent);}
.pay-opt input{margin-top:5px;flex:none;}
.pay-opt small{display:block;color:var(--ink2);font-weight:400;font-size:13px;}
.d-err{background:#FDF0EF;border:1px solid #E5B8B3;color:#8C2F28;border-radius:10px;padding:12px 14px;margin:12px 0;font-size:14px;}
.d-warn{background:var(--amber-soft);border:1px solid var(--line);border-radius:10px;padding:12px 14px;margin:12px 0;font-size:14px;}
/* ---- cart drawer: empty state (order again + browse) ---- */
.cart-browse{width:100%;background:none;border:1px solid var(--line);border-radius:14px;padding:14px;font-size:16px;font-weight:700;cursor:pointer;margin-top:14px;color:var(--ink);min-height:52px;}
.cart-browse:active{background:var(--line);}
.ro-box{margin:14px 0 2px;}
.ro-go{display:block;width:100%;border:0;border-radius:14px;background:var(--s-accent,var(--accent));color:#fff;cursor:pointer;padding:14px 16px;min-height:52px;text-align:start;}
.ro-go b{display:block;font-size:16px;font-weight:800;}
.ro-go span{display:block;font-size:13px;opacity:.88;margin-top:2px;font-weight:400;}
.ro-go:active{background:var(--s-accent-deep);}
.pay-instr{background:#fff;border:1px solid var(--line);border-radius:12px;padding:18px;margin:6px 0;font-size:15px;}
.pay-instr pre{white-space:pre-wrap;font-family:inherit;background:var(--paper);border-radius:8px;padding:10px 12px;margin-top:8px;font-size:14px;}
@media(max-width:360px){
  .cline{gap:8px;}
  .stepper{gap:6px;}
  .cline .cn b{font-size:14px;}
  .cline .lt{font-size:13px;}
}
.upi-btn{display:inline-block;background:var(--s-accent);color:#fff !important;text-decoration:none;border-radius:999px;padding:12px 26px;font-weight:700;margin-top:10px;}
.wa-big{width:100%;background:#1FA855;border:0;color:#fff;border-radius:14px;padding:16px;font-size:17px;font-weight:800;cursor:pointer;margin-top:14px;}
.wa-big:disabled{opacity:.45;cursor:not-allowed;}
/* ---- builder extras ---- */
.sec-label{font-weight:700;font-size:17px;margin:32px 0 2px;}
.sec-sub{color:var(--ink2);font-size:14px;margin-bottom:12px;}
.hrs-row{display:grid;grid-template-columns:1fr auto auto auto;gap:8px;align-items:center;padding:9px 0;border-bottom:1px dotted var(--line);font-size:15px;}
.hrs-row input[type=time]{border:1px solid var(--line);border-radius:8px;padding:8px 6px;background:#fff;font-size:14px;}
.hrs-row input[type=time]:disabled{opacity:.35;}
.hrs-closed{display:flex;align-items:center;gap:6px;font-size:13.5px;color:var(--ink2);white-space:nowrap;}
.swatch-row{display:flex;gap:12px;flex-wrap:wrap;margin-top:6px;}
.swatch{width:54px;height:54px;border-radius:50%;border:3px solid transparent;cursor:pointer;padding:0;flex:none;}
.swatch.on{border-color:var(--ink);}
.pay-check{display:flex;gap:10px;align-items:flex-start;margin-bottom:14px;font-size:15px;}
.pay-check input{margin-top:5px;flex:none;width:18px;height:18px;}
.pay-check small{display:block;color:var(--ink2);font-weight:400;font-size:13px;}
.pay-detail{margin:-6px 0 16px 28px;}
@media(max-width:760px){
  .hrs-row{grid-template-columns:1fr 1fr;}
  .hrs-day{font-weight:600;}
  .hrs-closed{justify-self:end;}
}
</style>

<script>
"use strict";
/* ============================== utils ============================== */
const $ = s => document.querySelector(s);
const esc = s => String(s == null ? "" : s).replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
function b64urlEncode(str){
  const b64 = btoa(unescape(encodeURIComponent(str)));
  return b64.replace(/\+/g,"-").replace(/\//g,"_").replace(/=+$/,"");
}
function b64urlDecode(s){
  s = s.replace(/-/g,"+").replace(/_/g,"/");
  while(s.length % 4) s += "=";
  return decodeURIComponent(escape(atob(s)));
}
function encodeSite(d){ return b64urlEncode(JSON.stringify({v:1, d})); }
function decodeSite(p){ try{ const o = JSON.parse(b64urlDecode(p)); return (o && o.v===1 && o.d) ? o.d : null; }catch(e){ return null; } }
// NOTE: is.gd is a free third-party URL shortener used as a stopgap.
// If Saylo ever gets its own backend, swap this for first-party short
// links (e.g. ts.shop/xxxx) so we own the domain and the analytics.
function shortenUrl(longUrl){
  return fetch("https://is.gd/create.php?format=simple&url="+encodeURIComponent(longUrl))
    .then(r=>{ if(!r.ok) throw new Error("shorten failed"); return r.text(); })
    .then(s=>{ s=String(s||"").trim(); if(!/^https?:\/\//i.test(s)) throw new Error("bad short url"); return s; });
}
// ---------- merchant dashboard registry (localStorage, per-device) ----------
const SHOPS_KEY = "talkshop_my_shops";
function readShops(){ try{ const a=JSON.parse(localStorage.getItem(SHOPS_KEY)||"[]"); return Array.isArray(a)?a:[]; }catch(e){ return []; } }
function writeShops(a){ try{ localStorage.setItem(SHOPS_KEY, JSON.stringify(a)); }catch(e){} }
function shopLinkOf(payload){ return location.origin + location.pathname + "#/s/" + payload; }
// Server-issued shop IDs: 8 chars from 23456789ABCDEFGHJKLMNPQRSTUVWXYZ (no 0/O, 1/I/L).
// A "#/s/" segment matching this is fetched from /api/shops; anything else is a legacy payload link.
const SHOP_ID_RE = /^[2-9A-HJ-NP-Z]{8}$/;
function shopIdLinkOf(id){ return location.origin + location.pathname + "#/s/" + id; }
function saveShopToRegistry(payload){
  const shops = readShops();
  const name = (state.data && state.data.name) || "";
  const now = Date.now();
  let id = state.editShopId || null;
  let ix = id ? shops.findIndex(s=>s.id===id) : -1;
  if(ix<0) ix = shops.findIndex(s=>s.payload===payload);
  if(ix>=0){ shops[ix].name=name; shops[ix].payload=payload; shops[ix].savedAt=now; id=shops[ix].id; }
  else { id="s"+now.toString(36)+Math.floor(Math.random()*1296).toString(36); shops.unshift({id:id,name:name,savedAt:now,payload:payload}); }
  writeShops(shops);
  state.editShopId = null;
  return id;
}
function setRegistryServerId(regId, serverId){
  const shops = readShops();
  const ix = shops.findIndex(s=>s.id===regId);
  if(ix>=0){ shops[ix].serverId = serverId; writeShops(shops); }
}
// Merchant key for the orders inbox, issued by POST /api/shops. Kept silent
// in the on-device registry; the merchant never needs to see or type it.
function setRegistryKey(regId, key){
  const shops = readShops();
  const ix = shops.findIndex(s=>s.id===regId);
  if(ix>=0){ shops[ix].merchantKey = key; writeShops(shops); }
}
// POST the shop to /api/shops for a short server-side ID. On success the
// share screen's primary link becomes #/s/<id>; on any failure the full
// payload link stays as the share link (it always works).
// Republish sends the existing serverId (and merchantKey when we have one)
// so the record updates in place and the shared link stays stable. A 403/404
// (key lost, e.g. another device claimed it) falls back to minting a brand
// new shop, which is the pre-key behavior.
function issueShopId(payload, regId){
  let done = false;
  const finish = (ok, id)=>{
    if(done) return; done = true;
    if(state.step !== 3) return; // user moved on; the payload link fallback still works
    state.idState = ok ? "ok" : "fail";
    if(ok && id){
      state.shortId = id;
      state.link = shopIdLinkOf(id);
      setRegistryServerId(regId, id);
      const qrc = $("#qrCanvas");
      if(qrc){ qrc.innerHTML = ""; try{ new QRCode(qrc, { text: state.link, width: 220, height: 220, correctLevel: QRCode.CorrectLevel.M }); }catch(e){} }
    }
    const box = $("#idLinkBox");
    if(box){ box.innerHTML = idLinkRowsHtml(); wireIdRows(); }
  };
  const postShop = (withId)=>{
    const entry = readShops().find(s=>s.id===regId);
    const body = { payload: decodeSite(payload) };
    if(withId && entry && entry.serverId){
      body.shopId = entry.serverId;
      if(entry.merchantKey) body.key = entry.merchantKey;
    }
    return fetch("/api/shops", { method:"POST", headers:{ "Content-Type":"application/json" }, body: JSON.stringify(body) })
      .then(async r=>{
        const j = await r.json().catch(()=>null);
        if(r.status===403 || r.status===404){ const e=new Error("republish_denied"); e.denied=true; throw e; }
        if(!r.ok || !j) throw new Error("api");
        return j;
      });
  };
  const handle = (j)=>{
    const id = j && j.id;
    if(typeof id !== "string" || !SHOP_ID_RE.test(id)) throw new Error("bad id");
    if(j.merchantKey) setRegistryKey(regId, j.merchantKey);
    finish(true, id);
  };
  try{
    postShop(true).then(handle).catch(e=>{
      if(e && e.denied) postShop(false).then(handle).catch(()=>finish(false));
      else finish(false);
    });
  }catch(e){ finish(false); }
  setTimeout(()=>finish(false), 15000);
}
function cleanPhone(p){ return String(p||"").replace(/[^\d+]/g,""); }

   location). Deliberately NOT cached in localStorage: VPN/proxy changes take
   effect on a plain reload. In-memory for this page load only. The result is
   only a suggestion, never forced. If the lookup fails, no guess is made and
   the visitor picks manually from the header. ---- */
let _ipcc = null, _ipccDone = false;
async function ipCountry(){
  if(_ipccDone) return _ipcc;
  _ipccDone = true;
  try{
    const ctl = new AbortController();
    const timer = setTimeout(()=>ctl.abort(), 2500);
    const r = await fetch("https://ipapi.co/json/", { signal: ctl.signal });
    clearTimeout(timer);
    const j = await r.json();
    const cc = String((j && j.country_code) || "").toUpperCase();
    if(cc && COUNTRY[cc]){ _ipcc = cc; return cc; }
  }catch(e){}
  return null;
}

/* ============================== parser ============================== */
function parseTranscript(raw){
  const t = String(raw||"").replace(/\s+/g," ").trim();
  const d = {name:"", tagline:"", products:[], hours:"", phone:"", whatsapp:"", address:""};
  if(!t) return d;
  // Sentence capture that does not break on decimal points like $4.50
  const SENT = "((?:[^.!?]|\\.(?=\\d))+)";
  const after = (pat) => { const m = t.match(new RegExp(pat + "\\s*" + SENT, "i")); return m ? m[1].trim() : ""; };
  // name
  let m = t.match(/(?:my|our)\s+(?:shop|store|business|salon|bakery|studio|restaurant|cafe|boutique|pharmacy)\s+(?:is\s+called|is|called)\s+([^.,!?]+)/i)
       || t.match(/(?:shop|store|business)\s+(?:name|called)\s+(?:is\s+)?([^.,!?]+)/i)
       || t.match(/(?:we are|we're|this is)\s+([A-Z][A-Za-z'& ]{1,40}?)(?:\.|,|!|\?|\s+and\s+we|\s+we\s)/);
  if(m) d.name = m[1].trim().replace(/\s+is\s*$/i,"");
  // products
  let prod = after("we sell") || after("(?:we offer|our products are|our menu includes|selling)") || after("(?:speciali[sz]e in|known for)");
  if(prod){
    d.products = prod.split(/,|\s+and\s+/).map(s=>s.trim()).filter(s=>s && s.length<60).slice(0,24)
      .map(item=>{
        const pm = item.match(/^(.*?)\s*(?:for\s*)?(\$\s?[\d.,]+(?:\s?(?:each|a piece))?)\s*$/);
        return pm ? {name:pm[1].trim().replace(/[:\u2013\u2014]\s*$/, ""), price:pm[2].trim()} : {name:item, price:""};
      }).filter(p=>p.name);
  }
  // hours
  let hrs = after("[^.!?]*\\bopen\\b") || after("[^.!?]*(?:opening\\s+)?\\bhours\\b");
  if(hrs) d.hours = hrs.replace(/^(we are|we're|and)\s+/i,"").trim();
  // phone
  m = t.match(/(\+\d[\d\s\-()]{6,}\d)/) || t.match(/\b(\d{3}[\s\-.]?\d{3}[\s\-.]?\d{4})\b/) || t.match(/\b(\d{10})\b/);
  if(m){ d.phone = m[1].trim(); d.whatsapp = m[1].trim(); }
  // address
  d.address = after("(?:located at|find us at|address is|we are at|we're at|visit us at)");
  // tagline: prefer what they make/serve, never the hours sentence
  let tag = after("we\\s+(?:offer|make|bake|serve|provide|speciali[sz]e in)");
  if(!tag){
    const first = t.split(/(?<!\d)\.(?!\d)|!|\?/)[0];
    if(first && first.length > 20 && first.length < 140 && !/my (shop|store)/i.test(first) && !/\bopen\b/i.test(first)) tag = first.trim();
  }
  if(tag && !/\.$/.test(tag)) tag += ".";
  d.tagline = tag || "";
  return d;
}

let _gtLibReady = false, _gtInited = false, _gtNavEl = null, _gtSyncing = false;
function googleTranslateElementInit(){
  _gtLibReady = !!(window.google && google.translate && google.translate.TranslateElement);
  _gtMaybeInitGT();
  mountGT();
}
function _gtMaybeInitGT(){
  // Google only allows one TranslateElement per page; the footer uses a synced mirror select.
  if(_gtInited || !_gtLibReady) return;
  try{
    _gtNavEl = document.createElement("span");
    const ns = document.getElementById("gtSlotNav");
    (ns || document.body).appendChild(_gtNavEl);
    new google.translate.TranslateElement(
      { pageLanguage: "en", autoDisplay: false },
      _gtNavEl);
    _gtInited = true;
  }catch(e){}
}
function _gtSyncFootSel(){
  // Copy the Google widget's language options into the footer mirror select, both ways in sync.
  if(_gtSyncing) return;
  _gtSyncing = true;
  let tries = 0;
  const iv = setInterval(() => {
    try{
      const src = document.querySelector("#gtSlotNav select.goog-te-combo");
      const dst = document.getElementById("gtFootSel");
      if(src && dst && src.options.length > 1 && !dst.options.length){
        clearInterval(iv); _gtSyncing = false;
        for(const o of src.options){
          const c = document.createElement("option");
          c.value = o.value; c.textContent = o.textContent;
          dst.appendChild(c);
        }
        // Google drops its empty "Select Language" option after translating; keep our own revert entry.
        if(dst.options[0].value !== ""){
          const c = document.createElement("option");
          c.value = ""; c.textContent = "Select Language";
          dst.insertBefore(c, dst.options[0]);
        }
        dst.hidden = false;
        dst.addEventListener("change", () => {
          if(dst.value === ""){ _gtRevert(); return; }
          const s2 = document.querySelector("#gtSlotNav select.goog-te-combo");
          if(s2){ s2.value = dst.value; s2.dispatchEvent(new Event("change")); }
        });
        src.addEventListener("change", () => { dst.value = src.value; });
      }
    }catch(e){}
    if(++tries > 40){ clearInterval(iv); _gtSyncing = false; }
  }, 500);
}
function _gtRevert(){
  // Back to English: clear Google's googtrans cookie and reload.
  try{
    document.cookie = "googtrans=;expires=Thu, 01 Jan 1970 00:00:00 GMT;path=/";
    const h = location.hostname;
    document.cookie = "googtrans=;expires=Thu, 01 Jan 1970 00:00:00 GMT;path=/;domain=" + h;
    const parts = h.split(".");
    if(parts.length > 1) document.cookie = "googtrans=;expires=Thu, 01 Jan 1970 00:00:00 GMT;path=/;domain=." + parts.slice(-2).join(".");
  }catch(e){}
  location.reload();
}

  if(has(["mobile","phone","laptop","computer","electronic","gadget","repair"])) return "ocean";
  if(has(["grocery","mart","fresh","vegetable","fruit","farm","kirana","supermarket"])) return "forest";

}

function dayName(dd){
  // dd: 0=Sunday .. 6=Saturday. 2026-09-27 is a Sunday.
  try{ return new Intl.DateTimeFormat("en",{weekday:"long"}).format(new Date(2026,8,27+dd)); }
  catch(e){ return ["Sunday","Monday","Tuesday","Wednesday","Thursday","Friday","Saturday"][dd]; }
}
function fmtTime(hm){
  const m=String(hm||"").match(/(\d{1,2}):(\d{2})/);
  if(!m) return String(hm||"");
  try{ return new Intl.DateTimeFormat("en",{hour:"numeric",minute:"2-digit"}).format(new Date(2026,0,1,+m[1],+m[2])); }
  catch(e){ return hm; }
}
function parseHM(s){
  const m=String(s||"").match(/(\d{1,2}):(\d{2})/);
  return m ? (+m[1])*60 + (+m[2]) : null;
}

function curSymbol(code){
  try{
    const ps=new Intl.NumberFormat("en",{style:"currency",currency:code}).formatToParts(0);
    for(const p of ps){ if(p.type==="currency"&&p.value) return p.value; }
  }catch(e){}
  return code;
}
function normPrice(s){
  let t=String(s==null?"":s);
  if(/[-–]/.test(t)) return null;
  t=t.replace(/[$€£₹¥,\s]/g,"");
  const v=parseNum(t);
  return (v==null||v<=0)?null:String(Math.round(v*100)/100);
}

function parseMenuImport(txt){
  const out=[]; let curCat="";
  String(txt||"").split("\n").forEach(raw=>{
    const line=raw.trim();
    if(!line) return;
    const hm=line.match(/^#\s*(.+)$/);
    if(hm){ curCat=hm[1].trim(); return; }
    const ps=parseProductsText(line);
    if(!ps.length) return;
    const p=ps[0];
    if(!p.cat&&curCat) p.cat=curCat;
    const np=normPrice(p.price); p.price=np==null?"":np;
    (p.variants||[]).forEach(v=>{ const nvp=normPrice(v.p); v.p=nvp==null?"":nvp; });
    out.push(p);
  });
  return out.slice(0,50);
}

function parseProductsText(txt){
  return String(txt||"").split("\n").map(l=>l.trim()).filter(Boolean).slice(0,30).map(line=>{
    let s=line, stock=null, cat=null, variants=null, m;
    // stock marker: trailing !low or !out
    m=s.match(/\s*!(low|out)\s*$/i);
    if(m){ stock=m[1].toLowerCase(); s=s.slice(0,m.index).trim(); }
    // variant block: trailing {Name: price, Name2: price2}
    m=s.match(/\s*\{([^}]*)\}\s*$/);
    if(m){
      variants=m[1].split(",").map(v=>v.trim()).filter(Boolean).map(v=>{
        const vm=v.match(/^(.*?)\s*:\s*(.+)$/);
        return vm ? {n:vm[1].trim(), p:vm[2].trim()} : {n:v, p:""};
      }).filter(v=>v.n).slice(0,8);
      s=s.slice(0,m.index).trim();
    }
    // category tag: trailing #Word
    m=s.match(/\s*#([^\s#{}!]+)\s*$/);
    if(m){ cat=m[1].trim(); s=s.slice(0,m.index).trim(); }
    // relaxed: "Cake - $4.50", "Cake: $28" (colon without spaces), but not "9:30"
    const pm = s.match(/^(.*?)\s+[-–:]\s+(.+)$/) || s.match(/^(.*\D)[-–:]\s*(.+)$/);
    let name=s, price="";
    if(pm && /^[$€£₹\d]/.test(pm[2].trim())){ name=pm[1].trim(); price=pm[2].trim(); }
    // bare price: "Coffee $3", "Samosa 15", "Cake 4.50" (name, space, number at end)
    if(!price){
      const pm3=s.match(/^(.*?)\s+([$€£₹]?\s*\d[\d,]*(?:\.\d+)?)\s*$/);
      if(pm3 && pm3[1].trim().length>=2){ name=pm3[1].trim(); price=pm3[2].trim(); }
    }
    const p={name:name, price:price};
    if(cat) p.cat=cat;
    if(stock) p.stock=stock;
    if(variants && variants.length) p.variants=variants;
    return p;
  }).filter(p=>p.name);
}
function parseNum(s){
  let t=String(s==null?"":s).trim().replace(/\s/g,"");
  if(t.indexOf(",")>=0 && t.indexOf(".")<0) t=t.replace(",",".");
  t=t.replace(/[^0-9.]/g,"");
  const v=parseFloat(t);
  return isNaN(v)?null:v;
}
function parseCoupons(txt){
  return String(txt||"").split("\n").map(l=>l.trim()).filter(Boolean).slice(0,10).map(line=>{
    const m=line.match(/^(.*?)\s*=\s*(.+)$/);
    if(!m) return null;
    const code=m[1].trim().toUpperCase().replace(/\s+/g,"");
    const rhs=m[2].trim();
    const pm=rhs.match(/([\d.]+)\s*%/);
    if(pm && parseFloat(pm[1])>0) return {code:code, type:"pct", val:parseFloat(pm[1])};
    const fm=rhs.match(/([\d.]+)/);
    if(fm && parseFloat(fm[1])>0) return {code:code, type:"flat", val:parseFloat(fm[1])};
    return null;
  }).filter(c=>c && c.code);
}
function couponsToText(cs){
  return (cs||[]).map(c=>c.code+" = "+(c.type==="pct"?c.val+"%":c.val)).join("\n");
}
function collectForm(){
  const d = state.data; if(!d) return;
  d.name = $("#f_name").value.trim();
  d.tagline = $("#f_tagline").value.trim();
  d.announce = $("#f_announce").value.trim();
  d.phone = $("#f_phone").value.trim();
  d.whatsapp = $("#f_whatsapp").value.trim();
  d.address = $("#f_address").value.trim();
  // products live in d.products (edited via field rows); theme stays untouched
  // structured hours: array indexed by getDay() (0=Sunday), null = closed
  const hrsArr=[null,null,null,null,null,null,null];
  document.querySelectorAll("[data-hrs-closed]").forEach(cb=>{
    const dd=+cb.getAttribute("data-hrs-closed");
    if(!cb.checked){
      const oEl=document.querySelector('[data-hrs-open="'+dd+'"]');
      const cEl=document.querySelector('[data-hrs-close="'+dd+'"]');
      let o=oEl?oEl.value.slice(0,5):"09:00", c=cEl?cEl.value.slice(0,5):"21:00";
      if(!/^\d{2}:\d{2}$/.test(o)) o="09:00";
      if(!/^\d{2}:\d{2}$/.test(c)) c="21:00";
      hrsArr[dd]={o:o, c:c};
    }
  });
  d.hrs=hrsArr;
  d.hrsNote=$("#f_hours_note").value.trim();
  // delivery config
  const fee=parseNum($("#f_dlv_fee").value), freeAbove=parseNum($("#f_dlv_free").value), min=parseNum($("#f_dlv_min").value);
  d.dlv=(fee!=null||freeAbove!=null||min!=null)?{fee:fee||0, freeAbove:freeAbove, min:min}:null;
  // slots, coupons
  d.slots=$("#f_slots").value.split("\n").map(s=>s.trim()).filter(Boolean).slice(0,12);
  d.coupons=parseCoupons($("#f_coupons").value);
  // payment methods
  const pay={};
  if(!$("#pay_card").checked) pay.card=false;
  const po=$("#pay_payout").value.trim(); if(po) pay.payout=po;
  if($("#pay_cod").checked) pay.cod=true;
  const upi=$("#pay_upi").value.trim(); if(upi && $("#pay_upi_on").checked) pay.upi=upi;
  const bank=$("#pay_bank").value.trim(); if(bank && $("#pay_bank_on").checked) pay.bank=bank;
  const pp=$("#pay_paypal").value.trim(); if(pp && $("#pay_paypal_on").checked) pay.paypal=pp;
  if($("#pay_store").checked) pay.store=true;
  const cust=$("#pay_custom").value.trim(); if(cust) pay.custom=cust;
  d.pay=pay;
  // theme: keep any saved custom theme; new shops default to forest
  if(!d.theme || !THEMES[d.theme]) d.theme = "forest";
}
