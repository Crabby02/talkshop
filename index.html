<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>TalkShop: Describe your shop. Get it online.</title>
<meta name="description" content="TalkShop turns a few lines about your shop into a mobile storefront you can share anywhere. Free, no account needed.">
<meta property="og:title" content="TalkShop: Describe your shop. Get it online.">
<meta property="og:description" content="Free mobile storefronts for small shops. Describe your shop, share the link anywhere. No account, no cost.">
<meta property="og:type" content="website">
<meta name="theme-color" content="#175E3B">
<meta property="og:image" content="https://crabby02.github.io/talkshop/assets/shop-bakery.jpg">
<style>
:root{
  --paper:#FAFAF6; --paper2:#F3F1EA; --ink:#1B1B18; --ink2:#55534B;
  --line:#E3E0D4; --accent:#175E3B; --accent-deep:#0C3D27; --accent-ink:#fff;
  --amber:#F2B33D; --amber-soft:#FCF3DC; --wa:#1FA855;
  --shadow-lg:0 30px 60px -20px rgba(27,27,24,.28);
  --shadow-md:0 16px 34px -14px rgba(27,27,24,.22);
  --shadow-sm:0 8px 20px -8px rgba(27,27,24,.18);
  --r:20px;
}
*{box-sizing:border-box; margin:0; padding:0;}
html{scroll-behavior:smooth;}
body{background:var(--paper); color:var(--ink);
  font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
  font-size:17px; line-height:1.6; -webkit-font-smoothing:antialiased;}
::selection{background:var(--accent); color:#fff;}
.serif{font-family:"Iowan Old Style",Palatino,"Palatino Linotype",Georgia,"Times New Roman",serif;}
.mono{font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;}
.wrap{max-width:1180px; margin:0 auto; padding:0 24px;}
a{color:inherit;}
img{display:block; max-width:100%;}
/* masthead */
.mast{border-bottom:1px solid var(--line); background:var(--paper); position:sticky; top:0; z-index:50;}
.mast-in{display:flex; align-items:center; justify-content:space-between; height:66px;}
.wordmark{font-family:"Iowan Old Style",Palatino,Georgia,serif; font-weight:700; font-size:23px; letter-spacing:-0.5px; text-decoration:none;}
.wordmark span{color:var(--accent);}
.mast nav{display:flex; gap:28px; align-items:center;}
.mast nav a.nl{text-decoration:none; font-size:15px; color:var(--ink2);}
.mast nav a.nl:hover{color:var(--ink);}
.btn{display:inline-block; text-decoration:none; border:1px solid var(--ink); border-radius:999px;
  padding:12px 26px; font-size:16px; font-weight:600; cursor:pointer; background:transparent; color:var(--ink);
  transition:transform .12s ease, background .12s ease, box-shadow .12s ease;}
.btn:hover{transform:translateY(-1px); box-shadow:var(--shadow-sm);}
.btn-solid{background:var(--ink); color:var(--paper);}
.btn-solid:hover{background:#000;}
.btn-accent{background:var(--accent); border-color:var(--accent); color:#fff;}
.btn-accent:hover{background:var(--accent-deep);}
.btn-sm{padding:8px 18px; font-size:14px;}
.btn-lg{padding:16px 34px; font-size:18px;}
/* ============ hero ============ */
.hero2{position:relative; overflow:hidden; border-bottom:1px solid var(--line);
  background:
    radial-gradient(900px 480px at 88% -8%, #F8EAC9 0%, rgba(248,234,201,0) 60%),
    radial-gradient(760px 520px at -12% 24%, #E2EBDA 0%, rgba(226,235,218,0) 55%),
    var(--paper);}
.hero2-in{display:grid; grid-template-columns:1.02fr .98fr; gap:40px; align-items:center; padding:88px 0 100px;}
.eyebrow{overflow-wrap:break-word; font-family:ui-monospace,Menlo,monospace; font-size:13px; letter-spacing:2.5px; color:var(--accent); margin-bottom:22px; font-weight:700;}
h1,h2,h3{overflow-wrap:break-word;}
html[lang|="ml"] .hero2 h1,html[lang|="hi"] .hero2 h1,html[lang|="ta"] .hero2 h1{font-size:clamp(40px,5.8vw,76px);}
.hero-copy{min-width:0;}
.hero2 h1{overflow-wrap:break-word; font-family:"Iowan Old Style",Palatino,Georgia,serif; font-size:clamp(46px,6.2vw,82px);
  line-height:1.02; letter-spacing:-2px; margin-bottom:24px; font-weight:700;}
.hero2 h1 em{font-style:italic; color:var(--accent);}
.hero2 p.sub{font-size:20px; color:var(--ink2); max-width:31em; margin-bottom:34px;}
.cta-row{display:flex; gap:14px; flex-wrap:wrap; margin-bottom:28px;}
.meta-row{font-family:ui-monospace,Menlo,monospace; font-size:13px; color:var(--ink2); letter-spacing:.5px;}
.meta-row b{color:var(--ink);}
/* layered hero visual */
.hero-visual{position:relative; min-height:620px;}
.hv-photo{position:absolute; right:0; top:10px; width:76%; height:470px; object-fit:cover;
  border-radius:28px; transform:rotate(2.5deg); box-shadow:var(--shadow-lg); border:7px solid #fff;}
.hv-glow{position:absolute; left:6%; top:34%; width:280px; height:280px; border-radius:50%;
  background:radial-gradient(circle, rgba(242,179,61,.35), rgba(242,179,61,0) 70%); filter:blur(6px);}
.phone{position:absolute; left:2%; top:52px; width:288px; background:#fff; border-radius:40px;
  border:1px solid var(--line); box-shadow:var(--shadow-lg); overflow:hidden; transform:rotate(-3deg); z-index:3;}
.phone-notch{height:26px; display:flex; justify-content:center; align-items:center; background:#fff;}
.phone-notch i{width:96px; height:20px; background:var(--ink); border-radius:999px; display:block;}
.mini-shop{padding:6px 18px 22px;}
.mini-kicker{font-family:ui-monospace,Menlo,monospace; font-size:9px; letter-spacing:2.5px; color:var(--accent); text-align:center; margin:8px 0 6px; font-weight:700;}
.mini-shop h4{font-family:"Iowan Old Style",Palatino,Georgia,serif; font-size:24px; text-align:center; letter-spacing:-.5px; margin-bottom:4px;}
.mini-shop .tag{font-size:11.5px; color:var(--ink2); text-align:center; margin-bottom:12px; line-height:1.45;}
.mini-prod{display:flex; justify-content:space-between; align-items:center; gap:8px; padding:9px 0; border-bottom:1px dotted var(--line); font-size:13.5px;}
.mini-prod:last-of-type{border-bottom:none;}
.mini-prod .mp{font-family:ui-monospace,Menlo,monospace; font-size:12px;}
.mini-order{font-size:10.5px; font-weight:700; background:var(--accent); color:#fff; border-radius:999px; padding:4px 11px;}
.mini-foot{display:flex; gap:8px; margin-top:14px;}
.mini-foot span{flex:1; text-align:center; font-size:11px; font-weight:700; border-radius:999px; padding:8px 0;}
.mini-foot .a{background:var(--accent); color:#fff;}
.mini-foot .b{border:1px solid var(--line);}
.float{position:absolute; background:#fff; border:1px solid var(--line); border-radius:16px; box-shadow:var(--shadow-md); padding:14px 16px; z-index:4;}
.fc-sale{top:0; right:6%; background:var(--ink); color:#fff; border:none; border-radius:999px;
  font-size:13.5px; font-weight:700; padding:11px 20px; transform:rotate(2deg); box-shadow:var(--shadow-md);}
.fc-sale i{font-style:normal; background:var(--amber); color:var(--ink); border-radius:999px; padding:2px 9px; margin-right:8px; font-size:12px;}
.fc-wa{left:0; bottom:56px; max-width:258px; transform:rotate(-2deg);}
.wa-head{display:flex; gap:9px; align-items:center; margin-bottom:10px; font-weight:700; font-size:13.5px;}
.wa-dot{width:30px; height:30px; border-radius:50%; background:var(--wa); color:#fff; display:flex; align-items:center; justify-content:center; font-size:15px; flex:none;}
.wa-head small{display:block; font-weight:400; color:var(--wa); font-size:11px;}
.bubble{background:#E9F8EA; border-radius:4px 14px 14px 14px; padding:10px 12px; font-size:13.5px; line-height:1.45;}
.bubble .tick{color:var(--wa); font-size:11px; display:block; text-align:right; margin-top:4px;}
.fc-qr{right:2%; bottom:8px; text-align:center; transform:rotate(2deg); padding:14px 16px 12px;}
.fc-qr .cap{font-size:12px; color:var(--ink2); margin-top:8px; font-weight:600;}
#heroQr img, #heroQr canvas{border-radius:8px;}
/* ============ photo marquee ============ */
.marquee{border-bottom:1px solid var(--line); background:var(--paper); overflow:hidden; padding:30px 0 34px;}
.mq-label{text-align:center; font-family:ui-monospace,Menlo,monospace; font-size:12px; letter-spacing:2.5px; color:var(--ink2); margin-bottom:20px;}
.mq-view{overflow:hidden; -webkit-mask-image:linear-gradient(90deg, transparent, #000 6%, #000 94%, transparent); mask-image:linear-gradient(90deg, transparent, #000 6%, #000 94%, transparent);}
.mq-track{display:flex; gap:18px; width:max-content; animation:mq 42s linear infinite;}
.mq-track:hover{animation-play-state:paused;}
@keyframes mq{to{transform:translateX(-50%);}}
.mq-card{width:252px; flex:none; background:#fff; border:1px solid var(--line); border-radius:16px; overflow:hidden; box-shadow:var(--shadow-sm);}
.mq-card img{width:100%; height:148px; object-fit:cover;}
.mq-card .t{font-weight:700; font-size:15px; padding:12px 16px 2px;}
.mq-card .s{color:var(--ink2); font-size:13px; padding:0 16px 14px;}
/* ============ sections ============ */
.sec{padding:88px 0; border-bottom:1px solid var(--line);}
.sec h2{font-family:"Iowan Old Style",Palatino,Georgia,serif; font-size:clamp(30px,4.2vw,44px); letter-spacing:-1px; margin-bottom:14px;}
.sec p.lead{color:var(--ink2); font-size:19px; max-width:38em; margin-bottom:48px;}
.sec-head{margin-bottom:8px;}
/* how it works rows */
.how-row{display:grid; grid-template-columns:1fr 1fr; gap:60px; align-items:center; padding:52px 0; border-bottom:1px solid var(--line);}
.how-row:last-child{border-bottom:none;}
.how-row.flip .how-copy{order:2;}
.how-num{font-family:ui-monospace,Menlo,monospace; font-size:13px; color:var(--accent); letter-spacing:2.5px; margin-bottom:14px; font-weight:700;}
.how-copy h3{font-family:"Iowan Old Style",Palatino,Georgia,serif; font-size:clamp(24px,3vw,32px); letter-spacing:-.6px; margin-bottom:12px;}
.how-copy p{color:var(--ink2); font-size:18px; max-width:26em;}
.how-vis{background:#fff; border:1px solid var(--line); border-radius:24px; padding:30px; box-shadow:var(--shadow-md); position:relative; overflow:hidden;}
.how-vis .tag{font-family:ui-monospace,Menlo,monospace; font-size:11px; letter-spacing:2px; color:var(--ink2); margin-bottom:16px;}
.mock-type{background:var(--paper); border:1px solid var(--line); border-radius:12px; padding:16px; font-size:15px; color:var(--ink2); line-height:1.6; margin-bottom:16px;}
.mock-mic{display:inline-flex; align-items:center; gap:10px; border:1.5px solid var(--accent); color:var(--accent); font-weight:700; border-radius:999px; padding:10px 20px; font-size:14px;}
.mock-site{border:1px solid var(--line); border-radius:14px; overflow:hidden;}
.mock-banner{background:var(--accent); color:#fff; text-align:center; font-size:13px; font-weight:700; padding:9px;}
.mock-site .ms-body{padding:16px 18px;}
.mock-site .ms-body h5{font-family:"Iowan Old Style",Palatino,Georgia,serif; font-size:20px; margin-bottom:8px;}
.mock-site .ms-prod{display:flex; justify-content:space-between; font-size:14px; padding:8px 0; border-bottom:1px dotted var(--line);}
.mock-qr-row{display:flex; gap:16px; align-items:center;}
.mock-qr-row .qr-ph{width:110px; height:110px; border-radius:12px; border:1px solid var(--line);
  background:repeating-conic-gradient(#1B1B18 0 25%, #fff 0 50%) 0 0/22px 22px; flex:none;}
.mock-share-btns{display:flex; flex-direction:column; gap:10px; flex:1;}
.mock-share-btns span{border:1px solid var(--ink); border-radius:999px; text-align:center; font-size:13.5px; font-weight:600; padding:10px;}
.mock-share-btns span.solid{background:var(--ink); color:#fff;}
/* bento */
.bento{display:grid; grid-template-columns:repeat(3,1fr); gap:18px;}
.b-card{background:#fff; border:1px solid var(--line); border-radius:var(--r); padding:32px; position:relative; overflow:hidden; display:flex; flex-direction:column;}
.b-card.span2{grid-column:span 2;}
.b-card.dark{background:var(--accent-deep); border-color:var(--accent-deep); color:#fff;}
.b-card .k{font-family:ui-monospace,Menlo,monospace; font-size:12px; letter-spacing:2px; color:var(--accent); margin-bottom:12px; font-weight:700;}
.b-card.dark .k{color:var(--amber);}
.b-card h3{font-family:"Iowan Old Style",Palatino,Georgia,serif; font-size:25px; letter-spacing:-.5px; margin-bottom:10px;}
.b-card p{color:var(--ink2); font-size:16px; max-width:30em;}
.b-card.dark p{color:#CBDDD1;}
.b-visual{margin-top:24px;}
.chat-mock{max-width:340px;}
.chat-mock .bubble{font-size:14.5px; margin-bottom:8px; color:var(--ink);}
.chat-mock .bubble.out{background:var(--accent); color:#fff; border-radius:14px 14px 4px 14px; margin-left:36px;}
.chat-mock .bubble.out .tick{color:#fff;}
.qr-mock{display:flex; gap:18px; align-items:center;}
#bentoQr img, #bentoQr canvas{border:1px solid var(--line); border-radius:12px; padding:8px; background:#fff;}
.qr-mock .t{font-size:14px; color:var(--ink2);}
.banner-mock{background:var(--accent); color:#fff; border-radius:12px; padding:16px 18px; font-weight:700; text-align:center; box-shadow:var(--shadow-sm);}
.banner-mock small{display:block; font-weight:400; opacity:.85; font-size:13px; margin-top:4px;}
.edit-mock{display:grid; grid-template-columns:1fr 1fr; gap:12px;}
.edit-mock .em{background:var(--paper); border:1px solid var(--line); border-radius:12px; padding:14px; font-size:13.5px;}
.edit-mock .em .ek{font-family:ui-monospace,Menlo,monospace; font-size:10.5px; letter-spacing:1.5px; color:var(--ink2); margin-bottom:6px;}
.edit-mock .em.new{border-color:var(--accent); background:#EFF6F0;}
/* shop photo grid */
.shopgrid{display:grid; grid-template-columns:repeat(3,1fr); gap:18px;}
.shopcard{background:#fff; border:1px solid var(--line); border-radius:var(--r); overflow:hidden; transition:transform .15s ease, box-shadow .15s ease;}
.shopcard:hover{transform:translateY(-4px); box-shadow:var(--shadow-md);}
.shopcard img{width:100%; height:210px; object-fit:cover;}
.shopcard .b{padding:22px 24px 26px;}
.shopcard .k{font-family:ui-monospace,Menlo,monospace; font-size:12px; letter-spacing:2px; color:var(--accent); font-weight:700; margin-bottom:8px;}
.shopcard p{font-size:16px; color:var(--ink2);}
/* stats band */
.stats{background:var(--accent-deep); color:#fff; border-radius:28px; padding:60px 56px; display:grid; grid-template-columns:repeat(4,1fr); gap:32px; position:relative; overflow:hidden;}
.stats::before{content:""; position:absolute; width:520px; height:520px; border-radius:50%;
  background:radial-gradient(circle, rgba(242,179,61,.16), rgba(242,179,61,0) 70%); right:-140px; top:-160px;}
.stat{position:relative;}
.stat .n{font-family:"Iowan Old Style",Palatino,Georgia,serif; font-size:clamp(36px,4vw,54px); letter-spacing:-1px; margin-bottom:6px;}
.stat .n em{font-style:normal; color:var(--amber);}
.stat .l{color:#BFD3C6; font-size:15px;}
/* cta panel */
.cta-panel{position:relative; border-radius:28px; overflow:hidden; padding:110px 32px; text-align:center; color:#fff;
  background:linear-gradient(rgba(12,61,39,.84), rgba(12,61,39,.9)), url('assets/shop-bakery.jpg') center/cover;}
.cta-panel h2{font-family:"Iowan Old Style",Palatino,Georgia,serif; font-size:clamp(34px,5vw,58px); letter-spacing:-1.5px; margin-bottom:16px; max-width:18ch; margin-left:auto; margin-right:auto;}
.cta-panel p{color:#DCE8DF; font-size:19px; max-width:32em; margin:0 auto 34px;}
.cta-panel .btn-accent{background:#fff; border-color:#fff; color:var(--accent-deep);}
.cta-panel .btn-accent:hover{background:var(--amber-soft);}
/* faq */
.faq{max-width:780px;}
.faq details{border:1px solid var(--line); border-radius:12px; background:#fff; margin-bottom:12px; padding:0; transition:box-shadow .15s ease;}
.faq details:hover{box-shadow:var(--shadow-sm);}
.faq summary{cursor:pointer; padding:20px 24px; font-weight:600; font-size:17px; list-style:none;}
.faq summary::-webkit-details-marker{display:none;}
.faq summary::after{content:"+"; float:right; color:var(--accent); font-weight:400; font-size:22px; line-height:1;}
.faq details[open] summary::after{content:"–";}
.faq .a{padding:0 24px 22px; color:var(--ink2);}
/* footer */
footer{padding:56px 0 60px;}
.foot{display:grid; grid-template-columns:1.4fr 1fr 1fr; gap:32px; color:var(--ink2); font-size:15px;}
.foot h5{font-family:ui-monospace,Menlo,monospace; font-size:12px; letter-spacing:2px; color:var(--ink); margin-bottom:14px;}
.foot a{display:block; text-decoration:none; margin-bottom:10px;}
.foot a:hover{color:var(--ink);}
.foot .brand{font-family:"Iowan Old Style",Palatino,Georgia,serif; font-weight:700; font-size:22px; color:var(--ink); margin-bottom:10px; display:block;}
.foot .brand span{color:var(--accent);}
.foot-bottom{margin-top:44px; padding-top:24px; border-top:1px solid var(--line); display:flex; justify-content:space-between; flex-wrap:wrap; gap:12px; font-size:13.5px; color:var(--ink2);}
/* ---------- builder ---------- */
.builder-head{padding:56px 0 8px;}
.builder-head h1{font-family:"Iowan Old Style",Palatino,Georgia,serif; font-size:clamp(30px,4.5vw,44px); letter-spacing:-1px; margin-bottom:10px;}
.builder-head p{color:var(--ink2); font-size:18px; max-width:34em;}
.stages{display:flex; gap:8px; margin:30px 0 10px;}
.stage{flex:1; font-family:ui-monospace,Menlo,monospace; font-size:12px; letter-spacing:1.5px; color:var(--ink2);
  border-top:2px solid var(--line); padding-top:10px;}
.stage.on{color:var(--ink); border-top-color:var(--accent); font-weight:700;}
.card{background:#fff; border:1px solid var(--line); border-radius:16px; padding:40px; margin:26px 0 70px;}
.mic-btn{width:120px; height:120px; border-radius:50%; border:2px solid var(--accent); background:#fff;
  cursor:pointer; display:inline-flex; align-items:center; justify-content:center; margin-bottom:18px;
  transition:transform .15s ease, background .15s ease;}
.mic-btn:hover{transform:scale(1.04);}
.mic-btn.live{background:var(--accent); animation:pulse 1.6s infinite;}
.mic-btn svg{width:44px; height:44px; stroke:var(--accent); fill:none; stroke-width:2;}
.mic-btn.live svg{stroke:#fff;}
@keyframes pulse{0%{box-shadow:0 0 0 0 rgba(23,94,59,.35);}70%{box-shadow:0 0 0 22px rgba(23,94,59,0);}100%{box-shadow:0 0 0 0 rgba(23,94,59,0);}}
.mic-label{font-weight:600; font-size:18px; margin-bottom:6px;}
.lang-row{display:flex; gap:10px; justify-content:center; align-items:center; margin-bottom:8px; font-size:14px; color:var(--ink2);}
select,input[type=text],input[type=tel],textarea{font:inherit; color:var(--ink);}
select{border:1px solid var(--line); border-radius:8px; padding:8px 12px; background:#fff;}
.or-type{text-align:center; margin:14px 0; color:var(--ink2); font-size:14px;}
textarea.typebox{width:100%; border:1px solid var(--line); border-radius:12px; padding:16px; min-height:110px; background:#fff;}
.field{margin-bottom:20px;}
.field label{display:block; font-weight:600; font-size:15px; margin-bottom:8px;}
.field .hint{font-weight:400; color:var(--ink2); font-size:14px;}
.field input,.field textarea{width:100%; border:1px solid var(--line); border-radius:10px; padding:13px 15px; background:#fff;}
.field textarea{min-height:96px; resize:vertical;}
.field input:focus,.field textarea:focus{outline:2px solid var(--accent); outline-offset:-1px; border-color:var(--accent);}
.grid2{display:grid; grid-template-columns:1fr 1fr; gap:20px;}
.share-panel{text-align:center; padding:20px 0 6px;}
.share-link{display:flex; gap:10px; margin:22px 0;}
.share-link input{flex:1; border:1px solid var(--line); border-radius:10px; padding:13px 15px; background:var(--paper); font-size:14px;}
.share-btns{display:flex; gap:12px; justify-content:center; flex-wrap:wrap; margin-bottom:26px;}
.note{font-size:14px; color:var(--ink2); max-width:34em; margin:0 auto;}
/* ---------- published shop ---------- */
.shop-mast{text-align:center; padding:70px 0 34px; border-bottom:1px solid var(--line);}
.shop-mast .kicker{font-family:ui-monospace,Menlo,monospace; font-size:12px; letter-spacing:3px; color:var(--accent); margin-bottom:14px;}
.shop-mast h1{font-family:"Iowan Old Style",Palatino,Georgia,serif; font-size:clamp(36px,6vw,58px); letter-spacing:-1.2px; margin-bottom:12px;}
.shop-mast p{color:var(--ink2); font-size:19px; max-width:32em; margin:0 auto;}
.shop-sec{padding:44px 0; border-bottom:1px solid var(--line);}
.shop-sec h2{font-family:"Iowan Old Style",Palatino,Georgia,serif; font-size:26px; letter-spacing:-0.5px; margin-bottom:6px;}
.shop-sec .sub{color:var(--ink2); font-size:15px; margin-bottom:22px;}
.prod{display:flex; justify-content:space-between; align-items:baseline; gap:16px; padding:14px 0; border-bottom:1px dotted var(--line);}
.prod:last-child{border-bottom:none;}
.prod .pn{font-size:17px;}
.prod .pp{font-family:ui-monospace,Menlo,monospace; font-size:15px; white-space:nowrap;}
.hours-row{display:flex; justify-content:space-between; padding:10px 0; border-bottom:1px dotted var(--line); font-size:16px;}
.contact-btns{display:flex; gap:12px; flex-wrap:wrap; margin-top:6px;}
.shop-foot{text-align:center; padding:34px 0 60px; color:var(--ink2); font-size:14px;}
.shop-foot a{color:var(--accent);}
.update-link{font-size:13px; color:var(--ink2) !important; text-decoration:underline;}
.banner{background:var(--accent); color:#fff; text-align:center; padding:13px 20px; font-weight:600; font-size:16px;}
.prod-right{display:flex; align-items:center; gap:12px;}
.order-btn{font-size:13px; font-weight:700; background:var(--accent); color:#fff !important; border-radius:999px; padding:7px 16px; text-decoration:none; white-space:nowrap;}
.mic-row{display:flex; gap:18px; align-items:center; background:var(--paper); border:1px solid var(--line); border-radius:12px; padding:16px 20px; margin:18px 0;}
.mic-row .mic-btn{width:64px; height:64px; margin:0; flex:none;}
.mic-row .mic-btn svg{width:26px; height:26px;}
.mic-row .mic-label{font-weight:600; font-size:16px; margin-bottom:4px;}
.mic-row .lang-row{justify-content:flex-start; margin:0;}
.type-first .field textarea{min-height:150px;}
#qrCanvas canvas, #qrCanvas img{border:1px solid var(--line); border-radius:12px; padding:10px; background:#fff;}
/* misc */
.hidden{display:none !important;}
.center{text-align:center;}
.err{background:#FDF0EF; border:1px solid #E5B8B3; color:#8C2F28; border-radius:10px; padding:14px 18px; margin:16px 0; font-size:15px;}
/* responsive */
@media(max-width:1020px){
  .hero2-in{grid-template-columns:1fr; padding:64px 0 80px; gap:56px;}
  .hero-visual{min-height:560px; max-width:560px;}
  .bento{grid-template-columns:1fr 1fr;}
  .b-card.span2{grid-column:span 2;}
  .shopgrid{grid-template-columns:1fr 1fr;}
  .stats{grid-template-columns:1fr 1fr; padding:48px 40px;}
}
@media(max-width:1024px){
  .mast nav a.nl{display:none;}
  .mast nav{gap:14px;}
}
@media(max-width:760px){
  .mast-in{flex-wrap:wrap; height:auto; padding:10px 0; gap:8px;}
  .mast nav{display:contents;}
  .mast nav a.btn{order:2; margin-left:auto;}
  .mast nav select.langsel{order:3; flex:1 1 120px; min-width:0; margin-left:0;}
  .grid2{grid-template-columns:1fr;}
  .card{padding:26px 20px;}
  .share-link{flex-direction:column;}
  .hero2-in{padding:52px 0 64px;}
  .hero-visual{min-height:520px;}
  .hv-photo{width:88%; height:380px;}
  .phone{width:250px; top:80px;}
  .fc-wa{left:4px; bottom:112px; max-width:192px; transform:rotate(-2deg);}
  .fc-qr{right:4px; bottom:8px; transform:rotate(2deg);}
  .how-row{grid-template-columns:1fr; gap:28px; padding:40px 0;}
  .how-row.flip .how-copy{order:0;}
  .bento{grid-template-columns:1fr;}
  .b-card.span2{grid-column:span 1;}
  .shopgrid{grid-template-columns:1fr;}
  .stats{grid-template-columns:1fr; padding:40px 32px; gap:28px;}
  .foot{grid-template-columns:1fr;}
  .cta-panel{padding:72px 24px;}
  .sec{padding:64px 0;}
}
/* ============ fluid wide-screen layout: fill 16:9 and ultrawide ============ */
@media(min-width:1440px){
  .wrap{max-width:1420px; padding:0 40px;}
  .hero2-in{gap:64px; padding:110px 0 120px;}
  .hero2 h1{font-size:clamp(56px,5.6vw,104px);}
  .hero-visual{min-height:680px;}
  .hv-photo{height:560px;}
  .shopgrid{gap:28px;}
  .bento{gap:24px;}
  .stats{padding:72px 80px;}
  .sec{padding:110px 0;}
}
@media(min-width:1800px){
  .wrap{max-width:1660px;}
  .hero2-in{grid-template-columns:1fr 1.12fr; gap:80px; padding:130px 0 140px;}
  .hero2 h1{font-size:clamp(64px,5.2vw,118px);}
  .hero-visual{min-height:740px;}
  .hv-photo{height:620px; width:78%;}
  .phone{width:340px;}
  .fc-wa{width:300px;}
  .stats{padding:80px 96px;}
}
@media(min-width:2200px){
  .wrap{max-width:1920px; padding:0 56px;}
}
@media(prefers-reduced-motion:reduce){
  .mq-track{animation:none;}
  html{scroll-behavior:auto;}
}

html[dir="rtl"] body{direction:rtl}
.langsel{background:transparent;border:1px solid var(--line);border-radius:99px;padding:8px 10px;font:inherit;font-size:13px;color:var(--ink);margin-left:10px;cursor:pointer}
.loc-banner{position:relative;z-index:40;background:var(--paper);border-bottom:1px solid var(--line);padding:12px 52px 12px 20px;display:flex;gap:14px;align-items:center;justify-content:space-between}
.loc-msg{font-size:14px;color:var(--ink)}
.loc-btns{display:flex;gap:8px;flex-shrink:0}
.loc-x{position:absolute;top:6px;right:8px;border:0;background:none;font-size:22px;line-height:1;color:var(--ink2);cursor:pointer;padding:8px}
.loc-x:hover{color:var(--ink)}
@media(max-width:560px){.loc-banner{flex-direction:column;align-items:stretch;text-align:center}.loc-btns{justify-content:center}}
/* ---- locale chooser (Apple-style) ---- */
.loc-back{display:inline-block;margin-bottom:14px;color:var(--ink2);text-decoration:none;font-size:15px}
.loc-sec{font-size:13px;letter-spacing:.08em;text-transform:uppercase;color:var(--ink2);margin:30px 0 10px;font-weight:700}
.loc-list{background:#fff;border:1px solid var(--line);border-radius:16px;overflow:hidden}
.loc-row{display:flex;align-items:center;gap:14px;width:100%;padding:14px 18px;background:#fff;border:0;border-bottom:1px solid var(--line);font:inherit;color:var(--ink);cursor:pointer;text-align:left}
.loc-row:last-child{border-bottom:0}
.loc-row .tt{flex:1;min-width:0}
.loc-row .tt b{display:block;font-size:16px;font-weight:600}
.loc-row .tt small{color:var(--ink2);font-size:13px}
.loc-row .ck{color:var(--accent);font-weight:800;font-size:18px;visibility:hidden;flex:none}
.loc-row.on .ck{visibility:visible}
.loc-note{background:var(--amber-soft);border:1px solid var(--line);border-radius:16px;padding:16px 18px;color:var(--ink2);font-size:15px;line-height:1.6}
.loc-stick{position:sticky;top:66px;z-index:5;background:var(--paper);padding:12px 0;margin-top:18px}
.loc-search{width:100%;border:1px solid var(--line);border-radius:12px;padding:12px 14px;background:#fff;font-size:16px;box-sizing:border-box}
.loc-pills{display:flex;gap:8px;overflow-x:auto;padding:10px 2px 2px;-webkit-overflow-scrolling:touch}
.loc-pill{flex:none;border:1px solid var(--line);background:#fff;border-radius:999px;padding:8px 16px;font-size:13.5px;font-weight:600;cursor:pointer;color:var(--ink)}
.loc-pill.mine{background:var(--ink);border-color:var(--ink);color:#fff}
.loc-region{scroll-margin-top:150px}
.loc-reghead{font-size:13px;letter-spacing:.08em;text-transform:uppercase;color:var(--ink2);font-weight:700;padding:22px 2px 8px;position:sticky;top:var(--stick,150px);z-index:4;background:var(--paper)}
.loc-none{padding:22px 18px;color:var(--ink2);font-size:15px;background:#fff;border:1px solid var(--line);border-radius:16px;margin-top:14px;display:none}
@media(min-width:900px){.loc-grid{display:grid;grid-template-columns:1fr 1fr;gap:0 28px;align-items:start}}
.foot-loc{display:inline-block;color:var(--ink2);text-decoration:none;font-size:14px;margin-top:12px}
.foot-loc a{color:var(--ink2);text-decoration:none}
.foot-loc a:hover{color:var(--ink)}
.shop-loc{display:inline-block;margin-top:10px;color:var(--ink2);font-size:13px;text-decoration:none}
.shop-loc a{color:var(--ink2);text-decoration:none}
/* ---- shop themes ---- */
.shoptheme{--s-accent:var(--accent);--s-accent-deep:var(--accent-deep);}
.theme-ocean{--s-accent:#1E5AAF;--s-accent-deep:#123F82;}
.theme-plum{--s-accent:#7A2E5E;--s-accent-deep:#521D40;}
.theme-sunset{--s-accent:#B4531F;--s-accent-deep:#7E3A12;}
.theme-char{--s-accent:#3A3A35;--s-accent-deep:#23231F;}
.shoptheme .banner{background:var(--s-accent);}
.shoptheme .shop-mast .kicker{color:var(--s-accent);}
.shoptheme .order-btn{background:var(--s-accent);}
.shoptheme .shop-foot a{color:var(--s-accent);}
/* ---- shop: search, categories, products ---- */
.shop-tools{margin-bottom:4px;}
.shop-search{width:100%;border:1px solid var(--line);border-radius:12px;padding:12px 14px;margin-bottom:12px;background:#fff;font-size:16px;}
.chips{display:flex;gap:8px;overflow-x:auto;padding-bottom:8px;margin-bottom:8px;-webkit-overflow-scrolling:touch;}
.chip{flex:none;border:1px solid var(--line);background:#fff;border-radius:999px;padding:8px 18px;font-size:14px;cursor:pointer;color:var(--ink);}
.chip.on{background:var(--s-accent);border-color:var(--s-accent);color:#fff;font-weight:700;}
.prod2{display:block;padding:16px 0;border-bottom:1px dotted var(--line);}
.prod2:last-child{border-bottom:none;}
.prod2 .pn{font-size:17px;font-weight:600;display:flex;align-items:center;flex-wrap:wrap;gap:4px;}
.prod2 .pp{font-family:ui-monospace,Menlo,monospace;font-size:15px;white-space:nowrap;}
.prow1{display:flex;justify-content:space-between;align-items:baseline;gap:12px;}
.prow2{display:flex;gap:8px;justify-content:flex-end;align-items:center;margin-top:10px;flex-wrap:wrap;}
.stk{font-size:11px;font-weight:700;border-radius:999px;padding:3px 10px;margin-left:8px;white-space:nowrap;}
.stk-low{background:#FCF3DC;color:#8a5a00;}
.stk-out{background:#F1EFE7;color:#8a8577;}
.varsel{border:1px solid var(--line);border-radius:8px;padding:7px 8px;font-size:13.5px;background:#fff;max-width:170px;}
.ask-btn{font-size:13.5px;font-weight:600;color:var(--s-accent);text-decoration:underline;white-space:nowrap;background:none;border:0;cursor:pointer;padding:8px 6px;}
.add-btn:disabled{opacity:.35;cursor:not-allowed;}
.openbadge{display:inline-flex;align-items:center;gap:8px;margin-top:16px;font-size:14px;font-weight:700;border-radius:999px;padding:8px 18px;}
.ob-open{background:#E7F6EA;color:#14663a;}
.ob-closed{background:#F1EFE7;color:#6b675c;}
.openbadge .dot{width:8px;height:8px;border-radius:50%;background:currentColor;flex:none;}
/* ---- cart bar + drawer ---- */
.cartbar{position:fixed;left:0;right:0;bottom:0;z-index:60;padding:12px 16px calc(12px + env(safe-area-inset-bottom));background:rgba(255,255,255,.97);border-top:1px solid var(--line);}
.cartbar-btn{width:100%;max-width:560px;margin:0 auto;display:flex;justify-content:space-between;align-items:center;background:var(--s-accent,var(--accent));color:#fff;border:0;border-radius:14px;padding:15px 20px;font-size:16px;font-weight:700;cursor:pointer;}
@keyframes barpop{from{transform:translateY(14px);opacity:.35}to{transform:none;opacity:1}}
.cartbar.pop .cartbar-btn{animation:barpop .28s ease-out}
.add-btn{transition:transform .15s ease}
.add-btn.added{transform:scale(.94);}
/* ---- builder: progress dots ---- */
.bdots{display:flex;gap:10px;align-items:center;justify-content:center;margin:6px 0 22px;flex-wrap:wrap;}
.bdot{display:flex;align-items:center;gap:8px;color:var(--ink2);font-size:13px;font-weight:700;}
.bdot i{width:26px;height:26px;border-radius:50%;border:2px solid var(--line);display:inline-flex;align-items:center;justify-content:center;font-style:normal;font-size:13px;background:#fff;flex:none;}
.bdot.on{color:var(--ink);}
.bdot.on i{border-color:var(--accent);background:var(--accent);color:#fff;}
.bdot.done{color:var(--ink2);}
.bdot.done i{border-color:var(--accent);color:var(--accent);}
.bdot-sep{width:24px;height:2px;background:var(--line);}
/* ---- builder: product field rows ---- */
.pf-row{border:1px solid var(--line);border-radius:12px;padding:14px;margin-bottom:12px;background:#fff;}
.pf-top{display:flex;gap:8px;margin-bottom:10px;}
.pf-cat{flex:1;border:1px solid var(--line);border-radius:8px;padding:9px 10px;font-size:14px;background:#fff;min-width:0;}
.pf-newcat{flex:1;border:1px solid var(--line);border-radius:8px;padding:9px 10px;font-size:14px;min-width:0;}
.pf-del{flex:none;width:38px;border:1px solid var(--line);background:#fff;border-radius:8px;font-size:16px;cursor:pointer;color:var(--ink2);}
.pf-grid{display:flex;gap:8px;margin-bottom:10px;}
.pf-grid input{flex:1;border:1px solid var(--line);border-radius:8px;padding:10px 12px;font-size:15px;min-width:0;}
.pf-grid .pf-price{flex:0 0 120px;}
.pf-var{display:flex;gap:8px;margin-bottom:8px;}
.pf-var input{border:1px solid var(--line);border-radius:8px;padding:8px 10px;font-size:14px;min-width:0;}
.pf-var .pf-vname{flex:1;}
.pf-var .pf-vprice{flex:0 0 100px;}
.pf-vardel{flex:none;width:34px;border:1px solid var(--line);background:#fff;border-radius:8px;cursor:pointer;color:var(--ink2);}
.pf-pricewrap{position:relative;flex:0 0 120px;display:flex;min-width:0;}
.pf-grid .pf-pricewrap .pf-price{flex:1 1 auto;width:100%;padding-inline-start:26px;min-width:0;}
.pf-cur{position:absolute;inset-inline-start:10px;top:50%;transform:translateY(-50%);color:var(--ink2);font-size:15px;pointer-events:none;}
.pf-dup{flex:none;border:0;background:none;color:var(--s-accent,var(--accent));font-size:13px;font-weight:700;cursor:pointer;padding:0 2px;white-space:nowrap;}
.pf-err{color:#b3261e;font-size:13px;margin:-2px 0 10px;}
.pf-bad{border-color:#b3261e !important;}
.imp-vars,.imp-stock{font-size:13px;color:var(--ink2);margin-bottom:6px;}
.okmsg{background:#e6f4ea;color:#137333;border-radius:8px;padding:10px 12px;font-size:14px;}
.paste-toggle{background:none;border:1px dashed var(--line);border-radius:8px;color:var(--ink2);font-size:14px;padding:8px 12px;cursor:pointer;}
#pasteBox{margin-bottom:14px;}
.pf-addvar{background:none;border:0;color:var(--s-accent,var(--accent));font-weight:700;font-size:14px;cursor:pointer;padding:8px 0;}
.pf-oos{display:flex;align-items:center;gap:8px;font-size:14px;color:var(--ink2);margin-top:8px;cursor:pointer;}
.pf-oos input{width:18px;height:18px;accent-color:var(--s-accent,var(--accent));}
/* ---- builder: live storefront preview ---- */
.pv-frame{border:1px solid var(--line);border-radius:14px;overflow:hidden;margin-bottom:20px;background:var(--paper);}
.pv-bar{background:#F1EFE7;color:#8a8577;font-size:12px;font-weight:700;letter-spacing:.08em;padding:8px 14px;}
.pv-shop{max-height:480px;overflow:auto;}
.pv-card{display:flex;gap:12px;padding:12px 14px;border-bottom:1px solid var(--line);align-items:flex-start;}
.pv-img{width:64px;height:64px;border-radius:10px;background:#E7E4DA;flex:none;}
.pv-nm{font-weight:700;font-size:15px;line-height:1.35;}
.pv-pr{font-weight:800;margin-top:3px;font-size:15px;}
.pv-add{display:inline-block;margin-top:9px;background:var(--s-accent,var(--accent));color:#fff;font-weight:800;font-size:13px;border-radius:8px;padding:8px 24px;}
/* ---- storefront: product cards ---- */
.pc{display:flex;gap:14px;padding:16px 0;border-bottom:1px solid var(--line);}
.pc-img{width:88px;height:88px;border-radius:12px;background:#E7E4DA;flex:none;}
.pc-img{overflow:hidden;}
.pc-img img{width:100%;height:100%;object-fit:cover;display:block;}
.pv-img{overflow:hidden;}
.pv-img img{width:100%;height:100%;object-fit:cover;display:block;}
.shop-banner{aspect-ratio:3/1;overflow:hidden;background:#E7E4DA;}
.shop-banner img{width:100%;height:100%;object-fit:cover;display:block;}
.pf-img{margin-top:10px;}
.pf-imglab{font-size:12px;font-weight:700;color:var(--ink2);display:block;margin-bottom:6px;}
.pf-imgtop{display:flex;align-items:center;gap:10px;}
.pf-thumb{width:52px;height:52px;border-radius:10px;background:#E7E4DA;flex:none;overflow:hidden;border:1px solid var(--line);}
.pf-thumb img{width:100%;height:100%;object-fit:cover;display:block;}
.pf-bthumb{width:100%;max-width:280px;aspect-ratio:3/1;border-radius:10px;background:#E7E4DA;overflow:hidden;border:1px solid var(--line);}
.pf-bthumb img{width:100%;height:100%;object-fit:cover;display:block;}
.pf-imgbtns{display:flex;gap:6px;flex-wrap:wrap;}
.pf-imgbtn{font-size:12.5px;font-weight:700;padding:8px 12px;border-radius:9px;border:1px solid var(--line);background:#fff;cursor:pointer;color:var(--ink);}
.pf-imgbtn.on{background:var(--accent);border-color:var(--accent);color:#fff;}
.pf-catgrid{display:grid;grid-template-columns:repeat(6,1fr);gap:6px;margin-top:10px;}
.pf-catgrid button{aspect-ratio:1/1;border-radius:10px;overflow:hidden;border:2px solid var(--line);background:#F0EDE3;padding:0;cursor:pointer;}
.pf-catgrid button.on{border-color:var(--accent);}
.pf-catgrid img{width:100%;height:100%;object-fit:cover;display:block;pointer-events:none;}
.pf-urlrow{margin-top:10px;}
.pf-urlrow input{width:100%;}
.pf-imgerr{color:#B3261E;font-size:12.5px;margin-top:6px;}
.pc-mid{flex:1;min-width:0;}
.pc-name{font-weight:700;font-size:16px;line-height:1.35;}
.pc-price{font-weight:800;font-size:17px;margin-top:4px;}
.pc .varsel{margin-top:8px;}
.pc-act{margin-top:10px;display:flex;align-items:center;gap:12px;flex-wrap:wrap;}
.pc-add{background:var(--s-accent,var(--accent));color:#fff;border:0;border-radius:10px;padding:11px 36px;font-weight:800;font-size:15px;cursor:pointer;min-height:44px;}
.pc-add:disabled{opacity:.45;cursor:not-allowed;}
.pc-step{display:inline-flex;align-items:stretch;border:2px solid var(--s-accent,var(--accent));border-radius:10px;overflow:hidden;background:#fff;}
.pc-step button{width:44px;min-height:44px;border:0;background:var(--s-accent,var(--accent));color:#fff;font-size:20px;font-weight:800;cursor:pointer;}
.pc-step b{min-width:40px;display:inline-flex;align-items:center;justify-content:center;font-size:16px;background:#fff;}
/* ---- checkout: summary toggle, payment radios, sticky CTA ---- */
.ck-sumwrap{margin-bottom:16px;border:1px solid var(--line);border-radius:12px;background:#fff;overflow:hidden;}
.ck-sumtoggle{width:100%;display:flex;justify-content:space-between;align-items:center;border:0;background:#fff;padding:14px 18px;font-size:15px;font-weight:700;cursor:pointer;color:var(--ink);}
.ck-sumbody{border-top:1px solid var(--line);padding:8px 18px 14px;}
.ck-radio{display:flex;align-items:center;gap:12px;border:1px solid var(--line);border-radius:12px;padding:14px 16px;margin-bottom:10px;cursor:pointer;background:#fff;font-size:16px;font-weight:600;}
.ck-radio.on{border-color:var(--s-accent,var(--accent));box-shadow:0 0 0 1px var(--s-accent,var(--accent));}
.ck-radio input{width:20px;height:20px;accent-color:var(--s-accent,var(--accent));flex:none;margin:0;}
.ck-more{width:100%;background:none;border:0;color:var(--s-accent,var(--accent));font-weight:700;font-size:15px;padding:12px;cursor:pointer;}
.ck-sticky{position:fixed;left:0;right:0;bottom:0;z-index:60;background:rgba(255,255,255,.97);border-top:1px solid var(--line);padding:12px 16px calc(12px + env(safe-area-inset-bottom));}
.ck-sticky-in{max-width:560px;margin:0 auto;display:flex;align-items:center;gap:16px;}
.ck-sticky-tot{display:flex;flex-direction:column;line-height:1.3;flex:none;}
.ck-sticky-tot span{font-size:12px;color:var(--ink2);font-weight:600;}
.ck-sticky-tot b{font-size:19px;}
.ck-sticky .ck-paybtn{flex:1;margin:0;}
.ck-next{color:var(--ink2);font-size:15px;margin:12px 0 4px;}
.link-btn{background:none;border:0;color:var(--ink2);font-size:15px;font-weight:600;cursor:pointer;padding:12px 8px;text-decoration:underline;}

/* ---- mobile storefront UI (isMobileUI) ---- */
.msh-head{position:sticky;top:0;z-index:55;background:rgba(255,253,248,.97);backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);border-bottom:1px solid var(--line);}
.msh-head-in{display:flex;align-items:center;gap:10px;height:58px;padding:0 14px;}
.msh-name{flex:1;min-width:0;font-weight:800;font-size:17px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
.msh-badge{flex:none;}
.msh-badge .openbadge{margin-top:0;padding:6px 12px;font-size:12px;gap:6px;white-space:nowrap;max-width:40vw;overflow:hidden;text-overflow:ellipsis;}
.msh-sbtn{flex:none;width:42px;height:42px;border-radius:50%;border:1px solid var(--line);background:#fff;color:var(--ink);font-size:19px;line-height:1;cursor:pointer;display:flex;align-items:center;justify-content:center;}
.msh-searchrow{display:none;padding:10px 14px;background:var(--paper);border-bottom:1px solid var(--line);}
.msh-searchrow.open{display:block;}
.msh-searchrow .shop-search{margin-bottom:0;}
.msh-rail{position:sticky;top:58px;z-index:54;background:var(--paper);padding:10px 14px;border-bottom:1px solid var(--line);}
.msh-rail .chips{margin-bottom:0;padding-bottom:2px;}
.msh-rail .chip{padding:10px 18px;font-size:14px;}
.msh-body{padding:0 16px 140px;}
.msh-mast{padding:18px 0 6px;}
.msh-mast .kicker{font-family:ui-monospace,Menlo,monospace;font-size:11px;letter-spacing:3px;color:var(--s-accent);margin-bottom:8px;}
.msh-mast p{color:var(--ink2);font-size:15px;margin:0;line-height:1.5;}
.msh-sec{padding:24px 0;border-bottom:1px solid var(--line);}
.msh-sec h2{font-family:"Iowan Old Style",Palatino,Georgia,serif;font-size:22px;letter-spacing:-.5px;margin:0 0 4px;}
.msh-sec .sub{color:var(--ink2);font-size:14px;margin-bottom:14px;}
.msh-card{display:flex;gap:14px;padding:16px 0;border-bottom:1px solid var(--line);align-items:flex-start;}
.msh-card:last-child{border-bottom:0;}
.msh-img{width:84px;height:84px;flex:none;border-radius:14px;background:#E7E4DA;overflow:hidden;}
.msh-img img{width:100%;height:100%;object-fit:cover;display:block;}
.msh-mid{flex:1;min-width:0;}
.msh .pc-act{margin-top:8px;}
.msh .varsel{margin-top:8px;max-width:100%;}
.msh .shop-foot{padding-bottom:40px;}
.ck-wrap.mob{padding:20px 14px 120px;}
.ck-wrap.mob .ck-panel{padding:18px;}

/* ---- checkout page ---- */
.ck-wrap{max-width:1020px;margin:0 auto;padding:26px 18px 90px;}
.ck-backline{display:block;color:var(--ink2);text-decoration:none;font-size:14px;margin-bottom:10px;}
.ck-backline:hover{color:var(--ink);}
.ck-steps{display:flex;gap:6px;list-style:none;padding:0;margin:16px 0 24px;}
.ck-steps li{flex:1;text-align:center;font-size:13px;color:var(--ink2);padding:10px 4px;border-bottom:2px solid var(--line);font-weight:600;}
.ck-steps li.on{color:var(--ink);border-color:var(--s-accent,var(--accent));}
.ck-steps li.done{color:var(--s-accent,var(--accent));}
.ck-grid{display:grid;grid-template-columns:1fr;gap:22px;}
@media(min-width:860px){.ck-grid{grid-template-columns:1fr 330px;align-items:start;}.ck-side{position:sticky;top:18px;}}
.ck-panel{background:#fff;border:1px solid var(--line);border-radius:var(--r);padding:22px;}
.ck-side{background:#fff;border:1px solid var(--line);border-radius:var(--r);padding:20px;}
.ck-side h3{margin:0 0 6px;font-size:17px;}
.ck-line{display:flex;justify-content:space-between;gap:10px;padding:6px 0;font-size:14px;color:var(--ink);}
.ck-line .qn{color:var(--ink2);}
.ck-nav{display:flex;justify-content:space-between;align-items:center;gap:12px;margin-top:22px;}
.ck-tabs{display:flex;gap:8px;flex-wrap:wrap;margin:0 0 18px;}
.ck-tab{border:1px solid var(--line);background:#fff;border-radius:999px;padding:9px 16px;font-weight:600;font-size:14px;cursor:pointer;color:var(--ink);}
.ck-tab.on{background:var(--s-accent,var(--accent));border-color:var(--s-accent,var(--accent));color:#fff;}
.ck-err{background:#FDECEA;color:#A33A2E;border:1px solid #F0B9AC;border-radius:12px;padding:12px 14px;margin:14px 0;font-size:14px;}
.ck-test{background:var(--amber-soft);border:1px solid var(--amber);color:#7A5A12;border-radius:12px;padding:12px 14px;margin:0 0 16px;font-size:14px;}
.ck-paybtn{width:100%;background:var(--s-accent,var(--accent));color:#fff;border:0;border-radius:14px;padding:16px;font-size:17px;font-weight:700;cursor:pointer;display:flex;align-items:center;justify-content:center;gap:10px;margin-top:18px;}
.ck-paybtn:disabled{opacity:.65;cursor:wait;}
.ck-paybtn svg{flex:none;}
.ck-go{width:100%;background:var(--s-accent,var(--accent));color:#fff;border:0;border-radius:14px;padding:16px;font-size:17px;font-weight:700;cursor:pointer;margin-top:16px;}
.ck-field-err{color:#A33A2E;font-size:13px;margin-top:5px;}
.ck-bad{border-color:#C04532 !important;}
.ck-brand{font-size:12.5px;font-weight:700;color:var(--ink2);letter-spacing:.04em;text-transform:uppercase;}
.ck-cardrow{display:flex;justify-content:space-between;align-items:center;margin-bottom:8px;}
.ck-grid2{display:grid;grid-template-columns:1fr 1fr;gap:14px;}
.ck-stripebox{border:1px solid var(--line);border-radius:12px;padding:16px 14px;background:#fff;}
.ck-success{text-align:center;padding:44px 18px;max-width:520px;margin:0 auto;}
.ck-check{width:88px;height:88px;border-radius:50%;background:#E7F6EA;color:#14663a;font-size:46px;display:flex;align-items:center;justify-content:center;margin:0 auto 20px;font-weight:700;}
.ck-orderno{display:inline-block;background:var(--paper2);border:1px solid var(--line);border-radius:999px;padding:8px 18px;font-weight:700;letter-spacing:.06em;margin:12px 0 6px;}
.ck-btnrow{display:flex;gap:12px;justify-content:center;flex-wrap:wrap;margin-top:26px;}
@keyframes spin{to{transform:rotate(360deg)}}
.ck-spin{width:18px;height:18px;border:2.5px solid rgba(255,255,255,.45);border-top-color:#fff;border-radius:50%;animation:spin .7s linear infinite;flex:none;}
.ck-instr{background:var(--paper2);border:1px solid var(--line);border-radius:12px;padding:14px 16px;font-size:14px;color:var(--ink);margin-bottom:6px;}
.ck-instr pre{white-space:pre-wrap;font-family:inherit;margin:8px 0 0;font-size:13.5px;}
.drawer-wrap{position:fixed;inset:0;z-index:70;background:rgba(27,27,24,.5);}
.drawer{position:absolute;left:0;right:0;bottom:0;max-height:92dvh;overflow-y:auto;background:var(--paper);border-radius:20px 20px 0 0;padding:20px 20px calc(28px + env(safe-area-inset-bottom));-webkit-overflow-scrolling:touch;}
@media(min-width:760px){.drawer{left:50%;right:auto;transform:translateX(-50%);width:560px;border-radius:20px;margin-bottom:24px;max-height:86dvh;}}
.drawer-head{display:flex;justify-content:space-between;align-items:center;margin-bottom:8px;}
.drawer-x{border:0;background:none;font-size:28px;cursor:pointer;color:var(--ink2);padding:2px 10px;line-height:1;}
.cline{display:flex;align-items:center;gap:10px;padding:12px 0;border-bottom:1px dotted var(--line);}
.cline .cn{flex:1;min-width:0;}
.cline .cn b{display:block;font-size:15px;}
.cline .cn small{color:var(--ink2);font-size:13px;}
.cline .lt{font-family:ui-monospace,Menlo,monospace;font-size:14px;white-space:nowrap;}
.stepper{display:flex;align-items:center;gap:10px;flex:none;}
.stepper button{width:44px;height:44px;border-radius:50%;border:1px solid var(--line);background:#fff;font-size:18px;cursor:pointer;line-height:1;color:var(--ink);}
.stepper b{min-width:20px;text-align:center;}
.trow{display:flex;justify-content:space-between;gap:12px;padding:6px 0;font-size:15px;}
.trow.grand{font-weight:800;font-size:18px;border-top:1px solid var(--line);margin-top:8px;padding-top:12px;}
.trow .neg{color:#a33b2e;}
.coupon-row{display:flex;gap:8px;margin:12px 0;}
.coupon-row input{flex:1;border:1px solid var(--line);border-radius:10px;padding:11px 13px;min-width:0;}
.fulfill{display:flex;gap:8px;margin:10px 0 4px;}
.fulfill label{flex:1;text-align:center;border:1px solid var(--line);border-radius:12px;padding:11px;cursor:pointer;font-weight:600;font-size:15px;background:#fff;}
.fulfill label.on{border-color:var(--s-accent);box-shadow:inset 0 0 0 1px var(--s-accent);}
.fulfill input{position:absolute;opacity:0;pointer-events:none;}
.d-field{margin:12px 0;}
.d-field label{display:block;font-weight:600;font-size:14px;margin-bottom:6px;}
.d-field input,.d-field textarea,.d-field select{width:100%;border:1px solid var(--line);border-radius:10px;padding:12px 13px;background:#fff;font-size:16px;}
.d-sec{font-weight:700;font-size:16px;margin:22px 0 2px;}
.pay-opt{display:flex;gap:10px;align-items:flex-start;border:1px solid var(--line);border-radius:12px;padding:12px 14px;margin-bottom:8px;cursor:pointer;background:#fff;font-size:15px;}
.pay-opt.on{border-color:var(--s-accent);box-shadow:inset 0 0 0 1px var(--s-accent);}
.pay-opt input{margin-top:5px;flex:none;}
.pay-opt small{display:block;color:var(--ink2);font-weight:400;font-size:13px;}
.d-err{background:#FDF0EF;border:1px solid #E5B8B3;color:#8C2F28;border-radius:10px;padding:12px 14px;margin:12px 0;font-size:14px;}
.d-warn{background:var(--amber-soft);border:1px solid var(--line);border-radius:10px;padding:12px 14px;margin:12px 0;font-size:14px;}
.pay-instr{background:#fff;border:1px solid var(--line);border-radius:12px;padding:18px;margin:6px 0;font-size:15px;}
.pay-instr pre{white-space:pre-wrap;font-family:inherit;background:var(--paper);border-radius:8px;padding:10px 12px;margin-top:8px;font-size:14px;}
.upi-btn{display:inline-block;background:var(--s-accent);color:#fff !important;text-decoration:none;border-radius:999px;padding:12px 26px;font-weight:700;margin-top:10px;}
.wa-big{width:100%;background:#1FA855;border:0;color:#fff;border-radius:14px;padding:16px;font-size:17px;font-weight:800;cursor:pointer;margin-top:14px;}
.wa-big:disabled{opacity:.45;cursor:not-allowed;}
/* ---- builder extras ---- */
.sec-label{font-weight:700;font-size:17px;margin:32px 0 2px;}
.sec-sub{color:var(--ink2);font-size:14px;margin-bottom:12px;}
.hrs-row{display:grid;grid-template-columns:1fr auto auto auto;gap:8px;align-items:center;padding:9px 0;border-bottom:1px dotted var(--line);font-size:15px;}
.hrs-row input[type=time]{border:1px solid var(--line);border-radius:8px;padding:8px 6px;background:#fff;font-size:14px;}
.hrs-row input[type=time]:disabled{opacity:.35;}
.hrs-closed{display:flex;align-items:center;gap:6px;font-size:13.5px;color:var(--ink2);white-space:nowrap;}
.swatch-row{display:flex;gap:12px;flex-wrap:wrap;margin-top:6px;}
.swatch{width:54px;height:54px;border-radius:50%;border:3px solid transparent;cursor:pointer;padding:0;flex:none;}
.swatch.on{border-color:var(--ink);}
.pay-check{display:flex;gap:10px;align-items:flex-start;margin-bottom:14px;font-size:15px;}
.pay-check input{margin-top:5px;flex:none;width:18px;height:18px;}
.pay-check small{display:block;color:var(--ink2);font-weight:400;font-size:13px;}
.pay-detail{margin:-6px 0 16px 28px;}
@media(max-width:760px){
  .hrs-row{grid-template-columns:1fr 1fr;}
  .hrs-day{grid-column:1/-1;font-weight:600;}
}
</style>

  "pp_c3t":"మీ దుకాణ డేటా",
  "pp_c3b":"మీ స్టోర్‌ఫ్రంట్ కంటెంట్ నేరుగా మీ షేర్ లింక్‌లోనే ఎన్‌కోడ్ చేయబడుతుంది. దాన్ని స్వీకరించే లేదా నిల్వ చేసే సర్వర్ మాకు లేదు, కాబట్టి మీ దుకాణ వివరాలు, ధరలు లేదా ఆర్డర్లను మేము ఎప్పుడూ చూడము. కస్టమర్ ఆర్డర్ బటన్ నొక్కినప్పుడు, మీ బ్రౌజర్ మీ నంబర్‌కు ముందే నింపిన సందేశంతో వాట్సాప్‌ను తెరుస్తుంది. ఆ సంభాషణ మీకు, మీ కస్టమర్‌కు మధ్య జరుగుతుంది; TalkShop దానిలో భాగం కాదు.",

  "pp_c1b":"প্রায় কিছুই না। আপনার দেশ ও মুদ্রা সাজেস্ট করতে, আমরা ipapi.co-এর মাধ্যমে আপনার বর্তমান IP ঠিকানার দেশ দেখি। এটা শুধু দেশ-পর্যায়ের: আমরা কখনোই আপনার সঠিক অবস্থান চাই না বা পাই না। ফলাফলটা শুধু সাজেশনের জন্য ব্যবহার হয়, কোথাও সংরক্ষণ করা হয় না।",
  "pp_c2t":"আপনার ডিভাইসে যা থাকে",
  "pp_c2b":"আপনার ভাষা ও দেশের পছন্দ, এবং ক্যাশ করা মুদ্রা বিনিময় হার, আপনার ব্রাউজারের লোকাল স্টোরেজে সংরক্ষিত থাকে, যাতে সাইট আপনার পছন্দ মনে রাখে। এর বাইরে স্থানীয়ভাবে আর কিছু সংরক্ষণ করা হয় না। ব্রাউজার সেটিংসে এই সাইটের ডেটা মুছে যেকোনো সময় মুছে ফেলতে পারেন।",
  "pp_c3t":"আপনার দোকানের ডেটা",
  "pp_c3b":"আপনার স্টোরফ্রন্টের কনটেন্ট সরাসরি আপনার শেয়ার লিংকেই এনকোড করা থাকে। আমাদের কোনো সার্ভার এটা গ্রহণ বা সংরক্ষণ করে না, তাই আমরা কখনোই আপনার দোকানের তথ্য, দাম বা অর্ডার দেখি না। গ্রাহক অর্ডার বোতাম চাপলে, আপনার ব্রাউজার আপনার নম্বরে আগে থেকে লেখা মেসেজসহ হোয়াটসঅ্যাপ খুলে দেয়। সেই কথোপকথন আপনার ও আপনার গ্রাহকের মধ্যে হয়; TalkShop এর অংশ নয়।",

  "tos_c3b":"সেবার অপব্যবহার করবেন না: সাইট ব্যাহত করার চেষ্টা, অতিরিক্ত হারে স্ক্র্যাপিং, বা গ্রাহকের কাছে আপনার দোকান ভুলভাবে উপস্থাপন করবেন না। সবার জন্য সেবা চালু রাখতে আমরা অপব্যবহার ব্লক করতে পারি।",

  "pp_c1b":"ಬಹುತೇಕ ಏನೂ ಇಲ್ಲ. ನಿಮ್ಮ ದೇಶ ಮತ್ತು ಕರೆನ್ಸಿಯನ್ನು ಸೂಚಿಸಲು, ipapi.co ಮೂಲಕ ನಿಮ್ಮ ಪ್ರಸ್ತುತ IP ವಿಳಾಸದ ದೇಶವನ್ನು ನಾವು ನೋಡುತ್ತೇವೆ. ಇದು ದೇಶ ಮಟ್ಟಕ್ಕೆ ಮಾತ್ರ: ನಿಮ್ಮ ನಿಖರವಾದ ಸ್ಥಳವನ್ನು ನಾವು ಎಂದಿಗೂ ಕೇಳುವುದಿಲ್ಲ ಅಥವಾ ಪಡೆಯುವುದಿಲ್ಲ. ಸೂಚನೆಗಾಗಿ ಮಾತ್ರ ಫಲಿತಾಂಶವನ್ನು ಬಳಸಲಾಗುತ್ತದೆ ಮತ್ತು ಎಲ್ಲಿಯೂ ಸಂಗ್ರಹಿಸಲಾಗುವುದಿಲ್ಲ.",
  "pp_c2t":"ನಿಮ್ಮ ಸಾಧನದಲ್ಲೇ ಉಳಿಯುವುದು",
  "pp_c2b":"ನಿಮ್ಮ ಭಾಷೆ ಮತ್ತು ದೇಶದ ಆಯ್ಕೆಗಳು, ಮತ್ತು ಕ್ಯಾಶ್ ಮಾಡಿದ ಕರೆನ್ಸಿ ವಿನಿಮಯ ದರ, ನಿಮ್ಮ ಬ್ರೌಸರ್‌ನ ಲೋಕಲ್ ಸ್ಟೋರೇಜ್‌ನಲ್ಲಿ ಉಳಿಯುತ್ತವೆ, ಆದ್ದರಿಂದ ಸೈಟ್ ನಿಮ್ಮ ಆದ್ಯತೆಗಳನ್ನು ನೆನಪಿಟ್ಟುಕೊಳ್ಳುತ್ತದೆ. ಸ್ಥಳೀಯವಾಗಿ ಬೇರೇನೂ ಸಂಗ್ರಹಿಸಲಾಗುವುದಿಲ್ಲ. ನಿಮ್ಮ ಬ್ರೌಸರ್ ಸೆಟ್ಟಿಂಗ್‌ಗಳಲ್ಲಿ ಈ ಸೈಟ್‌ನ ಡೇಟಾವನ್ನು ತೆರವುಗೊಳಿಸುವ ಮೂಲಕ ನೀವು ಇದನ್ನು ಯಾವಾಗ ಬೇಕಾದರೂ ಅಳಿಸಬಹುದು.",
  "pp_c3t":"ನಿಮ್ಮ ಅಂಗಡಿ ಡೇಟಾ",
  "pp_c3b":"ನಿಮ್ಮ ಅಂಗಡಿ ಪುಟದ ವಿಷಯವನ್ನು ನೇರವಾಗಿ ನಿಮ್ಮ ಹಂಚಿಕೆ ಲಿಂಕ್‌ನಲ್ಲೇ ಎನ್‌ಕೋಡ್ ಮಾಡಲಾಗುತ್ತದೆ. ಅದನ್ನು ಸ್ವೀಕರಿಸುವ ಅಥವಾ ಸಂಗ್ರಹಿಸುವ ಸರ್ವರ್ ನಮ್ಮ ಬಳಿ ಇಲ್ಲ, ಆದ್ದರಿಂದ ನಿಮ್ಮ ಅಂಗಡಿ ವಿವರಗಳು, ಬೆಲೆಗಳು ಅಥವಾ ಆರ್ಡರ್‌ಗಳನ್ನು ನಾವು ಎಂದಿಗೂ ನೋಡುವುದಿಲ್ಲ. ಗ್ರಾಹಕರು ಆರ್ಡರ್ ಬಟನ್ ಒತ್ತಿದಾಗ, ನಿಮ್ಮ ಬ್ರೌಸರ್ ನಿಮ್ಮ ಸಂಖ್ಯೆಗೆ ಮೊದಲೇ ಬರೆದ ಸಂದೇಶದೊಂದಿಗೆ ವಾಟ್ಸಾಪ್ ತೆರೆಯುತ್ತದೆ. ಆ ಸಂಭಾಷಣೆ ನಿಮ್ಮ ಮತ್ತು ನಿಮ್ಮ ಗ್ರಾಹಕರ ನಡುವೆ ನಡೆಯುತ್ತದೆ; TalkShop ಅದರ ಭಾಗವಲ್ಲ.",
  "pp_c4t":"ಮೂರನೇ ಪಕ್ಷಗಳು",
  "pp_c4b":"ಮೂರು ಹೊರಗಿನ ಸೇವೆಗಳು ಭಾಗಿಯಾಗಿವೆ, ಪ್ರತಿಯೊಂದಕ್ಕೂ ಅದರದೇ ನೀತಿ ಇದೆ: ipapi.co (IP ವಿಳಾಸದಿಂದ ದೇಶ ಪತ್ತೆ), api.frankfurter.app (ಕರೆನ್ಸಿ ವಿನಿಮಯ ದರಗಳು), ಮತ್ತು ವಾಟ್ಸಾಪ್ (ನೀವು ಅಥವಾ ಗ್ರಾಹಕರು ಆರ್ಡರ್ ಅಥವಾ ಹಂಚಿಕೆ ಬಟನ್ ಒತ್ತಿದಾಗ ಮಾತ್ರ). ನಿಮ್ಮ ಅಂಗಡಿ ವಿಷಯವನ್ನು ನಾವು ಅವರಿಗೆ ಕಳುಹಿಸುವುದಿಲ್ಲ.",
  "pp_c5t":"ನಿಮ್ಮ ನಿಯಂತ್ರಣ",
  "pp_c5b":"ದೇಶದ ಸೂಚನೆ ಕೇವಲ ಸೂಚನೆ ಮಾತ್ರ: ಅದು ನಿಮ್ಮ ಸೆಟ್ಟಿಂಗ್‌ಗಳನ್ನು ಮೌನವಾಗಿ ಎಂದಿಗೂ ಬದಲಾಯಿಸುವುದಿಲ್ಲ, ಮತ್ತು ಬ್ಯಾನರ್‌ಗೆ ಮುಚ್ಚುವ ಬಟನ್ ಇದೆ. ಹೆಡರ್‌ನಿಂದ ದೇಶ, ಕರೆನ್ಸಿ ಮತ್ತು ಭಾಷೆಯನ್ನು ನೀವು ಯಾವಾಗ ಬೇಕಾದರೂ ನೀವೇ ಬದಲಾಯಿಸಬಹುದು.",

  "tos_c1t":"ಸೇವೆ",
  "tos_c1b":"TalkShop ಹಂಚಿಕೊಳ್ಳಬಹುದಾದ ಅಂಗಡಿ ಪುಟಗಳನ್ನು ರಚಿಸುವ ಉಚಿತ, ಸ್ವಯಂ-ಸೇವಾ ಸಾಧನ. ಇದು ಯಾವುದೇ ರೀತಿಯ ಖಾತರಿಯಿಲ್ಲದೆ, ಇರುವಂತೆಯೇ ಒದಗಿಸಲಾಗುತ್ತದೆ. ಸೇವೆಯ ಯಾವುದೇ ಭಾಗವನ್ನು ನಾವು ಯಾವಾಗ ಬೇಕಾದರೂ ಬದಲಾಯಿಸಬಹುದು, ಮಿತಿಗೊಳಿಸಬಹುದು ಅಥವಾ ನಿಲ್ಲಿಸಬಹುದು.",
  "tos_c2t":"ನಿಮ್ಮ ವಿಷಯ",

  "pp_c2b":"നിങ്ങളുടെ ഭാഷയും രാജ്യവും തിരഞ്ഞെടുക്കലുകൾ, കാഷ് ചെയ്ത കറൻസി വിനിമയ നിരക്ക് എന്നിവ സൈറ്റ് നിങ്ങളുടെ മുൻഗണനകൾ ഓർമ്മിക്കാൻ നിങ്ങളുടെ ബ്രൗസറിന്റെ ലോക്കൽ സ്റ്റോറേജിൽ സേവ് ചെയ്യുന്നു. ഇതല്ലാതെ മറ്റൊന്നും പ്രാദേശികമായി സംഭരിക്കുന്നില്ല. ബ്രൗസർ ക്രമീകരണങ്ങളിൽ ഈ സൈറ്റിന്റെ ഡാറ്റ മായ്ച്ച് എപ്പോൾ വേണമെങ്കിലും ഇത് ഇല്ലാതാക്കാം.",
  "pp_c3t":"നിങ്ങളുടെ കടയുടെ ഡാറ്റ",
  "pp_c3b":"നിങ്ങളുടെ കടയുടെ ഉള്ളടക്കം നേരിട്ട് നിങ്ങളുടെ ഷെയർ ലിങ്കിൽ തന്നെ എൻകോഡ് ചെയ്യപ്പെടുന്നു. അത് സ്വീകരിക്കുകയോ സംഭരിക്കുകയോ ചെയ്യുന്ന സെർവർ ഞങ്ങൾക്കില്ല, അതിനാൽ നിങ്ങളുടെ കട വിവരങ്ങൾ, വിലകൾ, ഓർഡറുകൾ എന്നിവ ഞങ്ങൾ ഒരിക്കലും കാണുന്നില്ല. ഒരു ഉപഭോക്താവ് ഓർഡർ ബട്ടൺ അമർത്തുമ്പോൾ, നിങ്ങളുടെ ബ്രൗസർ നിങ്ങളുടെ നമ്പറിലേക്ക് മുൻകൂട്ടി എഴുതിയ സന്ദേശവുമായി WhatsApp തുറക്കുന്നു. ആ സംഭാഷണം നിങ്ങൾക്കും നിങ്ങളുടെ ഉപഭോക്താവിനും ഇടയിലാണ്; TalkShop അതിന്റെ ഭാഗമല്ല.",
  "pp_c4t":"മൂന്നാം കക്ഷികൾ",
  "pp_c4b":"മൂന്ന് പുറം സേവനങ്ങൾ ഉൾപ്പെട്ടിട്ടുണ്ട്, ഓരോന്നിനും സ്വന്തം നയമുണ്ട്: ipapi.co (IP വിലാസത്തിൽ നിന്ന് രാജ്യം), api.frankfurter.app (കറൻസി വിനിമയ നിരക്കുകൾ), WhatsApp (നിങ്ങളോ ഉപഭോക്താവോ ഓർഡർ അല്ലെങ്കിൽ ഷെയർ ബട്ടൺ അമർത്തുമ്പോൾ മാത്രം). നിങ്ങളുടെ കടയുടെ ഉള്ളടക്കം ഞങ്ങൾ അവർക്ക് അയയ്ക്കുന്നില്ല.",
  "pp_c5t":"നിങ്ങളുടെ നിയന്ത്രണം",
  "pp_c5b":"രാജ്യ നിർദ്ദേശം വെറും നിർദ്ദേശം മാത്രമാണ്: അത് നിങ്ങളുടെ ക്രമീകരണങ്ങൾ നിശബ്ദമായി മാറ്റില്ല, ബാനറിൽ അടയ്ക്കാനുള്ള ബട്ടൺ ഉണ്ട്. ഹെഡറിൽ നിന്ന് രാജ്യം, കറൻസി, ഭാഷ എന്നിവ എപ്പോൾ വേണമെങ്കിലും നിങ്ങൾക്ക് തന്നെ മാറ്റാം.",
  "tos_title":"സേവന നിബന്ധനകൾ",
  "tos_intro":"TalkShop ഉപയോഗിക്കുന്നതിലൂടെ നിങ്ങൾ ഈ നിബന്ധനകൾ അംഗീകരിക്കുന്നു. അംഗീകരിക്കുന്നില്ലെങ്കിൽ ദയവായി സൈറ്റ് ഉപയോഗിക്കരുത്.",
  "tos_c1t":"സേവനം",
  "tos_c1b":"പങ്കിടാവുന്ന കട പേജുകൾ ഉണ്ടാക്കാനുള്ള സൗജന്യ, സെൽഫ്-സർവ് ഉപകരണമാണ് TalkShop. യാതൊരു വാറണ്ടിയുമില്ലാതെ, ഉള്ളതുപോലെ നൽകുന്നു. സേവനത്തിന്റെ ഏതെങ്കിലും ഭാഗം എപ്പോൾ വേണമെങ്കിലും മാറ്റാനോ പരിമിതപ്പെടുത്താനോ നിർത്താനോ ഞങ്ങൾക്ക് അവകാശമുണ്ട്.",
  "tos_c2t":"നിങ്ങളുടെ ഉള്ളടക്കം",
  "tos_c2b":"നിങ്ങൾ നൽകുന്ന കട ഉള്ളടക്കത്തിന്റെയും നിങ്ങൾ പങ്കിടുന്ന ലിങ്കുകളുടെയും ഉടമ നിങ്ങളാണ്. നിങ്ങളുടെ ഉള്ളടക്കം സത്യസന്ധവും നിയമപരവും മറ്റുള്ളവരുടെ അവകാശങ്ങൾ ലംഘിക്കാത്തതുമാണെന്ന് ഉറപ്പാക്കേണ്ടത് നിങ്ങളുടെ ഉത്തരവാദിത്തമാണ്. നിയമവിരുദ്ധമായ സാധനങ്ങൾക്കോ സേവനങ്ങൾക്കോ, തട്ടിപ്പിനോ, സ്പാമിനോ, ഉപദ്രവത്തിനോ TalkShop ഉപയോഗിക്കരുത്.",
  "tos_c3t":"സ്വീകാര്യമായ ഉപയോഗം",
  "tos_c3b":"സേവനം ദുരുപയോഗം ചെയ്യരുത്: സൈറ്റ് തടസ്സപ്പെടുത്താനോ, അമിത നിരക്കിൽ സ്ക്രേപ്പ് ചെയ്യാനോ, ഉപഭോക്താക്കളെ തെറ്റിദ്ധരിപ്പിക്കാനോ ശ്രമിക്കരുത്. എല്ലാവർക്കും സേവനം പ്രവർത്തിക്കാൻ ദുരുപയോഗം തടയാൻ ഞങ്ങൾക്ക് കഴിയും.",
  "tos_c4t":"ബാധ്യത",
  "tos_c4b":"നിയമം അനുവദിക്കുന്ന പരമാവധി പരിധിവരെ, സേവനത്തിന്റെ ഉപയോഗത്തിൽ നിന്നുണ്ടാകുന്ന ഏതൊരു നഷ്ടത്തിനും (നഷ്ടപ്പെട്ട ഓർഡറുകളോ ബിസിനസോ ഉൾപ്പെടെ) TalkShop ബാധ്യസ്ഥമല്ല. മൂന്നാം കക്ഷി സേവനങ്ങളുടെ (WhatsApp പോലുള്ളവ) നിങ്ങളുടെ ഉപയോഗം അവരുടെ സ്വന്തം നിബന്ധനകൾക്ക് വിധേയമാണ്.",

  "pp_title":"गोपनीयता नीति",
  "pp_intro":"TalkShop एक मुफ़्त टूल है जो आपकी दुकान के छोटे से विवरण को शेयर करने लायक स्टोर पेज में बदल देता है। यह पूरी तरह आपके ब्राउज़र में चलता है। कोई अकाउंट नहीं, कोई साइन-अप नहीं, और इस साइट पर कोई एनालिटिक्स या विज्ञापन ट्रैकर नहीं है।",
  "pp_c1t":"हम क्या लेते हैं",
  "pp_c1b":"लगभग कुछ नहीं। आपका देश और मुद्रा सुझाने के लिए हम ipapi.co के ज़रिए आपके मौजूदा IP पते का देश देखते हैं। यह सिर्फ देश-स्तर की जानकारी है: हम आपकी सटीक लोकेशन कभी नहीं मांगते या पाते। नतीजा सिर्फ सुझाव के लिए इस्तेमाल होता है और कहीं स्टोर नहीं होता।",
  "pp_c2t":"आपके डिवाइस पर क्या रहता है",
  "pp_c2b":"आपकी भाषा और देश की पसंद, और एक कैश्ड मुद्रा विनिमय दर, आपके ब्राउज़र के लोकल स्टोरेज में सेव होती है ताकि साइट आपकी पसंद याद रखे। इसके अलावा कुछ भी स्थानीय रूप से स्टोर नहीं होता। आप ब्राउज़र सेटिंग्स में साइट का डेटा साफ़ करके इसे कभी भी मिटा सकते हैं।",
  "pp_c3t":"आपकी दुकान का डेटा",
  "pp_c3b":"आपकी दुकान की सामग्री सीधे आपके शेयर लिंक में कोड की जाती है। हमारे पास इसे पाने या स्टोर करने वाला कोई सर्वर नहीं है, इसलिए हम आपकी दुकान का विवरण, कीमतें या ऑर्डर कभी नहीं देखते। जब कोई ग्राहक ऑर्डर बटन दबाता है, तो आपका ब्राउज़र आपके नंबर पर पहले से लिखा संदेश लेकर WhatsApp खोलता है। वह बातचीत आपके और आपके ग्राहक के बीच होती है; TalkShop उसका हिस्सा नहीं है।",
  "pp_c4t":"तीसरे पक्ष",
  "pp_c4b":"तीन बाहरी सेवाएं शामिल हैं, हर एक की अपनी नीति है: ipapi.co (IP पते से देश की जानकारी), api.frankfurter.app (मुद्रा विनिमय दरें), और WhatsApp (सिर्फ तब जब आप या कोई ग्राहक ऑर्डर या शेयर बटन दबाता है)। हम उन्हें आपकी दुकान की सामग्री नहीं भेजते।",
  "pp_c5t":"आपका नियंत्रण",
  "pp_c5b":"देश का सुझाव सिर्फ सुझाव है: यह आपकी सेटिंग्स चुपचाप कभी नहीं बदलता, और बैनर में बंद करने का बटन है। आप हेडर से कभी भी देश, मुद्रा और भाषा खुद बदल सकते हैं।",
  "tos_title":"सेवा की शर्तें",
  "tos_intro":"TalkShop का इस्तेमाल करके आप इन शर्तों से सहमत होते हैं। अगर आप सहमत नहीं हैं, तो कृपया साइट का इस्तेमाल न करें।",
  "tos_c1t":"सेवा",
  "tos_c1b":"TalkShop शेयर करने लायक स्टोर पेज बनाने का एक मुफ़्त, सेल्फ-सर्व टूल है। यह बिना किसी वारंटी के, जैसा है वैसा दिया जाता है। हम कभी भी सेवा के किसी हिस्से को बदल, सीमित या बंद कर सकते हैं।",
  "tos_c2t":"आपकी सामग्री",
  "tos_c2b":"आप जो दुकान की सामग्री डालते हैं और जो लिंक शेयर करते हैं, उसके मालिक आप हैं। यह आपकी ज़िम्मेदारी है कि आपकी सामग्री सच्ची, कानूनी हो और किसी और के अधिकारों का उल्लंघन न करे। अवैध सामान या सेवाओं, धोखाधड़ी, स्पैम या उत्पीड़न के लिए TalkShop का इस्तेमाल न करें।",
  "tos_c3t":"स्वीकार्य उपयोग",
  "tos_c3b":"सेवा का दुरुपयोग न करें: साइट को बाधित करने, गलत तरीके से स्क्रैप करने, या ग्राहकों को गुमराह करने की कोशिश न करें। सेवा सबके लिए चालू रखने हेतु हम दुरुपयोग को रोक सकते हैं।",
  "tos_c4t":"दायित्व",
  "tos_c4b":"कानून द्वारा अनुमत अधिकतम सीमा तक, सेवा के इस्तेमाल से होने वाले किसी भी नुकसान के लिए TalkShop ज़िम्मेदार नहीं है, जिसमें खोए हुए ऑर्डर या व्यापार भी शामिल है। तीसरे पक्ष की सेवाओं (जैसे WhatsApp) का आपका इस्तेमाल उनकी अपनी शर्तों से नियंत्रित होता है।",

  "pp_intro":"TalkShop உங்கள் கடையைப் பற்றிய சிறு விளக்கத்தைப் பகிரக்கூடிய கடைப் பக்கமாக மாற்றும் இலவசக் கருவி. இது முழுக்க உங்கள் உலாவியிலேயே இயங்குகிறது. கணக்குகள் இல்லை, பதிவு இல்லை, இந்தத் தளத்தில் பகுப்பாய்வு அல்லது விளம்பரக் கண்காணிப்பிகள் இல்லை.",
  "pp_c1t":"நாங்கள் சேகரிப்பது",
  "pp_c1b":"கிட்டத்தட்ட ஒன்றுமில்லை. உங்கள் நாடு மற்றும் நாணயத்தைப் பரிந்துரைக்க, ipapi.co மூலம் உங்கள் தற்போதைய IP முகவரியின் நாட்டைப் பார்க்கிறோம். இது நாடு அளவிலான தகவல் மட்டுமே: உங்கள் துல்லியமான இருப்பிடத்தை நாங்கள் ஒருபோதும் கேட்பதில்லை, பெறுவதில்லை. முடிவு பரிந்துரைக்கு மட்டும் பயன்படுத்தப்படுகிறது, எங்கும் சேமிக்கப்படுவதில்லை.",
  "pp_c2t":"உங்கள் சாதனத்தில் இருப்பது",
  "pp_c2b":"உங்கள் மொழி மற்றும் நாட்டுத் தேர்வுகள், மற்றும் சேமிக்கப்பட்ட நாணய மாற்று விகிதம் உங்கள் உலாவியின் உள்ளூர் சேமிப்பில் வைக்கப்படுகின்றன, தளம் உங்கள் விருப்பங்களை நினைவில் வைக்க. வேறு எதுவும் உள்ளூரில் சேமிக்கப்படுவதில்லை. உலாவி அமைப்புகளில் இந்தத் தளத்தின் தரவை நீக்கி எப்போது வேண்டுமானாலும் அழிக்கலாம்.",
  "pp_c3t":"உங்கள் கடைத் தரவு",
  "pp_c3b":"உங்கள் கடையின் உள்ளடக்கம் நேரடியாக உங்கள் பகிர் இணைப்பிலேயே குறியாக்கம் செய்யப்படுகிறது. அதைப் பெறும் அல்லது சேமிக்கும் சேவையகம் எங்களிடம் இல்லை, எனவே உங்கள் கடை விவரங்கள், விலைகள் அல்லது ஆர்டர்களை நாங்கள் ஒருபோதும் பார்ப்பதில்லை. வாடிக்கையாளர் ஆர்டர் பொத்தானை அழுத்தும்போது, உங்கள் உலாவி உங்கள் எண்ணுக்கு முன்பே எழுதிய செய்தியுடன் WhatsApp-ஐத் திறக்கிறது. அந்த உரையாடல் உங்களுக்கும் உங்கள் வாடிக்கையாளருக்கும் இடையே நடக்கிறது; TalkShop அதில் பங்கேற்காது.",
  "pp_c4t":"மூன்றாம் தரப்பினர்",
  "pp_c4b":"மூன்று வெளிச் சேவைகள் ஈடுபட்டுள்ளன, ஒவ்வொன்றுக்கும் தனிக் கொள்கை உண்டு: ipapi.co (IP முகவரியிலிருந்து நாடு), api.frankfurter.app (நாணய மாற்று விகிதங்கள்), WhatsApp (நீங்களோ வாடிக்கையாளரோ ஆர்டர் அல்லது பகிர் பொத்தானை அழுத்தும்போது மட்டும்). உங்கள் கடை உள்ளடக்கத்தை அவர்களுக்கு அனுப்புவதில்லை.",
  "pp_c5t":"உங்கள் கட்டுப்பாடு",
  "pp_c5b":"நாட்டுப் பரிந்துரை வெறும் பரிந்துரை மட்டுமே: அது உங்கள் அமைப்புகளை அமைதியாக மாற்றாது, அறிவிப்பில் மூடும் பொத்தான் உள்ளது. தலைப்புப் பட்டியிலிருந்து நாடு, நாணயம், மொழியை எப்போது வேண்டுமானாலும் நீங்களே மாற்றலாம்.",
  "tos_title":"சேவை விதிமுறைகள்",
  "tos_intro":"TalkShop-ஐப் பயன்படுத்துவதன் மூலம் இந்த விதிமுறைகளை ஏற்கிறீர்கள். உடன்படவில்லை என்றால் தளத்தைப் பயன்படுத்த வேண்டாம்.",
  "tos_c1t":"சேவை",
  "tos_c1b":"TalkShop பகிரக்கூடிய கடைப் பக்கங்களை உருவாக்கும் இலவச, தன்சேவைக் கருவி. எந்த உத்தரவாதமும் இன்றி, உள்ளபடியே வழங்கப்படுகிறது. சேவையின் எந்தப் பகுதியையும் எப்போது வேண்டுமானாலும் மாற்ற, கட்டுப்படுத்த அல்லது நிறுத்த எங்களுக்கு உரிமை உண்டு.",
  "tos_c2t":"உங்கள் உள்ளடக்கம்",
  "tos_c2b":"நீங்கள் உள்ளிடும் கடை உள்ளடக்கம் மற்றும் நீங்கள் பகிரும் இணைப்புகளுக்கு நீங்களே உரிமையாளர். உங்கள் உள்ளடக்கம் உண்மையானது, சட்டபூர்வமானது, மற்றவர்களின் உரிமைகளை மீறாதது என்பதை உறுதி செய்வது உங்கள் பொறுப்பு. சட்டவிரோதப் பொருட்கள் அல்லது சேவைகள், மோசடி, ஸ்பேம், துன்புறுத்தலுக்கு TalkShop-ஐப் பயன்படுத்த வேண்டாம்.",
  "tos_c3t":"ஏற்கத்தக்க பயன்",
  "tos_c3b":"சேவையைத் தவறாகப் பயன்படுத்த வேண்டாம்: தளத்தைச் சீர்குலைக்கவோ, அதிக விகிதத்தில் தரவெடுக்கவோ, வாடிக்கையாளர்களை ஏமாற்றவோ முயற்சிக்க வேண்டாம். அனைவருக்கும் சேவை இயங்க தவறான பயன்பாட்டைத் தடுக்கலாம்.",
  "tos_c4t":"பொறுப்பு",
  "tos_c4b":"சட்டம் அனுமதிக்கும் அதிகபட்ச அளவில், சேவையைப் பயன்படுத்துவதால் ஏற்படும் எந்த இழப்புக்கும் (இழந்த ஆர்டர்கள் அல்லது வணிகம் உட்பட) TalkShop பொறுப்பல்ல. மூன்றாம் தரப்புச் சேவைகளை (WhatsApp போன்றவை) நீங்கள் பயன்படுத்துவது அவர்களின் சொந்த விதிமுறைகளுக்கு உட்பட்டது.",

let fxCur = "USD", fxRate = 1;
try{ const s = JSON.parse(localStorage.getItem("ts_fx") || "null"); if(s && s.cur){ fxCur = s.cur; fxRate = s.rate || FX_FALLBACK[s.cur] || 1; } }catch(e){}
function fmt(usd){
  const locTag = (state.cc && CC_LOCALE[state.cc]) ? CC_LOCALE[state.cc] : (LOCALE_TAG[uiLang] || "en");
  try{ return new Intl.NumberFormat(locTag, { style:"currency", currency: fxCur }).format(usd * fxRate); }
  catch(e){ return fxCur + " " + (usd * fxRate).toFixed(2); }
}
async function setCurrency(cur, save){
  if(save === undefined) save = true;
  fxCur = cur;
  try{
    const r = await fetch("https://api.frankfurter.app/latest?from=USD&to=" + cur);
    const j = await r.json();
    fxRate = (j.rates && j.rates[cur]) ? j.rates[cur] : (FX_FALLBACK[cur] || 1);
  }catch(e){ fxRate = FX_FALLBACK[cur] || 1; }
  if(save){ try{ localStorage.setItem("ts_fx", JSON.stringify({ cur: fxCur, rate: fxRate })); }catch(e){} }
}
/* ---- country detection: IP geolocation only (country-level, no precise
   location). Deliberately NOT cached in localStorage: VPN/proxy changes take
   effect on a plain reload. In-memory for this page load only. The result is
   only a suggestion, never forced. If the lookup fails, no guess is made and
   the visitor picks manually from the header. ---- */
let _ipcc = null, _ipccDone = false;
async function ipCountry(){
  if(_ipccDone) return _ipcc;
  _ipccDone = true;
  try{
    const ctl = new AbortController();
    const timer = setTimeout(()=>ctl.abort(), 2500);
    const r = await fetch("https://ipapi.co/json/", { signal: ctl.signal });
    clearTimeout(timer);
    const j = await r.json();
    const cc = String((j && j.country_code) || "").toUpperCase();
    if(cc && COUNTRY[cc]){ _ipcc = cc; return cc; }
  }catch(e){}
  return null;
}
function suggestLangFor(cc){
  // Country-driven only: suggest the country's primary language when we ship a
  // translation for it and it is not the current UI language. null = no
  // translation available, so only currency is suggested.
  const cfg = COUNTRY[cc];
  if(cfg && cfg.lang && cfg.lang !== uiLang && STR[cfg.lang]) return cfg.lang;
  return null;
}

  else { try{ localStorage.setItem("ts_ui", l); }catch(e){} }

  try{ const s = JSON.parse(localStorage.getItem("ts_locale")||"null"); if(s){ cur = s.cur||cur; cc = s.cc||null; dismissed = !!s.dismissed; } }catch(e){}

function mountLocBanner(el){
  // In-flow strip at the very top of the page: it pushes content down and can
  // never overlap text or buttons. Scrolls away naturally with the page.
  document.body.insertBefore(el, document.body.firstChild);
  return ()=>{ el.remove(); };
}
let _detBannerDismissed = false;   // in-memory only: dismissal never persists
let _shopInfoShown = false;
function showDetectBanner(cc, cfg){
  // Builder/landing first load: suggest-only, never forces anything.
  if(document.getElementById("locBanner") || _detBannerDismissed) return;
  const nm = countryName(cc);
  const el = document.createElement("div");
  el.id = "locBanner"; el.className = "loc-banner";
  el.innerHTML = '<button class="loc-x" aria-label="'+t("close")+'">&times;</button>'
    + '<div class="loc-msg">'+t("loc_detect_msg").replace("{country}", nm)+'</div>'
    + '<div class="loc-btns"><button class="btn btn-sm btn-solid" id="locYes">'+t("loc_use_country").replace("{country}", nm)+'</button>'
    + '<button class="btn btn-sm" id="locOther">'+t("loc_choose_another")+'</button></div>';
  const bye = mountLocBanner(el);
  const dismiss = ()=>{ _detBannerDismissed = true; bye(); };
  document.getElementById("locYes").onclick = async ()=>{
    state.cc = cc;
    await setCurrency(cfg.cur);
    persistLocale();
    dismiss(); router();
  };
  document.getElementById("locOther").onclick = ()=>{ dismiss(); goLocale(); location.hash = "#/locale"; };
  el.querySelector(".loc-x").onclick = dismiss;
}
function showShopInfoBanner(shopCC, cfg){
  // Storefront: country is hard-locked to the shop, so this is information
  // only, plus a language escape hatch. Never offers a region switch.
  if(document.getElementById("locBanner") || _shopInfoShown) return;
  _shopInfoShown = true;
  const el = document.createElement("div");
  el.id = "locBanner"; el.className = "loc-banner";
  el.innerHTML = '<button class="loc-x" aria-label="'+t("close")+'">&times;</button>'
    + '<div class="loc-msg">'+t("loc_shop_msg").replace("{country}", countryName(shopCC)).replace("{cur}", cfg.cur)+'</div>'
    + '<div class="loc-btns"><button class="btn btn-sm btn-solid" id="locLang">'+t("loc_change_lang")+'</button></div>';
  const bye = mountLocBanner(el);
  document.getElementById("locLang").onclick = ()=>{ goLocale(); location.hash = "#/locale"; };
  el.querySelector(".loc-x").onclick = ()=>{ _detBannerDismissed = true; bye(); };
}
async function initLocale(){
  if(state.isShop){ applyLangHead(); return; }
  let saved = null;
  try{ saved = JSON.parse(localStorage.getItem("ts_locale")||"null"); }catch(e){}
  if(saved && saved.dismissed){
    if(saved.lang && STR[saved.lang]) uiLang = saved.lang;
    if(saved.cc && COUNTRY[saved.cc]) state.cc = saved.cc;
    if(saved.cur){ fxCur = saved.cur; fxRate = FX_FALLBACK[saved.cur]||1; setCurrency(saved.cur).then(()=>{ try{ router(); }catch(e){} }); }
    applyLangHead();
    return;
  }
  const cc = await ipCountry();
  if(!cc || cc === state.cc) return;
  showDetectBanner(cc, COUNTRY[cc]);
}
async function maybeShopInfoBanner(d){
  // Information-only banner on storefronts, shown when the detected region
  // differs from the shop's baked-in country. Fail silent on lookup failure.
  if(_shopInfoShown || document.getElementById("locBanner")) return;
  const loc = (d && d.loc) || {};
  const shopCC = (loc.cc && COUNTRY[loc.cc]) ? loc.cc : null;
  if(!shopCC) return;
  const cc = await ipCountry();
  if(!cc || cc === shopCC) return;
  showShopInfoBanner(shopCC, COUNTRY[shopCC]);
}

  if(!t) return d;
  // Sentence capture that does not break on decimal points like $4.50
  const SENT = "((?:[^.!?]|\\.(?=\\d))+)";
  const after = (pat) => { const m = t.match(new RegExp(pat + "\\s*" + SENT, "i")); return m ? m[1].trim() : ""; };
  // name
  let m = t.match(/(?:my|our)\s+(?:shop|store|business|salon|bakery|studio|restaurant|cafe|boutique|pharmacy)\s+(?:is\s+called|is|called)\s+([^.,!?]+)/i)
       || t.match(/(?:shop|store|business)\s+(?:name|called)\s+(?:is\s+)?([^.,!?]+)/i)
       || t.match(/(?:we are|we're|this is)\s+([A-Z][A-Za-z'& ]{1,40}?)(?:\.|,|!|\?|\s+and\s+we|\s+we\s)/);
  if(m) d.name = m[1].trim().replace(/\s+is\s*$/i,"");
  // products
  let prod = after("we sell") || after("(?:we offer|our products are|our menu includes|selling)") || after("(?:speciali[sz]e in|known for)");
  if(prod){
    d.products = prod.split(/,|\s+and\s+/).map(s=>s.trim()).filter(s=>s && s.length<60).slice(0,24)
      .map(item=>{
        const pm = item.match(/^(.*?)\s*(?:for\s*)?(\$\s?[\d.,]+(?:\s?(?:each|a piece))?)\s*$/);
        return pm ? {name:pm[1].trim().replace(/[:\u2013\u2014]\s*$/, ""), price:pm[2].trim()} : {name:item, price:""};
      }).filter(p=>p.name);
  }
  // hours
  let hrs = after("[^.!?]*\\bopen\\b") || after("[^.!?]*(?:opening\\s+)?\\bhours\\b");
  if(hrs) d.hours = hrs.replace(/^(we are|we're|and)\s+/i,"").trim();
  // phone
  m = t.match(/(\+\d[\d\s\-()]{6,}\d)/) || t.match(/\b(\d{3}[\s\-.]?\d{3}[\s\-.]?\d{4})\b/) || t.match(/\b(\d{10})\b/);
  if(m){ d.phone = m[1].trim(); d.whatsapp = m[1].trim(); }
  // address
  d.address = after("(?:located at|find us at|address is|we are at|we're at|visit us at)");
  // tagline: prefer what they make/serve, never the hours sentence
  let tag = after("we\\s+(?:offer|make|bake|serve|provide|speciali[sz]e in)");
  if(!tag){
    const first = t.split(/(?<!\d)\.(?!\d)|!|\?/)[0];
    if(first && first.length > 20 && first.length < 140 && !/my (shop|store)/i.test(first) && !/\bopen\b/i.test(first)) tag = first.trim();
  }
  if(tag && !/\.$/.test(tag)) tag += ".";
  d.tagline = tag || "";
  return d;
}

function dayName(dd){
  // dd: 0=Sunday .. 6=Saturday. 2026-09-27 is a Sunday.
  try{ return new Intl.DateTimeFormat(LOCALE_TAG[uiLang]||"en",{weekday:"long"}).format(new Date(2026,8,27+dd)); }
  catch(e){ return ["Sunday","Monday","Tuesday","Wednesday","Thursday","Friday","Saturday"][dd]; }
}
function fmtTime(hm){
  const m=String(hm||"").match(/(\d{1,2}):(\d{2})/);
  if(!m) return String(hm||"");
  try{ return new Intl.DateTimeFormat(LOCALE_TAG[uiLang]||"en",{hour:"numeric",minute:"2-digit"}).format(new Date(2026,0,1,+m[1],+m[2])); }
  catch(e){ return hm; }
}
function parseHM(s){
  const m=String(s||"").match(/(\d{1,2}):(\d{2})/);
  return m ? (+m[1])*60 + (+m[2]) : null;
}
function builderCur(){
  const bcc = state.cc || _ipcc || "US";
  return ((COUNTRY[bcc]||{}).cur) || "USD";
}
function curSymbol(code){
  try{
    const ps=new Intl.NumberFormat(LOCALE_TAG[uiLang]||"en",{style:"currency",currency:code}).formatToParts(0);
    for(const p of ps){ if(p.type==="currency"&&p.value) return p.value; }
  }catch(e){}
  return code;
}
function normPrice(s){
  let t=String(s==null?"":s);
  if(/[-–]/.test(t)) return null;
  t=t.replace(/[$€£₹¥,\s]/g,"");
  const v=parseNum(t);
  return (v==null||v<=0)?null:String(Math.round(v*100)/100);
}
function cartCountStr(n){ return t(n===1?"cart_one":"cart_other").replace("{n}",n); }
let importList=[];
function parseMenuImport(txt){
  const out=[]; let curCat="";
  String(txt||"").split("\n").forEach(raw=>{
    const line=raw.trim();
    if(!line) return;
    const hm=line.match(/^#\s*(.+)$/);
    if(hm){ curCat=hm[1].trim(); return; }
    const ps=parseProductsText(line);
    if(!ps.length) return;
    const p=ps[0];
    if(!p.cat&&curCat) p.cat=curCat;
    const np=normPrice(p.price); p.price=np==null?"":np;
    (p.variants||[]).forEach(v=>{ const nvp=normPrice(v.p); v.p=nvp==null?"":nvp; });
    out.push(p);
  });
  return out.slice(0,50);
}

function parseProductsText(txt){
  return String(txt||"").split("\n").map(l=>l.trim()).filter(Boolean).slice(0,30).map(line=>{
    let s=line, stock=null, cat=null, variants=null, m;
    // stock marker: trailing !low or !out
    m=s.match(/\s*!(low|out)\s*$/i);
    if(m){ stock=m[1].toLowerCase(); s=s.slice(0,m.index).trim(); }
    // variant block: trailing {Name: price, Name2: price2}
    m=s.match(/\s*\{([^}]*)\}\s*$/);
    if(m){
      variants=m[1].split(",").map(v=>v.trim()).filter(Boolean).map(v=>{
        const vm=v.match(/^(.*?)\s*:\s*(.+)$/);
        return vm ? {n:vm[1].trim(), p:vm[2].trim()} : {n:v, p:""};
      }).filter(v=>v.n).slice(0,8);
      s=s.slice(0,m.index).trim();
    }
    // category tag: trailing #Word
    m=s.match(/\s*#([^\s#{}!]+)\s*$/);
    if(m){ cat=m[1].trim(); s=s.slice(0,m.index).trim(); }
    // relaxed: "Cake - $4.50", "Cake: $28" (colon without spaces), but not "9:30"
    const pm = s.match(/^(.*?)\s+[-–:]\s+(.+)$/) || s.match(/^(.*\D)[-–:]\s*(.+)$/);
    let name=s, price="";
    if(pm && /^[$€£₹\d]/.test(pm[2].trim())){ name=pm[1].trim(); price=pm[2].trim(); }
    // bare price: "Coffee $3", "Samosa 15", "Cake 4.50" (name, space, number at end)
    if(!price){
      const pm3=s.match(/^(.*?)\s+([$€£₹]?\s*\d[\d,]*(?:\.\d+)?)\s*$/);
      if(pm3 && pm3[1].trim().length>=2){ name=pm3[1].trim(); price=pm3[2].trim(); }
    }
    const p={name:name, price:price};
    if(cat) p.cat=cat;
    if(stock) p.stock=stock;

function parseNum(s){
  let t=String(s==null?"":s).trim().replace(/\s/g,"");
  if(t.indexOf(",")>=0 && t.indexOf(".")<0) t=t.replace(",",".");
  t=t.replace(/[^0-9.]/g,"");

}
function parseCoupons(txt){
  return String(txt||"").split("\n").map(l=>l.trim()).filter(Boolean).slice(0,10).map(line=>{
    const m=line.match(/^(.*?)\s*=\s*(.+)$/);
    if(!m) return null;
    const code=m[1].trim().toUpperCase().replace(/\s+/g,"");
    const rhs=m[2].trim();
    const pm=rhs.match(/([\d.]+)\s*%/);
    if(pm && parseFloat(pm[1])>0) return {code:code, type:"pct", val:parseFloat(pm[1])};
    const fm=rhs.match(/([\d.]+)/);
    if(fm && parseFloat(fm[1])>0) return {code:code, type:"flat", val:parseFloat(fm[1])};
    return null;
  }).filter(c=>c && c.code);
}

let shopRT = null;

function openStatus(hrs){
  if(!hrs) return null;
  const now=new Date(), day=now.getDay(), mins=now.getHours()*60+now.getMinutes();
  const todays=hrs[day];
  if(todays){
    const o=parseHM(todays.o), c=parseHM(todays.c);
    if(o!=null && c!=null){
      const open = c>o ? (mins>=o && mins<c) : (mins>=o || mins<c);
      if(open) return {open:true};
    }
  }
  for(let i=0;i<8;i++){
    const dd=(day+i)%7, h=hrs[dd];
    if(!h) continue;
    const o=parseHM(h.o);
    if(o==null) continue;
    if(i===0 && mins>=o) continue;
    return {open:false, day:dd, time:h.o};
  }
  return {open:false};
}

function priceNum(p, vi){
  const v=(p.variants && vi!=null)?p.variants[vi]:null;

function cartTotals(){
  const RT=shopRT, d=RT.d;
  let sub=0;
  RT.cart.forEach(l=>{ const p=d.products[l.pi]; if(p) sub+=priceNum(p,l.vi)*l.qty; });
  let disc=0;
  const c=RT.coupon;
  if(c){
    if(c.type==="pct") disc=sub*c.val/100;
    else disc=Math.min(sub, RT.usdShop?c.val*fxRate:c.val);
  }
  const after=sub-disc;
  let fee=0;
  if(RT.fulfillment==="delivery" && d.dlv){
    const fv=RT.usdShop?(d.dlv.fee||0)*fxRate:(d.dlv.fee||0);
    if(d.dlv.freeAbove!=null){
      const fa=RT.usdShop?d.dlv.freeAbove*fxRate:d.dlv.freeAbove;
      fee=after>=fa?0:fv;
    } else fee=fv;
  }
  const total=Math.max(0, after+fee);
  const min=(d.dlv&&d.dlv.min!=null)?(RT.usdShop?d.dlv.min*fxRate:d.dlv.min):null;
  return {sub:sub, disc:disc, fee:fee, total:total, min:min, okMin:(min==null||after>=min), code:c?c.code:null};
}

function wireDrawer(){
  const RT=shopRT;
  const x=$("#drawerX");
  if(x) x.onclick=closeDrawer;
  const w=$("#drawerWrap");
  if(w) w.onclick=e=>{ if(e.target===w) closeDrawer(); };
  const dr=$(".drawer");
  if(!dr) return;
  dr.addEventListener("click", e=>{
    const inc=e.target.closest("[data-inc]"), dec=e.target.closest("[data-dec]");
    if(inc){ RT.cart[+inc.getAttribute("data-inc")].qty++; saveShop(); renderCartBar(); renderDrawer(); return; }
    if(dec){
      const l=RT.cart[+dec.getAttribute("data-dec")];
      if(l){ l.qty--; if(l.qty<=0) RT.cart.splice(RT.cart.indexOf(l),1); }
      saveShop(); renderCartBar(); renderDrawer(); return;
    }
    if(e.target.closest("#couponGo")){ applyCoupon(); return; }
    if(e.target.closest("#couponRm")){ RT.coupon=null; saveShop(); renderDrawer(); return; }
    if(e.target.closest("#checkoutBtn")){ saveShop(); closeDrawer(); location.hash="#/checkout/"+shopRT.payload; return; }
  });
  dr.addEventListener("keydown", e=>{
    if(e.target.id==="couponInp" && e.key==="Enter"){ e.preventDefault(); applyCoupon(); }
  });
}

/* card helpers: formatting, brand detect, luhn, expiry */
function fmtCard(v){
  const d=v.replace(/\D/g,"").slice(0,19);
  if(/^3[47]/.test(d)) return [d.slice(0,4),d.slice(4,10),d.slice(10,15)].filter(Boolean).join(" ");
  return (d.match(/.{1,4}/g)||[]).join(" ");
}
function cardBrand(v){
  const d=v.replace(/\D/g,"");
  if(/^4/.test(d)) return "Visa";
  if(/^(5[1-5]|2[2-7])/.test(d)) return "Mastercard";
  if(/^3[47]/.test(d)) return "Amex";
  if(/^(60|65|81|82)/.test(d)) return "RuPay";
  return "";
}
function luhnOk(num){
  if(!/^\d{13,19}$/.test(num)) return false;
  let s=0,alt=false;
  for(let i=num.length-1;i>=0;i--){ let x=+num[i]; if(alt){ x*=2; if(x>9)x-=9; } s+=x; alt=!alt; }
  return s%10===0;
}
function fmtExp(v){
  const d=v.replace(/\D/g,"").slice(0,4);
  if(d.length>2) return d.slice(0,2)+"/"+d.slice(2);
  return d;
}
function expOk(exp){
  const m=/^(\d{2})\/(\d{2})$/.exec(exp); if(!m) return false;
  const mm=+m[1], yy=+m[2]; if(mm<1||mm>12) return false;
  const now=new Date(), cy=now.getFullYear()%100, cm=now.getMonth()+1;
  return yy>cy||(yy===cy&&mm>=cm);
}

    s.src="https://js.stripe.com/v3/"; s.async=true;
    s.onload=res; s.onerror=rej;
    document.head.appendChild(s);
  });
  return _stripeLoading;
}

function ckValidDemoCard(){
  ck.ferr={};
  const cc=ck.cc||{};
  const digits=(cc.num||"").replace(/\D/g,"");
  if(!luhnOk(digits)) ck.ferr.num=t("ck_check");
  if(!expOk(cc.exp||"")) ck.ferr.exp=t("ck_check");
  if(!/^\d{3,4}$/.test(cc.cvc||"")) ck.ferr.cvc=t("ck_check");
  if(!(cc.name||"").trim()) ck.ferr.name=t("ck_check");
